  {cmd:'pv',usage:'pv [payment$] [rate%] [years]',eg:'pv 1000 6 30',run:a=>{const f=Math.max(1,Math.min(1e6,arg(a,0,100))),i=Math.max(0,Math.min(30,arg(a,1,5))),n=Math.round(Math.max(1,Math.min(50,arg(a,2,10))));
    return{fig:'back',a:[f,i,n],say:`PV = FV / (1 + i)^n = ${fmt2(f/Math.pow(1+i/100,n))}. Now raise the rate, or the years, and watch it shrink.`}}},
  {cmd:'bond',usage:'bond [face$] [coupon%] [rate%] [years]',eg:'bond 1000 5 4 5',run:a=>({fig:'stream',a:[arg(a,0,1000),arg(a,1,5),arg(a,2,3),arg(a,3,5)],say:'Each payment is discounted, then they are added. Run it again with a higher rate: the price falls. Rate equal to the coupon rate: price equals face value.'})},
  {cmd:'irr',usage:'irr [cost$] [payment$] [years]',eg:'irr 225 125 2',run:a=>({fig:'seek',a:[arg(a,0,1000000),arg(a,1,150000),arg(a,2,10)],say:'The internal rate of return is the rate where present value meets cost. Invest only if it beats your cost of borrowing. Try: irr 225 100 3'})},
  {cmd:'real',usage:'real [nominal%] [inflation%]',eg:'real 3 4',run:a=>{const i=Math.max(-5,Math.min(200,arg(a,0,5))),p=Math.max(-5,Math.min(200,arg(a,1,2))),x=((1+i/100)/(1+p/100)-1)*100;
    return{fig:'fisher',a:[i,p],say:`Shortcut: r = i - inflation = ${+(i-p).toFixed(2)}%. Exact: (1 + i) / (1 + inflation) - 1 = ${x.toFixed(2)}%. The gap is the cross-term. Try: real 105 100`}}}
 ],

 figs:{
  // grow(deposit, rate%, years): compounding year by year. Solid = deposit + simple interest, shaded = interest on interest.
  grow:(pv=100,i=5,n=10)=>{const cl=(v,a,b)=>Math.max(a,Math.min(b,+v||0));pv=cl(pv,1,1e5);i=cl(i,0,20);n=Math.round(cl(n,1,30));
   const r=i/100,m=v=>v>=1e5?fmt(v):fmt2(v),K=Math.min(n,10),ys=Array.from({length:K},(_,k)=>Math.round((k+1)*n/K)),fv=y=>pv*Math.pow(1+r,y),sv=y=>pv*(1+r*y),mx=fv(n),W=24;
   return{n:K+1,fps:2.2,hold:4500,r:f=>{const L=[` ${m(pv)} AT ${i}% A YEAR, LEFT TO COMPOUND`];
    ys.forEach((y,k)=>{if(k>=f){L.push('');return}const s=Math.round(sv(y)/mx*W),t=Math.max(s,Math.round(fv(y)/mx*W));L.push(' yr '+padS(y,2)+' '+padE(rep('█',s)+rep('▓',t-s),W)+' '+m(fv(y)))});
    const d=f>K;L.push(d?' █ deposit + simple interest  ▓ interest on interest':'',d?` year ${n}: ${m(mx)} with compounding`:'',d?` rate x years gives ${m(sv(n))}: short by ${m(mx-sv(n))}`:'');return L.join('\n')}}},

  // back(payment, rate%, years): walk a future payment back to today, one division at a time.
  back:(fv=100,i=5,n=10)=>{const cl=(v,a,b)=>Math.max(a,Math.min(b,+v||0));fv=cl(fv,1,1e6);i=cl(i,0,30);n=Math.round(cl(n,1,50));
   const r=i/100,b=+(1+r).toFixed(4),m=v=>v>=1e5?fmt(v):fmt2(v),K=n<=10?n:[10,9,8,7,6,5].find(d=>n%d===0)||10,ys=Array.from({length:K+1},(_,k)=>Math.round(n-k*n/K)),pv=y=>fv/Math.pow(1+r,n-y),W=22,TW=38;
   return{n:K+1,fps:1.7,hold:4800,r:f=>{const s=Math.min(f,K),p=Math.round((1-s/K)*(TW-1));let t=rep('─',TW);t=t.slice(0,p)+'●'+t.slice(p+1);
    const L=[` WHAT IS ${m(fv)} IN ${n} YEAR${n>1?'S':''} WORTH TODAY? (${i}%)`,' today ◀'+t+' year '+n];
    ys.forEach((y,k)=>{if(k>f){L.push('');return}const st=k?ys[k-1]-y:0;L.push(' '+padE(y===0?'today':'yr '+y,6)+padE(rep('█',Math.max(1,Math.round(pv(y)/fv*W))),W)+' '+m(pv(y))+(k===s&&k>0&&f<=K?'  ← ÷ '+b+(st>1?'^'+st:''):''))});
    L.push(f>K?` PV = ${m(fv)} / (${b})^${n} = ${m(pv(0))}`:'');return L.join('\n')}}},

  // race(rateA%, rateB%): two deposits of $100 race to $200. The rule of 72 in motion.
  race:(a=5,b=10)=>{const cl=(v,x,y)=>Math.max(x,Math.min(y,+v||0));a=cl(a,1,36);b=cl(b,1,36);
   const dy=i=>Math.ceil(Math.log(2)/Math.log(1+i/100)-1e-9),N=Math.max(dy(a),dy(b))+1,W=20,
    row=(i,y)=>{const d=dy(i),v=100*Math.pow(1+i/100,Math.min(y,d));return' '+padS(i+'%',4)+' ['+bar(Math.min(v,200)-100,100,W)+'] '+padE(fmt2(v),9)+(y>=d?'DOUBLED: yr '+d:'')};
   return{n:N,fps:Math.max(2.5,N/6),hold:4500,r:y=>[' RACE TO DOUBLE $100'+padS('year '+Math.min(y,N-1),26),row(a,y),row(b,y),` rule of 72:  72/${a} = ${+(72/a).toFixed(1)} yrs   72/${b} = ${+(72/b).toFixed(1)} yrs`,y>=N?' double the rate → half the wait':''].join('\n')}},

  // clip(face, coupon%, years): one coupon is clipped each year; the principal comes back with the last one.
  clip:(F=100,c=5,n=5)=>{const cl=(v,a,b)=>Math.max(a,Math.min(b,+v||0));F=cl(F,100,1000);c=cl(c,1,9);n=Math.round(cl(n,2,6));const cp=fmt(F*c/100);
   return{n:n+1,fps:1.1,hold:4500,r:f=>{const k=Math.min(f,n);return[' ┌─────────────────────────────┐',' │ '+padE(fmt(F)+' COUPON BOND',28)+'│',' │ '+padE(`coupon rate ${c}% · ${n} years`,28)+'│',' └─────────────────────────────┘',
    ' attached: '+rep('['+cp+']',n-k),' year  '+Array.from({length:n},(_,j)=>padE(j+1,6)).join(''),' paid  '+Array.from({length:n},(_,j)=>padE(j<k?cp:'.',6)).join('')+(k===n?'+ '+fmt(F):''),
    k===0?' each year the holder clips one coupon':k<n?` year ${k}: clip a coupon, collect ${cp}`:` year ${n} = maturity: last ${cp} coupon + ${fmt(F)} principal`].join('\n')}}},

  // stream(face, coupon%, rate%, years): every payment of a coupon bond discounted, then summed into the price.
  stream:(F=1000,c=5,i=3,n=5)=>{const cl=(v,a,b)=>Math.max(a,Math.min(b,+v||0));F=cl(F,100,1e5);c=cl(c,0,20);i=cl(i,0,30);n=Math.round(cl(n,1,30));
   const r=i/100,C=F*c/100,d=k=>Math.pow(1+r,k),m=v=>Number.isInteger(v)?fmt(v):fmt2(v),row=(a,b,x,y)=>' '+padE(a,7)+padS(b,13)+padS(x,11)+padS(y,14),R=[];let pc=0;
   const one=k=>{const v=C/d(k);pc+=v;R.push(row('yr '+k,m(C),d(k).toFixed(4),fmt2(v)))};
   if(n<=8)for(let k=1;k<=n;k++)one(k);else{for(let k=1;k<=5;k++)one(k);let s=0;for(let k=6;k<=n;k++)s+=C/d(k);pc+=s;R.push(row('yr 6-'+n,(n-5)+' x '+m(C),'...',fmt2(s)))}
   const pp=F/d(n),P=pc+pp,K=R.push(row('yr '+n,'face '+m(F),d(n).toFixed(4),fmt2(pp)));
   return{n:K+1,fps:1.5,hold:5200,r:f=>{const L=[` ${n}-YEAR ${c}% COUPON BOND · FACE ${fmt(F)} · RATE ${i}%`,row('WHEN','PAYMENT','÷ (1+i)^n','VALUE TODAY'),' '+rep('─',45)];R.forEach((x,k)=>L.push(k<f?x:''));const e=f>K;
    L.push(' '+rep('─',45),e?` coupons ${fmt2(pc)} + principal ${fmt2(pp)}`:'',e?` PRICE = ${fmt2(P)}  (${i<c?'above face: rate < coupon rate':i>c?'below face: rate > coupon rate':'at face: rate = coupon rate'})`:'');return L.join('\n')}}},

  // sweep(): the interest rate sweeps from 1% to 10% and back; a 5-year and a 30-year 5% coupon bond are repriced.
  sweep:()=>{const P=(i,n)=>{const r=i/100;let s=0;for(let k=1;k<=n;k++)s+=5/Math.pow(1+r,k);return s+100/Math.pow(1+r,n)},N=36,W=24;
   return{n:N*2,fps:6,hold:0,intro:N,r:f=>{const p=f<=N?f/N:(2*N-f)/N,i=1+9*p,up=f>0&&f<=N,dn=f>N&&f<2*N,a=up?' ▲':dn?' ▼':'',z=up?' ▼':dn?' ▲':'';
    return[' TWO 5% COUPON BONDS, FACE $100 (illustrative)',' interest rate  '+bar(i,10,W)+' '+i.toFixed(1)+'%'+a,' 5-year price   '+bar(P(i,5),210,W)+' '+fmt2(P(i,5))+z,' 30-year price  '+bar(P(i,30),210,W)+' '+fmt2(P(i,30))+z,
     ' '+(Math.abs(i-5)<.13?'rate = coupon rate: both worth face value, $100':i<5?'rate below 5%: both worth more than face value':'rate above 5%: both worth less than face value'),' rate up → price down · the long bond moves most'].join('\n')}}},

  // seek(cost, payment, years): hunt for the internal rate of return, the rate where PV of the payments equals the cost.
  seek:(cost=1e6,pay=150000,n=10)=>{const cl=(v,a,b)=>Math.max(a,Math.min(b,+v||0));cost=cl(cost,1,1e8);pay=cl(pay,1,1e8);n=Math.round(cl(n,1,60));
   const pv=i=>Math.abs(i)<1e-9?pay*n:pay*(1-Math.pow(1+i,-n))/i,ok=pv(-.99)>cost;let lo=-.99,hi=1;while(pv(hi)>cost&&hi<1e9)hi*=2;for(let k=0;k<90;k++){const md=(lo+hi)/2;pv(md)>cost?lo=md:hi=md}
   const irr=(lo+hi)/2,N=20,W=22,mx=Math.max(pv(0),cost),pc=v=>(Math.abs(v)<5e-5?0:v*100).toFixed(2)+'%';
   return{n:N,fps:4,hold:5000,r:f=>{const e=f>=N,i=irr*f/N,v=e&&ok?cost:pv(i);return[` ${n} PAYMENT${n>1?'S':''} OF ${fmt(pay)} · COST TODAY ${fmt(cost)}`,` try i = ${pc(i)}`,' PV of payments '+bar(v,mx,W)+' '+fmt(v),' cost today     '+bar(cost,mx,W)+' '+fmt(cost),
    e?(ok?` PV = cost at i = ${pc(irr)}`:' no sensible rate: the payments are far too small'):v>cost?' PV above cost → try a higher rate':' PV below cost → try a lower rate',e&&ok?' that rate is the INTERNAL RATE OF RETURN':''].join('\n')}}},

  // fisher(nominal%, inflation%): inflation rises from zero and eats into the nominal return; what is left is the real rate.
  fisher:(i=5,p=2)=>{const cl=(v,a,b)=>Math.max(a,Math.min(b,+v||0));i=cl(i,-5,200);p=cl(p,-5,200);
   const N=16,W=24,mx=Math.max(Math.abs(i),Math.abs(p),Math.abs(i-p),1),sg=v=>{const s=Math.abs(v).toFixed(1);return(v<0&&+s>0?'-':'')+s+'%'},bw=v=>Math.round(Math.abs(v)/mx*W);
   return{n:N+1,fps:5,hold:4800,r:f=>{const q=p*Math.min(1,f/N),r=i-q,e=f>N;return[' WHAT INFLATION LEAVES OF A NOMINAL RETURN',' nominal    '+padE(rep('█',bw(i)),W)+' '+sg(i),' inflation  '+padE(rep('▒',bw(q)),W)+' '+sg(q),' real       '+padE(rep(r<0?'░':'█',bw(r)),W)+' '+sg(r)+(r<=-.05?'  NEGATIVE':''),
    e?` r = i - expected inflation = ${sg(i)} - ${p<0?'('+sg(p)+')':sg(p)} = ${sg(i-p)}`:' inflation eats into the nominal return...',e?(i-p<=-.05?' the lender gets back less buying power than was lent':i-p<.05?' the lender gains nothing in buying power':' what is left is the gain in buying power'):''].join('\n')}}}
 }
});

BOOK.add({n:11,short:'Financial Intermediation',
boss:{name:'THE LEMON',art:LEMON.split('\n'),taunts:["Sour, isn't it?","I knew you skimmed that part.","Average answer. I'll pay average.","Hidden attributes: you didn't study."]},
modules:[
{id:'big-picture',title:'THE BIG PICTURE',secs:[
 {h:'What I am',beats:[["A *financial intermediary* stands in the middle. On one side: savers with spare money. On the other: borrowers who can put money to work.","Banks, insurers, pension funds, brokers, mutual funds: all intermediaries."],{fig:'flow'},["That is *indirect finance*. I owe the savers. The borrowers owe me. Saver and borrower never have to meet."],{fig:'direct'},["And that is *direct finance*: the borrower sells a stock or bond straight to the saver in a financial market. Money one way, securities the other."]],
  q:[mc("A company sells newly issued bonds straight to investors in the bond market. This is:",["direct finance","indirect finance","internal finance","deposit finance"],"No institution's balance sheet sits in the middle, so it is direct."),tf("True or false: in indirect finance, a third party stands between the saver and the borrower.",true,"That third party is the intermediary.")],line:"indirect finance runs through an intermediary"},
 {h:'Why anyone should care',beats:[["The financial system is plumbing. When it works, nobody notices. When it breaks, you get an expensive mess."],["Great Depression: banks closed, then unemployment passed *25 percent* and economic activity fell by nearly *a third*. Asia in 1997 and the crisis of 2007-2009 told the same story."],{fig:'crisis'},["Across countries, financial development and income per person move together. The correlation is about *0.6*. Rich countries have deep financial systems."],{fig:'scatter'}],

 {h:'Banks versus markets',beats:[["How big are bank loans next to stock and bond markets? To compare countries, measure everything as a percent of GDP.","*Loans-to-securities ratio = C / (A + B)*","A = stock market value.  B = debt securities.  C = credit from banks."],{fig:'ratio'},["France: 86.7 / (63.3 + 45.2) = *0.80*. Below 1, so markets are a bit bigger than loans there. China's 1.90 means loans dominate.","Trap: these numbers can add up to far more than 100% of GDP. They are not pieces of GDP. A firm is often worth several years of its sales."]],
  q:[nm("Stocks are 80% of GDP, debt securities 40%, bank credit 90%. What is the loans-to-securities ratio? (two decimals)",.75,"90 / (80 + 40) = 0.75"),nm("Stocks are 50% of GDP, debt securities 50%, bank credit 150%. Loans-to-securities ratio?",1.5,"150 / (50 + 50) = 1.50")],line:"bank credit divided by stocks plus bonds"},
 {h:'The eBay puzzle',beats:[["You can buy almost anything on eBay. But nobody auctions off a mortgage there. Why not?"],["Problem one: *transactions costs*. Mort needs $100,000. Finding 100 strangers with $1,000 each, writing the contracts, collecting the payments... a nightmare.","Problem two: *information costs*. Can Mort repay? Will he even buy a house? Strangers can't cheaply find out."],{fig:'ebay'},["Institutions like me exist to cut those two costs. Remember them. The whole chapter hangs on them."]],

{id:'five-jobs',title:'THE FIVE JOBS',secs:[

  q:[mc("Which job is NOT mainly about cutting transactions costs?",["Collecting and processing information","Providing liquidity","Pooling savings","Diversifying risk"],"Information is in a category of its own."),fill("Please Save Lots, Diversify Intelligently. The L stands for providing ___.",["liquidity"],"Pooling, Safekeeping, Liquidity, Diversification, Information.")],line:"pooling safekeeping liquidity diversification information"},
 {h:'Job 1: pooling',beats:[["Pooling: I take many small deposits and turn them into one big loan.","*Savers needed = loan size / deposit size*"],{fig:'pool'},["To pull that off I need lots of savers, so I must look safe. Once that meant thick vault doors. Today it means reputation and deposit insurance."]],
  q:[nm("A borrower needs $250,000. Each saver deposits $500. How many savers must be pooled?",500,"250,000 / 500 = 500 savers"),nm("A $100,000 loan is funded by $2,000 deposits. How many savers?",50,"100,000 / 2,000 = 50 savers")],line:"many small deposits become one large loan"},
 {h:'Job 2 and the scale trick',beats:[["Goldsmiths were the first bankers. People stored gold with them for a receipt. Then people traded the receipts. Then the goldsmith lent out the idle gold. A bank was born.","Today I keep your money safe, plug you into the *payments system*, and keep your accounts."],{fig:'goldsmith'},["My trick is *economies of scale*: average cost falls as quantity rises.","*Average cost = total cost / quantity*","Say a lawyer charges $5,000 once for a great loan contract, then $2 each time I use it. (Illustrative numbers.)"],{fig:'scale'}],
  q:[mc("One contract, reused for thousands of customers, so the cost per customer keeps falling. This is:",["economies of scale","comparative advantage","diversification","adverse selection"],"Average cost falls as quantity rises."),tf("True or false: with economies of scale, average cost RISES as the quantity produced rises.",false,"It falls.")],line:"average cost falls as quantity rises"}]},
{id:'liquidity-diversification',title:'LIQUIDITY AND DIVERSIFICATION',secs:[
 {h:'Job 3: liquidity',beats:[["*Liquidity* is how quickly and cheaply an asset turns into a means of payment. An ATM turns your balance into cash on demand."],["How do I promise instant cash when my money is tied up in long loans? Same way an insurer survives: not every driver crashes on the same day, and *not every depositor withdraws on the same day*.","So I keep a slice in short-term liquid assets and lend the rest long-term at higher rates. You get liquidity and a better return."],{fig:'liquidity'},["I also sell liquidity as a *line of credit*: a pre-approved loan you draw on when needed. Unlike a deposit, you can take out more than you put in."]],
  q:[mc("A bank can offer instant withdrawals while making long-term loans because:",["not all depositors withdraw at the same time","loans can be called in overnight","deposit insurance pays the withdrawals","it never lends out deposits"],"So a modest liquid cushion is enough."),tf("True or false: with a line of credit, withdrawals can exceed your deposit balance.",true,"It is a pre-approved loan.")],line:"not every depositor withdraws on the same day"},
 {h:'Job 4: diversification',beats:[["Don't put all your eggs in one basket. Watch six simulated years. Same money, lent two ways. (o = repaid, # = default)"],{fig:'diversify'},["The average loss is about the same either way. What changes is the *disaster*. One loan can wipe you out. Fifty rarely move much.","Textbook version: 1,000,000 depositors x $1,000 = $1 billion, lent as 10,000 loans. Each deposit has just *10 cents* in each loan."],["Mutual funds do it for stocks. One share of each S&P 500 firm at $40 to $60 would cost over *$20,000*. A fund sells you a sliver of all 500."]],
  q:[nm("A bank spreads each $1,000 deposit evenly across 10,000 loans. How many dollars sit in each loan?",.1,"1,000 / 10,000 = $0.10. Ten cents."),mc("Spreading money across many borrowers mainly:",["cuts the chance of a disastrous loss","raises the average interest rate earned","guarantees no borrower defaults","removes the need to screen borrowers"],"The average loss stays about the same. The disasters go away.")],line:"spread the money and the disasters disappear"}]},
{id:'asymmetric-information',title:'ASYMMETRIC INFORMATION',secs:[
 {h:'The information gap',beats:[["Here is my real problem. The borrower always knows more than I do: about their business, their plans, their honesty.","That gap is *asymmetric information*. It makes financial markets some of the hardest markets to run."],{fig:'gap'},["eBay had the same problem with strangers selling to strangers. Its two fixes: a *feedback forum*, so sellers build a reputation, and *buyers' insurance*, in case the seller takes the money and runs.","Hold that thought. Banks do the same two things under other names."]],
  q:[fill("When one side of a deal knows more than the other, there is ___ information.",["asymmetric"],"Asymmetric means unequal."),mc("Asymmetric information in lending means:",["borrowers know more about themselves than lenders do","lenders know more than borrowers","both sides know everything","nobody knows the interest rate"],"The borrower holds the hidden knowledge.")],line:"the borrower knows more than the lender"},
 {h:'Before and after',beats:[["That gap causes two different problems. The trick is *when* each one strikes."],{fig:'timeline'},["*Adverse selection*: BEFORE the deal. Hidden *attributes*. I can't tell good borrowers from bad, and the worst ones are the most eager to borrow.","*Moral hazard*: AFTER the deal. Hidden *actions*. I can't see what you do with my money."],["Hook: *A*dverse selection comes first, like A in the alphabet, and is about *A*ttributes. *M*oral hazard comes later and is about *M*isbehaviour.","On eBay: 'Is this item as described?' is adverse selection. 'Will the seller ship it?' is moral hazard."]],
  q:[mc("Adverse selection arises ___ the deal and concerns hidden ___.",["before / attributes","before / actions","after / attributes","after / actions"],"Before, attributes. Moral hazard is after, actions."),mc("A firm takes a loan for equipment, then quietly bets it on the stock market. This is:",["moral hazard","adverse selection","the free-rider problem","diversification"],"A hidden action after the deal.")],line:"adverse selection before moral hazard after"}]},
{id:'adverse-selection',title:'ADVERSE SELECTION',secs:[
 {h:'The market for lemons',beats:[["George Akerlof, 1970 (Nobel Prize, 2001). Two used cars. A *peach* worth $20,000 and a *lemon* worth $10,000. Owners know which is which. Buyers don't."],{fig:'lemons'},["*Offer = share of peaches x peach value + share of lemons x lemon value*","0.5 x $20,000 + 0.5 x $10,000 = *$15,000*. Too low for the peach owner. The good car leaves. Only the lemon is left.","That is adverse selection: when buyers can't see quality they pay the average, and the average drives out the good."],["The cure is information: history reports, mechanics, dealer reputations, warranties. Once buyers can see quality, both cars sell at their true value."]],
  q:[nm("Half the cars are peaches worth $20,000 and half are lemons worth $10,000. Buyers can't tell. What do they offer, in dollars?",15000,"0.5 x 20,000 + 0.5 x 10,000 = 15,000",'$'),nm("80% of cars are peaches worth $20,000; 20% are lemons worth $10,000. Buyers can't tell. What do they offer?",18000,"0.8 x 20,000 + 0.2 x 10,000 = 18,000. If peach owners accept that, the market survives.",'$')],line:"buyers pay the average so the good cars leave"},
 {h:'Lemons in stocks and bonds',beats:[["Same story in finance. Two firms, one good, one bad. Investors can't tell, so they pay an average price for shares. The good firm's stock is undervalued, so it doesn't issue any. Only the bad firm is left."],["Bonds too. Risk needs compensation, so risky borrowers should pay more. If I can't tell who is who, I charge everyone the average.","*Pooled rate = risk-free rate + average risk premium*"],{fig:'bonds'},["Safe firms are overcharged, so they walk. I am left holding the risky ones. Nobody wants that, so the market can vanish."]],
  q:[nm("The risk-free rate is 5%. Safe firms deserve a 2% premium, risky firms 6%. Equal numbers, and you can't tell them apart. What rate (%) do you charge?",9,"5 + (2 + 6) / 2 = 9%",'%'),mc("When everyone is charged that pooled rate, who leaves the market?",["the safe firms","the risky firms","both types","neither type"],"Safe firms are overcharged. Risky firms get a bargain and stay.")],line:"good borrowers leave when everyone pays the average rate"},
 {h:'Your first credit card',beats:[["Adverse selection, real life edition: your first credit card. No credit history, so the issuer assumes the worst and lumps you in with people who can't get credit anywhere else. Sky-high rate."],{fig:'card'},["Why society cares: when good firms can't get fair financing, good investments never happen, and the economy grows more slowly."]],
  q:[mc("A first credit card carries a very high rate mainly because of:",["adverse selection: no history, so you're pooled with bad risks","moral hazard: students always overspend","the free-rider problem","economies of scale"],"The issuer can't tell you from a bad risk, and the loan is unsecured."),tf("True or false: adverse selection can cause a market to shrink or even disappear.",true,"Good sellers and borrowers leave, and nobody wants what remains.")],line:"no credit history means pooled with the bad risks"}]},
{id:'fixing-adverse-selection',title:'FIXING ADVERSE SELECTION',secs:[
 {h:'Fix 1 and 2: more information',beats:[["Two ways to fix adverse selection: create more information, or make sure the lender gets paid anyway.","First, information. *Government-required disclosure*: public companies must publish standard financial statements. Helpful, but Enron and WorldCom showed that statements can be faked."],["*Private information*: firms like Moody's and Value Line research companies and sell reports.","The catch is the *free rider*: someone who gets the benefit without paying. Read the report at a library, see it in the news, copy a subscriber. So researchers can't earn enough, and too little gets produced."],{fig:'freerider'}],
  q:[mc("Private research services can't fully solve adverse selection because of:",["the free-rider problem","restrictive covenants","deflation","limited liability"],"People use the information without paying for it."),fill("Someone who gets the benefit of a good without paying for it is a ___ rider.",["free"],"Free riders undermine private information.")],line:"free riders use information without paying for it"},
 {h:'Fix 3 and 4: collateral and net worth',beats:[["Second approach: guarantee the lender gets paid.","*Collateral* is something of value pledged in case of default. A house backs a mortgage. A car backs a car loan. If the loan is covered, I care less who you are.","No collateral? That is an *unsecured loan*, like a credit card. Expect a very high rate."],{fig:'collateral'},["*Net worth = assets - liabilities*. It is the owner's own stake. If the project fails, I can be repaid out of it. A down payment on a house does the same job.","This is why new businesses struggle to borrow: no net worth yet. Owners end up pledging their homes."],{fig:'downpay'}],
  q:[fill("Something of value pledged to the lender in case of default is ___.",["collateral"],"Houses for mortgages, cars for car loans."),nm("A firm has assets of $500 million and liabilities of $350 million. Net worth, in $ millions?",150,"500 - 350 = 150")],line:"net worth equals assets minus liabilities"},
 {h:'Deflation',beats:[["*Deflation* means prices fall on average. It is poison for borrowers. Watch what it does to a firm with $100 of assets and $60 of debt."],{fig:'networth',a:[-30]},["The debt is fixed in dollars. The assets shrink with prices. So net worth takes the whole hit.","Less net worth means the firm looks less trustworthy. Lenders pull back and investment falls. The same thing happens at the start of a recession."]],
  q:[nm("Assets $100, debt $60. Deflation cuts asset values by 20%; the debt is unchanged. New net worth, in dollars?",20,"Assets fall to $80. 80 - 60 = 20. Net worth halved from $40.",'$'),mc("Deflation hurts borrowers because:",["debts stay fixed in dollars while asset values fall","interest rates always rise","collateral becomes more valuable","banks stop taking deposits"],"So net worth shrinks.")],line:"deflation shrinks assets but not debts"},
 {h:'The hot potato',beats:[["Crisis of 2007-2009. Screening failed at every step of mortgage securitization. Watch the potato."],{fig:'potato'},["Everyone assumed the collateral, houses, would keep rising in value. When prices fell, the houses no longer covered the loans.","Lesson: screening and monitoring matter, free riding destroys them, and collateral only protects you if it holds its value."]],
  q:[mc("Investors who trusted the ratings instead of checking the loans themselves were:",["free riding","monitoring","diversifying","screening"],"They relied on someone else's (weak) screening."),mc("Collateral failed to protect investors in the crisis because:",["house prices fell below the loan amounts","houses can't legally be collateral","borrowers had too much net worth","rating agencies owned the houses"],"Collateral is only as good as its value.")],line:"collateral only helps if it holds its value"}]},
{id:'moral-hazard',title:'MORAL HAZARD',secs:[
 {h:'Moral hazard in equity',beats:[["*Moral hazard* began as an insurance term: a policy changes how the insured behaves. Insure a car generously, get reckless driving. Fraud is the extreme case.","In stocks it is the *principal-agent problem*. Owners are principals. Managers are agents. Managers run the firm for themselves: jets, art, big pay."],{fig:'ponzi'},["Meet cousin Ina. Her software idea costs $10,000. She has $1,000 (10%). You put in $9,000 (90%). Work hard: worth $100,000. Go surfing: worth $10,000. And you can't watch her."],{fig:'ina',a:['equity',1000]},["Surfing costs her $9,000. It costs you *$81,000*. She gets all the beach and a tenth of the bill."]],
  q:[nm("Ina owns 10%, you own 90%. Slacking drops the value from $100,000 to $10,000. How many dollars does it cost YOU?",81000,"The loss is $90,000. Your 90% share of it is $81,000.",'$'),fill("In the principal-agent problem, owners are the principals and managers are the ___.",["agents","agent"],"Agents act on the principals' behalf, in theory.")],line:"managers enjoy the perks and owners pay the bill"},
 {h:'Moral hazard in debt',beats:[["Try a loan instead. Lend Ina $9,000 at 11%.","*Repayment = loan x (1 + interest rate)* = $9,000 x 1.11 = *$9,990*, whatever happens."],{fig:'ina',a:['debt',1000]},["Now slacking costs HER. Debt fixes the surfing problem.","But look at the gamble rows (an illustrative $500,000 jackpot). If a wild bet pays off, she keeps everything above $9,990. If it fails, *limited liability* means I eat the loss. Heads she wins, tails I lose. Debt invites risk-taking."]],
  q:[nm("You lend $9,000 for one year at 11%. How many dollars must be repaid?",9990,"9,000 x 1.11 = 9,990",'$'),mc("Debt does not eliminate moral hazard because the borrower:",["keeps the upside but has limited liability for losses","stops caring whether the project succeeds","becomes a part-owner of the bank","can skip interest payments"],"That tempts borrowers to take big risks with the lender's money.")],line:"borrowers keep the upside and lenders eat the downside"},
 {h:'The fixes',beats:[["Fixes for equity: make managers *own a stake*, and make them *report to owners* who can fire them.","Stock options were tried in the 1990s. Some managers faked profits to pump the share price and cash in. Backfired."],["Fix for debt: *restrictive covenants*. Contract clauses that limit what you may do with my money: what you can buy, a minimum net worth, a minimum bank balance. Mortgages require fire insurance."],{fig:'covenant'}],
  q:[mc("'Use this loan only for equipment and keep $50,000 in your account.' That clause is a:",["restrictive covenant","collateral pledge","disclosure rule","line of credit"],"Covenants restrict the borrower's behaviour after the loan."),tf("True or false: stock options turned out to be a foolproof cure for the principal-agent problem.",false,"Some managers misrepresented profits to cash in.")],line:"restrictive covenants limit what borrowers can do"}]},
{id:'intermediaries-fix-it',title:'HOW INTERMEDIARIES FIX IT',secs:[
 {h:'Screening',beats:[["Now my part. Against adverse selection I *screen and certify* before the deal."],{fig:'screen'},["*Credit scores*: a company gathers your history and charges a fee every time someone looks. Pay-per-view kills the free rider.","*Your account*: I see your deposits and withdrawals. That private knowledge is why small firms depend on banks.","*Underwriters*: big names like Goldman Sachs put their brand behind a new stock or bond, the way a famous label vouches for what's in the can."],{fig:'stamp'}],
  q:[mc("Checking an applicant's credit score BEFORE lending is ___ and fights ___.",["screening / adverse selection","monitoring / moral hazard","screening / moral hazard","monitoring / adverse selection"],"Screen before. Monitor after."),mc("Credit-score companies beat the free-rider problem by:",["charging a fee each time a score is viewed","publishing scores for everyone","being paid by the borrower","relying on government grants"],"No pay, no look.")],line:"screen before the deal to fight adverse selection"},
 {h:'Monitoring',beats:[["Against moral hazard I *monitor* after the deal. Example: I lend a car dealer money to stock the lot. Then I send someone to count the cars."],{fig:'monitor'},["Others monitor too. Pension funds research firms and may put a director on the board. *Venture capital* firms fund risky start-ups for a stake and watch the managers closely.","And the *threat of takeover*: run the firm badly and someone buys it and replaces you."]],
  q:[mc("A bank counts the cars on a dealer's lot after making the loan. This is:",["monitoring, against moral hazard","screening, against adverse selection","certifying, against free riders","pooling, against transactions costs"],"The loan already exists, so it is monitoring."),mc("Venture capital firms deal with moral hazard by:",["taking a stake and watching managers closely","lending only against houses","relying on SEC disclosure","diversifying so widely they needn't watch"],"Ownership plus close monitoring.")],line:"monitor after the deal to fight moral hazard"},
 {h:'The humbling ending',beats:[["A modern wrinkle: *intangible capital*. Software, data, research, training. You can't resell it easily, so it is poor collateral. Software firms' debt is about 10% of book equity. Restaurants: nearly 95%."],{fig:'intangible'},{fig:'debtbars'},["And even with all my screening and monitoring, the vast majority of business investment is paid for from *internal sources*: the firm's own funds.","Information problems are too big for even me to solve completely. End of chapter."],{fig:'internal'}],
  q:[mc("Software firms borrow far less than restaurants because their assets:",["are intangible and make poor collateral","are too profitable to need loans","can't legally back a loan","are monitored by the SEC"],"Lenders can't seize and resell code the way they can a building."),fill("The vast majority of business investment is financed from ___ sources.",["internal"],"The firm's own funds.")],line:"most investment is financed from internal sources"}]}
],

gloss:[
['financial intermediary','An institution that stands between savers and borrowers.','A bank, an insurer, a pension fund, a mutual fund.',['indirect finance','pooling']],
['direct finance','Borrowers sell securities straight to lenders in financial markets.','A firm sells a bond to an investor.',['indirect finance','underwriter']],
['indirect finance','A third party issues claims to savers and holds claims on borrowers.','You deposit at a bank; the bank lends to a homebuyer.',['direct finance']],
['transactions costs','The costs of making a deal happen.','Paying a lawyer to write a loan contract.',['information costs','economies of scale']],
['information costs','The costs of finding out whether the other side can be trusted.','Checking whether a borrower is creditworthy.',['asymmetric information']],
['economies of scale','Average cost falls as the quantity produced rises.','One good contract reused for thousands of loans.',['transactions costs']],
['liquidity','How quickly and cheaply an asset turns into a means of payment.','An ATM turning your balance into cash.',['line of credit']],
['line of credit','A pre-approved loan you can draw on whenever funds are needed.','A home equity line. Withdrawals can exceed your deposits.',['liquidity']],
['diversification','Spreading money across many borrowers or stocks to cut risk.','A $1,000 deposit spread over 10,000 loans: 10 cents each.',['pooling']],
['asymmetric information','One side of a deal knows more than the other.','A borrower knows their own honesty; the lender does not.',['adverse selection','moral hazard']],
['adverse selection','The before-the-deal problem: the worst risks are the most eager, and you cannot tell them apart. Hidden attributes.','Lemons in the used-car market. Your first credit card.',['screening','collateral','net worth']],
['moral hazard','The after-the-deal problem: the other side may not behave as promised, and you cannot watch. Hidden actions.','A borrower gambling the loan. A manager buying a jet.',['monitoring','restrictive covenants']],
['free rider','Someone who gets the benefit of something without paying for it.','Reading stock research at the library.',['screening']],
['collateral','Something of value a borrower pledges in case of default.','The house behind a mortgage.',['unsecured loan','net worth']],
['unsecured loan','A loan with nothing pledged behind it. Very high interest.','Credit card debt.',['collateral']],
['net worth','Assets minus liabilities: the owner\'s stake.','Assets $500m, liabilities $350m: $150m.',['collateral','deflation']],
['deflation','Prices falling on average. Assets shrink, debts do not.','Japan since the 1990s; the 1930s.',['net worth']],
['principal-agent problem','Owners and the managers who run the firm for them want different things.','Executives with jets, art and huge pay.',['moral hazard']],
['restrictive covenants','Contract clauses limiting what a borrower may do.','A mortgage requiring fire insurance.',['moral hazard','monitoring']],
['limited liability','A borrower\'s losses are capped, so the lender bears the rest.','Gamble wins: borrower keeps it. Gamble loses: lender pays.',['moral hazard']],
['screening','Checking borrowers before lending.','Loan applications and credit scores.',['adverse selection','underwriter']],
['monitoring','Watching borrowers after lending.','Counting the cars on a dealer\'s lot.',['moral hazard','venture capital']],
['underwriter','A big institution that screens and certifies firms issuing stocks and bonds.','Goldman Sachs, JPMorgan Chase, Morgan Stanley.',['screening']],
['venture capital','Firms that fund risky start-ups for an ownership stake and watch the managers.','Kleiner Perkins, Draper Fisher.',['monitoring']],
['intangible capital','Investment you cannot touch or easily resell, so it makes poor collateral.','Software, data, R&D, training.',['collateral']]
],

cheat:["*THE TWO PROBLEMS*","  ADVERSE SELECTION   before the deal · hidden attributes","    fixes: disclosure, private info, collateral, net worth","    intermediaries: SCREEN and certify","  MORAL HAZARD        after the deal · hidden actions","    fixes: owner stake, reporting, restrictive covenants","    intermediaries: MONITOR","","*THE FIVE JOBS*  (1-4 cut transactions costs, 5 cuts information costs)","  pooling · safekeeping/payments · liquidity · diversification · information","","*FORMULAS*","  loans-to-securities = C / (A + B)","  average cost        = total cost / quantity","  hidden-quality offer= share good x good value + share bad x bad value","  pooled rate         = risk-free rate + average risk premium","  net worth           = assets - liabilities","  repayment           = loan x (1 + rate)","","*NUMBERS*","  correlation finance/GDP 0.6 · lemons offer $15,000 · Ina: $9,000 vs your $81,000","  Ina's loan repays $9,990 · 10 cents per loan · S&P 500 yourself: over $20,000","","*TRAPS*","  counting cars = monitoring, not screening","  fraud = moral hazard, not adverse selection","  debt reduces moral hazard but invites risk-taking","  deflation cuts net worth; most finance is internal"],
cases:[
{t:'THE STRANGER',s:["A young man with no credit history wants $10,000. No collateral. He says he is very reliable."],o:[["Lend at the same low rate as your best customers",-30,"He was not reliable. Neither were the forty others who heard about your offer. Easy money with no questions attracts exactly the wrong crowd."],["No history, so ask for collateral or a co-signer",15,"He pledges his car. If he is honest, he pays. If not, you own a car.",1],["Refuse everyone without a history, forever",0,"Safe. But you turned away every good young customer too. No loss, no profit."]],l:"Adverse selection. Fix: screening and collateral.",fig:["screen"]},
{t:'ONE RATE FOR ALL',s:["Your manager wants to charge every business the same 9%, safe or risky. 'Simpler,' he says."],o:[["Fine. 9% for everyone",-25,"Safe firms deserve 7% and go elsewhere. Risky firms, who deserve 11%, queue around the block."],["Raise everyone to 13%, to be safe",-30,"Now only the truly desperate apply. Higher rate, worse crowd."],["Screen each firm and price by its risk",15,"Safe firms pay 7% and stay. Risky firms pay 11%. Everyone is priced fairly.",1]],l:"A pooled rate drives out good borrowers. Screen, then price.",fig:["bonds"]},
{t:'THE CAR DEALER',s:["You lent a car dealer $200,000 to stock his lot. The cars are the collateral. The loan is made. Now what?"],o:[["Write it into the contract: we count the cars every month",15,"Twelve cars, twelve counted. He knows you are watching. He behaves.",1],["Trust him. He seems nice",-25,"He sold twelve cars and bought a boat. You find out when the lot is empty."],["Demand full repayment tomorrow",-5,"He can't. You lose a good customer and a year of interest."]],l:"Moral hazard. Fix: monitoring and restrictive covenants.",fig:["monitor"]},
{t:'THE VAULT',s:["Depositors have given you $1,000,000. How much do you keep liquid for withdrawals?"],o:[["Nothing. Lend out every dollar",-35,"Tuesday: 12% of depositors want cash. You have none. Word spreads. That is a bank run."],["About 15 to 20 percent",15,"Withdrawals come and go. You always pay. The rest earns long-term rates.",1],["All of it. Lend nothing",-10,"Perfectly safe, perfectly useless. You earn nothing and still pay the staff."]],l:"Liquidity. Not everyone withdraws on the same day, so a cushion is enough.",fig:["liquidity"]},
{t:'ALL THE EGGS',s:["You have $100,000 to lend this year."],o:[["One $100,000 loan to a builder you like",-30,"One default and it is all gone. He defaulted."],["One hundred loans of $1,000",10,"Nine defaulted. Ninety-one paid with interest. A good year.",1],["Two loans of $50,000",-15,"One of the two defaulted. Half your money, gone."]],l:"Diversification. It doesn't raise the average. It removes the disasters.",fig:["diversify"]},
{t:'TRIPLE-A',s:["A broker offers you mortgage securities rated AAA. 'Everyone is buying them.'"],o:[["Buy big. The rating is enough",-35,"The agency barely looked at the loans. House prices fell. You were a free rider, and the ride ended."],["Inspect the underlying loans yourself first",15,"You find borrowers with no income. You pass. Six months later the buyers are underwater.",1],["Buy only if the seller keeps a stake in them",10,"With their own money on the line, the seller suddenly screens very carefully."]],l:"Free riding on someone else's screening is not screening.",fig:["potato"]},
{t:'COUSIN INA',s:["Ina needs $9,000 for her software start-up. You cannot watch what she does all day."],o:[["A plain loan, no strings",-15,"She bought lottery tickets. Limited liability: her upside, your downside."],["A loan with covenants, and she puts in more of her own money",15,"Her money is at risk and the contract limits what she can do. She works.",1],["Buy 90% of the shares and hope",-20,"She went surfing. It cost her $9,000 and you $81,000."]],l:"Moral hazard. Fixes: borrower's own stake, covenants.",fig:["ina","debt",1000]},
{t:'FALLING PRICES',s:["Deflation. Your borrowers' collateral is worth 20% less than last year. New loan applications are on your desk."],o:[["Lend as before against the same collateral",-25,"Collateral that used to cover the loan no longer does."],["Ask for bigger down payments and more collateral",15,"Fewer loans, but each one is covered.",1],["Stop lending completely",-10,"No loans, no income. And the town's economy sinks further."]],l:"Deflation shrinks net worth and collateral. Lenders must adjust.",fig:["networth",-20]}
],
lab:[
 {cmd:'lemons',usage:'lemons [peach%] [owner-minimum]',eg:'lemons 80 17000',run:a=>{const p=arg(a,0,50),m=arg(a,1,20000),o=(p*20000+(100-p)*10000)/100;return{fig:'lemons',a:[p,m],say:o<m?'Offer '+fmt(o)+' < minimum '+fmt(m)+': adverse selection. Try: lemons 80 17000':'Offer '+fmt(o)+' >= minimum '+fmt(m)+': the market survives. Try: lemons 30 20000'}}},
 {cmd:'rate',usage:'rate [riskfree] [safe] [risky] [safe%]',eg:'rate 5 2 6 50',run:a=>({fig:'bonds',a:[arg(a,0,5),arg(a,1,2),arg(a,2,6),arg(a,3,50)]})},
 {cmd:'deflate',usage:'deflate [percent]',eg:'deflate -40',run:a=>({fig:'networth',a:[arg(a,0,-30)]})},
 {cmd:'ina',usage:'ina [equity|debt] [her-stake]',eg:'ina debt 1000',run:a=>{const t=a[0]==='debt'?'debt':'equity';return{fig:'ina',a:[t,arg(a,1,1000)],say:t==='debt'?'Debt: slacking is her problem now, but your upside is capped and a failed gamble is yours. Hence covenants.':'Equity: she bears only her ownership share of any slacking. Try: ina equity 10000'}}},
 {cmd:'pool',usage:'pool [loan] [deposit]',eg:'pool 250000 500',run:a=>{const l=Math.max(1,arg(a,0,100000)),d=Math.max(1,arg(a,1,1000));return{fig:'pool',a:[l,d],say:'savers needed = '+fmt(l)+' / '+fmt(d)+' = '+(l/d).toLocaleString()}}},
 {cmd:'diversify',usage:'diversify [loans] [default%]',eg:'diversify 50 10',run:a=>({fig:'diversify',a:[arg(a,0,50),Math.max(1,Math.min(90,arg(a,1,10)))]})},
 {cmd:'liquidity',usage:'liquidity [reserve%]',eg:'liquidity 8',run:a=>{const r=arg(a,0,18);return{fig:'liquidity',a:[r],say:r<12?'A thin cushion: watch the bank run short. Try: liquidity 18':'About 10% is withdrawn on a normal day, so this cushion is rarely breached. Try: liquidity 8'}}},
 {cmd:'ponzi',usage:'ponzi',run:()=>({fig:'ponzi'})},
 {cmd:'ratio',usage:'ratio',run:()=>({fig:'ratio'})}
]});

(()=>{
/* Chapter 12 · Depository Institutions: Banks and Bank Management */
BOOK.add({n:12,short:'Banks & Bank Management',
boss:{name:'THE NEGATIVE GAP',art:[
"  ╔══════════════════════════╗",
"  ║  ASSETS     │   LIABS    ║",
"  ║   (o)       │    (o)     ║",
"  ║  long term  │ short term ║",
"  ║      \\______│______/     ║",
"  ╚══╦════════════════════╦══╝",
"     ║  GAP: -30          ║"],
 taunts:["Rates just rose. Guess whose profit fell.","Capital is not cash. You knew that. Surely.","Thirty times leverage. Three percent to live.","Asset side or liability side? Take your time. The depositors won't."]},
modules:[

/* ---------------------------------------------------------------- 1 */
{id:'the-business',title:'THE BUSINESS OF BANKING',secs:[
 {h:'What counts as a bank',beats:[
  ["You call me a bank. The trade calls me a *depository institution*: a financial institution that accepts deposits from savers and makes loans to borrowers.","What separates me from a *nondepository institution*, such as an insurer or a pension fund, is where my money comes from. My primary source of funds is deposits. Look at my liabilities, not my loans."],
  {fig:'flow'},
  ["There are three basic kinds, and the main difference is who they lend to. Commercial banks were set up to serve businesses. Savings institutions (savings and loans, and savings banks) turn household deposits into home mortgages. Credit unions are nonprofits owned by people with a common bond, and they make small consumer loans."],
  {fig:'table',a:[{title:'THE CATALOG OF DEPOSITORY INSTITUTIONS',head:['TYPE','SPECIALTY'],rows:[['Commercial bank','business (C&I) loans'],['Savings and loan','home mortgages'],['Savings bank','mortgages; depositors own it'],['Credit union','consumer loans; nonprofit']],note:'what they share: deposits fund them'}]},
  ["Commercial banks come in sizes. Community banks have assets under $1 billion and lend locally; they were more than 95 percent of the roughly 5,400 banks and savings institutions at the end of 2018. Regional banks are bigger and borrow as well as take deposits.","A handful of money center banks, such as Citigroup and JPMorgan Chase, rely mainly on borrowing in the wholesale money market rather than on deposits."],
  ["Banking is really several businesses under one roof: keeping your accounts, running payments, pooling small deposits into big loans, and trading securities. The aim of each is profit. It is not guaranteed. From 2009 to 2018 more than 500 U.S. banks failed outright and nearly 2,000 merged.","And when banks are sick, everyone pays. In the 1990s Japanese banks made huge losses while U.S. banks made profits. Japan grew just over 1 percent a year. The U.S. grew well over 3."]],
  q:[mc("What distinguishes a depository institution from a nondepository institution?",["Its primary source of funds is deposits","It makes loans, which nondepository institutions never do","It is owned by its customers","It is not allowed to borrow in financial markets"],"Look at the liability side: deposits are the main source of funds."),
     mc("A nonprofit owned by the employees of one university makes small car loans to its members. It is a:",["credit union","savings and loan","community bank","money center bank"],"Common bond, nonprofit, small consumer loans: a credit union.")],
  sa:[sa("What makes an institution a depository institution?","Its primary source of funds is deposits.",[['deposit'],['source','fund','liabilit','financ','money','rais']]),
      sa("How are money center banks funded differently from community banks?","They rely mainly on borrowing, not deposits.",[['borrow','wholesale','money market'],['deposit','instead','rather','mainly','primar','rely']])],
  line:"a depository institution gets its funds mainly from deposits"},

 {h:'The balance sheet',beats:[
  ["Everything about me fits on one page. The right side lists where my funds come from. The left side lists what I did with them.","*Total bank assets = Total bank liabilities + Bank capital*"],
  {fig:'taccount',a:[{title:'HOW A BALANCE SHEET FILLS UP (illustrative)',frames:[
    {cap:'the owners put in $10 of capital',A:[['Reserves',10],['Securities',0],['Loans',0]],L:[['Deposits',0],['Borrowings',0],['Bank capital',10]]},
    {cap:'depositors bring $80; the bank borrows $10',A:[['Reserves',100],['Securities',0],['Loans',0]],L:[['Deposits',80],['Borrowings',10],['Bank capital',10]]},
    {cap:'the funds are put to use: bonds and loans',A:[['Reserves',15],['Securities',25],['Loans',60]],L:[['Deposits',80],['Borrowings',10],['Bank capital',10]]}]}]},
  ["Liabilities are the sources of funds: deposits and borrowings. Assets are the uses of funds: cash, securities and loans.","*Bank capital* is the difference, assets minus liabilities. It is my net worth, the value of the bank to its owners. The two sides must always balance, so any change on one side is mirrored on the other."],
  ["Now the real thing: all of the more than 4,700 U.S. commercial banks added together, December 2018. Assets of $17.0 trillion. Liabilities of $15.1 trillion. Capital is the $1.9 trillion left over, about 11 percent of assets."],
  {fig:'taccount',a:[{title:'ALL U.S. COMMERCIAL BANKS, DEC 2018 ($ billions)',frames:[
    {cap:'left side: the uses of funds',A:[['Cash items',1950],['Securities',3499],['Loans',9578],['Other assets',1994]],L:[['Deposits',12425],['Borrowings',1945],['Other liabs',730],['Bank capital',1921]]},
    {cap:'right side: sources. 17,021 - 15,100 = 1,921',A:[['Cash items',1950],['Securities',3499],['Loans',9578],['Other assets',1994]],L:[['Deposits',12425],['Borrowings',1945],['Other liabs',730],['Bank capital',1921]]}]}]},
  ["For scale: U.S. nominal GDP in late 2018 was $20.9 trillion, so bank assets were worth more than 80 percent of a year's output. And since deposits are part of M2, my liabilities are your money.","My profit comes from two places: fees for services, and the difference between what I earn on my assets and what I pay for my liabilities."]],
  q:[nm("A banking system has total assets of $17,021 billion and total liabilities of $15,100 billion. What is bank capital, in $ billions?",1921,"Capital = assets - liabilities = 17,021 - 15,100 = 1,921",'$'),
     mc("On a bank's balance sheet, the liabilities are best described as:",["the sources of the bank's funds","the uses of the bank's funds","the bank's accumulated profits","the cash the bank keeps in its vault"],"Liabilities are sources. Assets are uses. Capital is the owners' stake.")],
  sa:[sa("State the bank balance sheet identity.","Assets equal liabilities plus bank capital.",[['asset'],['liabilit'],['capital','net worth','equity']]),
      sa("In terms of funds, what are a bank's liabilities and assets?","Liabilities are sources of funds; assets are uses.",[['source','where','come from','raise'],['use','what it does','put to','invest','spend']])],
  line:"assets equal liabilities plus bank capital"}
]},

/* ---------------------------------------------------------------- 2 */
{id:'assets',title:'ASSETS: USES OF FUNDS',secs:[
 {h:'Cash items',beats:[
  ["Start on the left: what I do with the money. Four piles. Cash items, securities, loans, and other assets, which are mostly buildings, equipment and collateral repossessed from borrowers who defaulted."],
  {fig:'bars',a:[{title:'U.S. BANK ASSETS, DEC 2018 (% of total)',rows:[['Cash items',11.5,'11.5%'],['Securities',20.6,'20.6%'],['Loans',56.3,'56.3%'],['Other assets',11.7,'11.7%']]}]},
  ["Cash items are of three types. The most important is *reserves*: the cash in my vault and my ATMs, called *vault cash*, plus my deposits at the Federal Reserve.","I hold reserves because regulations require it and because prudence does. Cash is my most liquid asset. It is what I hand over when you withdraw."],
  ["Type two is cash items in process of collection. You deposit a paycheck; for a few days I am waiting to collect from your employer's bank. Those uncollected funds count as my asset.","Type three is balances I keep at other banks, called correspondent deposits. Small banks keep accounts at large ones. The habit has faded."],
  ["Normally I keep cash as low as I dare, because it earns less than loans or securities. In early 2007 cash was about 3 percent of bank assets. By December 2018 it was more than 11 percent."],
  {fig:'morph',a:[{title:'CASH AS % OF U.S. BANK ASSETS',rows:[['cash share',3,11.5,v=>v.toFixed(1)+'%'],['cost of holding',9,2,v=>v>5.5?'high':'low']],max:12,capA:'early 2007: about 3%, cash is costly to hold',capB:'Dec 2018: 11.5%. More fear, lower cost'}]},
  ["Two reasons for the jump. The crisis raised the chance of bank runs, credit-line takedowns and borrower defaults, so banks scrambled for liquidity.","And cash became cheap to hold. Market interest rates fell and the Federal Reserve began paying interest on reserves, so the opportunity cost of holding cash plummeted."]],
  q:[mc("Why did banks' cash rise from about 3% of assets in early 2007 to over 11% in 2018?",["Crisis risks raised the demand for liquidity, and holding cash became cheaper","Regulators stopped banks from buying securities","Loans began to pay less interest than vault cash","Depositors stopped using checking accounts"],"More fear of runs and takedowns, low market rates, and interest paid on reserves."),
     mc("Which of these is NOT part of a bank's reserves?",["Its holdings of U.S. Treasury bonds","The currency in its ATMs","The cash in its vault","Its deposits at the Federal Reserve"],"Reserves = vault cash + deposits at the Fed. Treasuries are securities.")],
  sa:[sa("What are bank reserves made of?","Vault cash plus the bank's deposits at the Fed.",[['vault','cash','currency'],['fed','central bank']]),
      sa("Why do banks normally try to minimise their cash holdings?","Cash earns less interest than loans or securities.",[['less','lower','little','opportunity','forgo','zero','nothing','give up'],['interest','return','earn','yield','cost','profit']])],
  line:"reserves are vault cash plus deposits at the fed"},

 {h:'Securities',beats:[
  ["Second pile: marketable securities, about a fifth of my assets. In many countries banks may own stock. U.S. banks may not. So for me, securities means bonds."],
  {fig:'bars',a:[{title:'SECURITIES HELD, DEC 2018 (% of bank assets)',rows:[['U.S. gov & agency',15.7,'15.7%'],['Other securities',4.9,'4.9%'],['(of which MBS)',11.0,'11.0%: over half']],note:'all securities: 20.6% of assets'}]},
  ["U.S. government and agency securities are 15.7 percent of assets. Other securities, which include state and local government bonds, add 4.9 percent. More than half of the whole pile is mortgage-backed."],
  ["A sizable share of these bonds is very liquid. If I need cash I can sell them quickly, at low cost. That makes them a backup for my cash balances, which is why securities are called *secondary reserves*."],
  {fig:'taccount',a:[{title:'SECONDARY RESERVES AT WORK (illustrative, $m)',frames:[
    {cap:'reserves are running thin',A:[['Reserves',10],['Securities',40],['Loans',100]],L:[['Deposits',100],['Borrowings',30],['Bank capital',20]]},
    {cap:'sell $5 of Treasuries: instant cash',A:[['Reserves',15],['Securities',35],['Loans',100]],L:[['Deposits',100],['Borrowings',30],['Bank capital',20]]}]}]},
  ["Why so few corporate bonds? Nothing forbids them. But the capital I must hold against a corporate bond is the same as against a loan to that corporation, and I can usually charge more on the loan. So I lend instead.","The share of securities in bank assets has hovered around 20 percent for four decades. They pay less than loans. I hold them for liquidity."]],
  q:[mc("Securities are called 'secondary reserves' because they:",["can be sold quickly for cash when the bank needs liquidity","must be deposited at the Federal Reserve","count toward the bank's required reserves","earn a higher return than loans"],"Liquid bonds back up the cash balances."),
     tf("True or false: stocks of large corporations make up a major part of U.S. banks' securities holdings.",false,"U.S. banks cannot hold stock, so their securities are bonds.")],
  sa:[sa("Why are a bank's securities called secondary reserves?","They are liquid and can be sold quickly for cash.",[['liquid','sold','sell','convert','turn'],['cash','quick','fast','easily','reserve','need']]),
      sa("Why do U.S. banks' securities holdings contain only bonds?","U.S. banks are not allowed to hold stock.",[['stock','equit','share'],['not allowed','cannot','prohibit','ban','forbid','illegal','can t','cant','barred','may not','not permitted']])],
  line:"securities are secondary reserves because they sell quickly for cash"},

 {h:'Loans',beats:[
  ["Loans are my primary asset, well over half of everything I own. Five kinds. Business loans, called *commercial and industrial loans*, or C&I. Real estate loans: home and commercial mortgages and home equity loans. Consumer loans: cars and credit cards. Interbank loans, bank to bank. And others, such as loans to buy securities."],
  {fig:'bars',a:[{title:'LOANS BY TYPE, DEC 2018 (% of bank assets)',rows:[['Real estate',25.9,'25.9%'],['C&I (business)',13.6,'13.6%'],['Consumer',8.8,'8.8%'],['Other',7.9,'7.9%'],['Interbank',0.1,'0.1%']],note:'all loans: 56.3% of assets'}]},
  ["Loans differ in liquidity. Home mortgages and auto loans can usually be securitized and resold. A small business loan may be very hard to sell.","The loan book is also the main thing that separates the kinds of depository institution: commercial banks lend mostly to businesses, savings and loans to homebuyers, credit unions to consumers."],
  ["Before the crisis of 2007-2009, commercial banks moved steadily into real estate. Two reasons."],
  {fig:'steps',a:[{title:'WHY BANKS MOVED INTO REAL ESTATE',lines:['1 the commercial paper market grows','    large firms borrow there instead','    so the demand for C&I loans falls','2 mortgage-backed securities (MBS) arrive','    banks can now SELL the mortgages they make','    holding an illiquid asset becomes less risky','→ more mortgage lending, and banks buy MBS too']}]},
  ["One: large firms found commercial paper a more convenient way to borrow, so they wanted fewer bank loans. Two: mortgage-backed securities meant I could sell the mortgages I made, which cut the risk of holding an illiquid asset.","So banks made more real estate loans and bought MBS as well. Then house prices fell. Since the crisis banks have cut their real estate exposure, which tells you where the trouble was."]],
  q:[mc("Why did commercial and industrial loans become less important to banks in the decades before 2007?",["Large firms could borrow more conveniently in the commercial paper market","Regulators capped the amount of business lending","Businesses stopped investing in equipment","Banks were barred from lending to corporations"],"Securities-market finance replaced bank loans for big firms."),
     mc("Which of a bank's assets would be hardest to sell quickly?",["A loan to a small local business","A U.S. Treasury bond","A pool of home mortgages","An auto loan"],"Mortgages and auto loans can be securitized. Small business loans are hard to resell.")],
  sa:[sa("How did mortgage-backed securities encourage banks to make more mortgages?","Banks could sell mortgages, reducing the risk of illiquid assets.",[['sell','sold','resell','resold','securiti'],['risk','illiquid','liquid']]),
      sa("What mainly distinguishes commercial banks, S&Ls and credit unions?","The composition of their loan portfolios.",[['loan','lend','borrower'],['composition','type','kind','portfolio','mix','who','what','different']])],
  line:"loans are the main bank asset and real estate loans are the largest kind"}
]},

/* ---------------------------------------------------------------- 3 */
{id:'liabilities',title:'LIABILITIES: SOURCES OF FUNDS',secs:[
 {h:'Deposits',beats:[
  ["Now the right side: where the money comes from. Deposits are 82 percent of my liabilities. Borrowings are 13 percent. The rest is odds and ends."],
  {fig:'bars',a:[{title:'U.S. BANK LIABILITIES, DEC 2018 (% of total)',rows:[['Deposits',82.3,'82.3%'],['Borrowings',12.9,'12.9%'],['Other',4.8,'4.8%']],note:'large time deposits alone: 11.3%'}]},
  ["Deposits come in two types. Transaction accounts are *checkable deposits*. Their largest part is demand deposits, which you may withdraw without notice, first come, first served. In December 2018 checkable deposits were $2.12 trillion, only about 17 percent of all deposits."],
  ["They used to matter far more. Checkable deposits fell from 40 percent of bank liabilities in the 1970s to about 14 percent in 2018.","The reason: checking accounts pay little or no interest. That makes them a low-cost source of funds for me and a low-return investment for you. When interest rates rose in the 1970s and stayed high, customers cut their checking balances and banks offered accounts that shift funds automatically."],
  {fig:'morph',a:[{title:'CHECKABLE DEPOSITS (% of bank liabilities)',rows:[['checkable',40,14,'%']],max:50,capA:'1970s: 40%, the principal source of funds',capB:'2018: about 14%. Savers chased higher interest'}]},
  ["*Nontransaction deposits* are savings deposits and time deposits. In 2018 they were more than half of all bank liabilities.","A time deposit is a certificate of deposit, a CD, with a fixed maturity. Buying one is like buying a bond from me, except there is not much of a resale market for a small one. Cash it in early and I charge a significant penalty."],
  ["Small CDs are $100,000 or less. Large CDs are over $100,000 and are negotiable: they can be bought and sold in financial markets, like bonds or commercial paper.","Because they can be resold, corporate treasurers with cash to park will buy them, so I can issue them whenever I need funds. Remember that. It comes back when we reach liquidity risk."]],
  q:[mc("Why are checkable deposits no longer banks' principal source of funds?",["They pay little or no interest, so customers moved to higher-paying accounts","Regulators limited the number of checking accounts a bank may offer","Banks found checkable deposits too expensive a source of funds","Deposit insurance stopped covering checking accounts"],"Cheap for the bank, low-return for the depositor. High rates pushed savers out."),
     mc("What makes a large CD (over $100,000) different from a small one?",["It is negotiable: it can be bought and sold in financial markets","It can be cashed in early with no penalty","It pays no interest","It is a transaction account"],"Negotiable large CDs let banks raise funds in the wholesale money market.")],
  sa:[sa("Why did checkable deposits shrink as a source of bank funds?","They pay little interest; depositors moved to accounts paying more.",[['interest','return','yield','rate'],['low','little','zero','higher','more','better','moved','shift','left','none']]),
      sa("What does it mean that large CDs are negotiable?","They can be bought and sold in financial markets.",[['sold','sell','trad','resold','resell','bought'],['market','investor','bond','secondary','other','someone']])],
  line:"checking accounts pay little interest so they shrank as a source of funds"},

 {h:'Borrowings and the repo',beats:[
  ["Borrowing is my second most important source of funds, about 13 percent of liabilities. It grew for decades until the crisis made banks more cautious. I borrow in three main ways."],
  ["First, from the Federal Reserve. These are *discount loans*. For now, think of them as borrowing from the government.","Second, from other banks. A bank with excess reserves lends its surplus to a bank that needs funds, in the *federal funds market*. These loans are unsecured: there is no collateral, so the lender must trust the borrower. They have become very small."],
  {fig:'compare',a:[{left:{h:'FEDERAL FUNDS',lines:['bank lends to bank','unsecured','no collateral: trust','now very small']},right:{h:'REPO',lines:['cash lent against a bond','secured by collateral','reversed, often next day','collateralized: has grown']}}]},
  ["Third, the *repurchase agreement*, or repo: a short-term collateralized loan. A security is exchanged for cash, with an agreement to reverse the trade on a set date, typically the next day."],
  {fig:'repo'},
  ["Say I hold a Treasury bill and need cash overnight. A pension fund has cash it does not need until tomorrow. I give it the bill and take the cash. Tomorrow I buy the bill back and pay interest.","I get an overnight loan. The fund gets some extra interest and the protection of collateral."],
  ["Repos are big: nearly $5 trillion outstanding at the end of 2007, by one estimate. That is a weakness as well. In 2008 repo lenders feared being left with questionable collateral such as mortgage-backed securities. They stopped lending, the market shrivelled, and the crisis got worse.","Much of the market is tri-party: a clearing bank stands between borrower and lender and moves the collateral. In the U.S. two banks do it, BNY Mellon and JPMorgan Chase. That concentration is why regulators still watch the repo market."]],
  q:[mc("In an overnight repo, a bank that needs cash:",["sells a security today and agrees to buy it back tomorrow, paying interest","borrows another bank's excess reserves without collateral","borrows directly from the Federal Reserve","issues a large negotiable certificate of deposit"],"A repo is a collateralized loan dressed up as a sale and a repurchase."),
     mc("What is the key difference between a federal funds loan and a repo?",["A federal funds loan is unsecured; a repo is backed by collateral","A federal funds loan comes from the Fed; a repo comes from a bank","A repo is long term; a federal funds loan is short term","Interest is paid on a repo but not on federal funds"],"Federal funds: bank to bank, no collateral. Loans from the Fed are discount loans.")],
  sa:[sa("What is a repurchase agreement?","A short-term loan collateralized by a security, reversed later.",[['loan','borrow','lend','cash'],['collateral','secur','bond','bill','buy it back','repurchase','buy back']]),
      sa("Why must a federal funds lender trust the borrowing bank?","The loan is unsecured: there is no collateral.",[['unsecured','no collateral','without collateral','uncollateral','lack','not backed','not secured','nothing pledged'],['loan','lend','borrow','collateral','secur','fund']])],
  line:"a repo is a short term loan backed by a security as collateral"}
]},

/* ---------------------------------------------------------------- 4 */
{id:'capital-and-profit',title:'CAPITAL AND PROFIT',secs:[
 {h:'Bank capital: the cushion',beats:[
  ["Net worth is assets minus liabilities. For a bank it goes by the name bank capital, or equity capital. If my owners sold every asset without a loss and repaid every liability, capital is what they would have left. It is their stake."],
  ["The classic trap: do not confuse capital with reserves. Reserves are an asset, cash I hold. Capital appears on the liability side. It is not a pile of money in my vault."],
  {fig:'compare',a:[{left:{h:'RESERVES',lines:['an ASSET','cash + Fed deposits','pays out withdrawals','fights illiquidity']},right:{h:'CAPITAL',lines:['on the LIABILITY side','assets minus liabilities','absorbs losses','guards against insolvency']}}]},
  ["Capital is my cushion against a sudden drop in the value of my assets or an unexpected withdrawal of liabilities. It is insurance against *insolvency*: liabilities bigger than assets, so the debts cannot be repaid."],
  ["One important part of capital is *loan loss reserves*: an amount set aside to cover losses on loans that go bad. When I give up hope on a loan I write it off, erasing it from the balance sheet, and the loan loss reserve falls by the same amount."],
  {fig:'taccount',a:[{title:'LOANS GO BAD (illustrative, $ millions)',frames:[
    {cap:'start: capital = 5 + 15 = $20',A:[['Reserves',15],['Securities',35],['Loans',100]],L:[['Deposits',100],['Borrowings',30],['Loss reserves',5],['Other capital',15]]},
    {cap:'a $3 loan is written off',A:[['Reserves',15],['Securities',35],['Loans',97]],L:[['Deposits',100],['Borrowings',30],['Loss reserves',2],['Other capital',15]]},
    {cap:'$22 more is lost: the cushion is gone. INSOLVENT',A:[['Reserves',15],['Securities',35],['Loans',75]],L:[['Deposits',100],['Borrowings',30],['Loss reserves',0],['Other capital',-5]]}]}]},
  ["Look at who took every loss in that picture: the owners. Depositors were untouched until capital hit zero. The bigger the cushion, the bigger the surprise I can survive.","So why not hold a huge one? Because capital is costly. The investors who supply it must be paid, with dividends and the like. Banks are always tempted to run thin."]],
  q:[mc("A bank writes off a $3 million loan that has defaulted. On its balance sheet:",["loans and loan loss reserves (part of capital) each fall by $3 million","loans fall by $3 million and deposits fall by $3 million","reserves fall by $3 million and capital is unchanged","nothing changes until the collateral has been sold"],"The asset is erased and the loss lands on the owners' capital."),
     mc("Which statement about bank capital and reserves is correct?",["Reserves are an asset; capital appears on the liability side","Both are assets kept in the vault","Capital is an asset; reserves are a liability","Capital is the part of reserves above the required amount"],"Capital = assets - liabilities, the owners' stake. Reserves are cash assets.")],
  sa:[sa("What is bank capital?","Assets minus liabilities: the owners' stake in the bank.",[['asset','net worth','owner','equity'],['liabilit','minus','stake','net worth','difference','cushion']]),
      sa("Why do banks hold capital?","As a cushion against losses that could cause insolvency.",[['cushion','absorb','buffer','protect','insur','cover'],['loss','insolv','fall','drop','declin','default','bankrupt','fail']])],
  line:"capital is assets minus liabilities and it absorbs losses"},

 {h:'Leverage',beats:[
  ["In December 2018, $1.9 trillion of capital and $15.1 trillion of liabilities bought $17.0 trillion of assets. Debt was nearly 8 times equity. That is leverage: buying assets with borrowed funds."],
  {fig:'bars',a:[{title:'DEBT-TO-EQUITY RATIOS IN THE U.S.',rows:[['Households',0.14,'roughly 1/7 to 1'],['Nonfinancial firms',1,'less than 1 to 1'],['Commercial banks',7.9,'nearly 8 to 1']],note:'banks before the crisis: higher still'}]},
  ["Two measures. Do not mix them up.","*Debt-to-equity = liabilities / capital*","*Leverage ratio = total assets / capital = debt-to-equity + 1*","For U.S. banks in 2018: 15.1 / 1.9 is nearly 8, and 17.0 / 1.9 is nearly 9."],
  ["Leverage multiplies both risk and expected return. Pay half the price of a house yourself and both double. Pay one-fifth and they rise five times. A bank that borrows $8 for each $1 of capital multiplies its risk and its expected return by 9."],
  {fig:'lev',a:[30]},
  ["Before the crisis some institutions were leveraged 30 times. Then a fall in asset prices of about 3 percent wipes out the capital. Some top-rated mortgage securities fell by one-third.","Mark-to-market accounting made it bite at once. When the market price of an asset falls, its recorded value must be written down, and since capital is assets minus liabilities, the writedown comes straight out of capital."],
  ["The crisis numbers: projected losses on U.S. bank assets of nearly $1 trillion, against total capital of about $1.3 trillion beforehand. Without massive government support many banks would probably have been insolvent. Banks have since cut leverage: the 2018 debt-to-equity ratio was nearly 25 percent below the pre-crisis average.","Why is bank leverage so high at all? One reason is government guarantees such as deposit insurance, which let banks take risk without frightening their depositors."]],
  q:[nm("A bank has total assets of $17,021 billion and capital of $1,921 billion. What is its leverage ratio (assets / capital)? Round to one decimal.",8.9,"17,021 / 1,921 = 8.86, about 8.9. Debt-to-equity is one less: about 7.9.",''),
     mc("A firm's assets are 30 times its capital. Roughly what fall in the value of its assets wipes out the capital?",["About 3 percent","About 30 percent","About 0.3 percent","About 97 percent"],"Capital is 1/30 of assets, about 3.3%. Lose that much and nothing is left.")],
  sa:[sa("How does leverage affect a bank's risk and expected return?","Leverage raises both risk and expected return.",[['risk','loss','danger','vulnerab'],['return','profit','gain','reward','roe'],['rais','increas','magnif','multipl','higher','both','amplif','more','greater']]),
      sa("When is a bank insolvent?","When its liabilities exceed its assets.",[['liabilit','debt','owe','capital','net worth'],['exceed','greater','more than','larger','bigger','above','negative','less than','below','cannot repay','unable','zero','wiped']]),
      sa("Why did mark-to-market writedowns reduce bank capital in the crisis?","Asset values fell while liabilities stayed the same.",[['asset','securit','mortgage','price','value'],['fell','fall','drop','declin','lower','written down','writedown','down','lost']])],
  line:"the leverage ratio is total assets divided by bank capital"},

 {h:'ROA and ROE',beats:[
  ["How do you tell whether a bank is any good at being a bank? Start with *return on assets*, ROA.","*ROA = Net profit after taxes / Total bank assets*","It measures how efficiently I use my assets. A manager can use it to compare the bank's different lines of business."],
  ["Owners care more about the return on their own investment. That is *return on equity*, ROE.","*ROE = Net profit after taxes / Bank capital*"],
  {fig:'steps',a:[{title:'BANK A, FROM THE CHAPTER PROBLEMS ($ millions)',lines:['profit 1.8 · assets 95 · capital 10','ROA      = 1.8 / 95 = 1.89%','ROE      = 1.8 / 10 = 18.0%','leverage = 95 / 10  = 9.5','check: 1.89% x 9.5  = 18.0%']}]},
  ["The two are tied together by leverage.","*ROE = ROA x (Bank assets / Bank capital)*","Same ROA, more leverage, higher ROE. That is why owners like leverage, and why it needs watching."],
  {fig:'morph',a:[{title:'SAME ASSETS ($1bn), SAME ROA (1%, assumed)',rows:[['ROA',1,1,'%'],['leverage',5,10,'x'],['ROE',5,10,'%']],max:10,capA:'Bank Y: capital $200m, so ROE = 5%',capB:'Bank Z: capital $100m, so ROE = 10%. Riskier'}]},
  ["Before the crisis a typical U.S. bank had an ROA of about 1.3 percent and an ROE 10 to 12 times as high.","Large banks tended to show a higher ROE than small ones. That can mean more leverage, a riskier mix of assets, or economies of scale. Their poor showing in the crisis suggests the first two played a part, though research does find scale economies for banks with more than $100 billion in assets.","Exam trap: a high ROE is not automatically good news. Ask where it came from. A higher ROA is efficiency. More leverage is just more risk."]],
  q:[nm("A bank's ROA is 1.2% and its assets are 11 times its capital. What is its ROE, in percent?",13.2,"ROE = ROA x leverage = 1.2 x 11 = 13.2%",'%'),
     mc("Banks Y and Z each have $1 billion of assets and the same ROA. Y's liabilities are $800 million; Z's are $900 million. Which has the higher ROE?",["Bank Z: less capital means more leverage","Bank Y: more capital means more profit","Neither: equal ROA means equal ROE","It depends only on the level of interest rates"],"Z's leverage is 10, Y's is 5. Z's ROE is double, and so is its risk.")],
  sa:[sa("How are ROA and ROE related?","ROE equals ROA times assets divided by capital.",[['roa','return on asset'],['leverage','times','multipl','divided by capital','assets over capital','asset to capital','assets capital']]),
      sa("Why do owners care more about ROE than ROA?","ROE measures the return on the owners' own investment.",[['owner','their','shareholder','equity','capital','invest','stake'],['return','profit','earn']])],
  line:"roe equals roa times assets divided by capital"},

 {h:'Net interest margin',beats:[
  ["One more measure. I pay interest on my liabilities, deposits and borrowings: interest expense. I receive interest on my assets, loans and securities: interest income.","*Net interest income = Interest income - Interest expense*"],
  {fig:'lanes',a:[{left:['borrowers','bond issuers'],mid:'BANK',right:['depositors','lenders'],sym:'$',lh:'INTEREST IN',mh:'',rh:'INTEREST OUT',note:'what stays in the box is net interest income'}]},
  ["Express that as a percentage of total assets and you have the *net interest margin*.","*Net interest margin = Net interest income / Total assets*","It is my *interest rate spread*: the weighted average difference between the rate I receive on assets and the rate I pay on liabilities."],
  ["The chapter's example: I receive 5 percent on my assets and pay 3 percent on my liabilities. Per $100 of assets that is $5 in, $3 out and $2 kept. A net interest margin of 2 percent."],
  {fig:'steps',a:[{title:'NET INTEREST MARGIN (per $100 of assets)',lines:['interest income    5% x $100 = $5.00','interest expense   3% x $100 = $3.00','net interest income          = $2.00','net interest margin = $2 / $100 = 2%']}]},
  ["It links to ROA. Take fee income minus operating costs, divide by total assets, add the net interest margin, and you have ROA. Think of net interest income as a shop's gross profit and the margin as its gross profit margin.","Why analysts watch it: most loans get repaid, so today's margin tells you about tomorrow's profit too. It is forward-looking. If a bank's margin is improving, its profitability is likely to improve. Well-run banks have high net interest income and a high margin."]],
  q:[nm("A bank has total assets of $200 million. It receives $11 million of interest and pays $6 million of interest. What is its net interest margin, in percent?",2.5,"(11 - 6) / 200 = 5 / 200 = 2.5%",'%'),
     mc("A bank's net interest margin is improving. What does that most likely signal?",["Its profitability is likely to improve in the future","Its leverage ratio has fallen","More of its loans are about to default","Its fee income has risen"],"Most loans will be repaid, so the margin is forward-looking.")],
  sa:[sa("What is net interest income?","Interest received on assets minus interest paid on liabilities.",[['interest'],['minus','less','difference','subtract','net of','between','after'],['asset','loan','income','receiv','earn','liabilit','deposit','paid','expense','pay']]),
      sa("Why is net interest margin a forward-looking measure?","Most loans will be repaid, so it predicts future profits.",[['future','predict','tomorrow','later','coming','ahead','signal','will'],['profit','repaid','repay','earn','income']])],
  line:"net interest margin is net interest income divided by total assets"}
]},

/* ---------------------------------------------------------------- 5 */
{id:'beyond-the-balance-sheet',title:'BEYOND THE BALANCE SHEET',secs:[
 {h:'Off-balance-sheet activities',beats:[
  ["My balance sheet does not tell you everything. To earn fees I do things that appear as neither assets nor liabilities. These are *off-balance-sheet activities*. They can be an important part of my profit, and add a good deal to my risk."],
  ["First, the line of credit, also called a loan commitment. A firm pays me a fee for the right to borrow whenever it needs to. Nothing shows on my balance sheet until the firm actually draws the line down."],
  {fig:'taccount',a:[{title:'A LINE OF CREDIT (illustrative, $ millions)',frames:[
    {cap:'a firm signs a $5 credit line and pays a fee',A:[['Reserves',15],['Securities',35],['Loans',100]],L:[['Deposits',100],['Borrowings',30],['Bank capital',20]]},
    {cap:'nothing moves: the promise is invisible',A:[['Reserves',15],['Securities',35],['Loans',100]],L:[['Deposits',100],['Borrowings',30],['Bank capital',20]]},
    {cap:'the firm draws the line: now a loan appears',A:[['Reserves',10],['Securities',35],['Loans',105]],L:[['Deposits',100],['Borrowings',30],['Bank capital',20]]}]}]},
  ["The fee pays me for cutting two costs. Without the commitment the firm would find credit at short notice hard and expensive to get: a transactions cost. And I already know the firm, so checking its creditworthiness costs me almost nothing: an information cost."],
