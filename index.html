<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TELLER — Money &amp; Banking Terminal Tutor</title>
<style>
:root{--bg:#1e1e2e;--fg:#cdd6f4;--dim:#8a90aa;--acc:#f9e2af;--ok:#a6e3a1;--err:#f38ba8;--info:#89dceb;--bar:#313244;--barfg:#cdd6f4;--cbg:#11111b;--cfg:#f38ba8;--glow:none;--frame:transparent;--fw:0px;--bgimg:none;
  --font:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);background-image:var(--bgimg);color:var(--fg);font:15px/1.5 var(--font);text-shadow:var(--glow);overflow:hidden}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.2;display:none}
[data-fx~=matrix] #rain{display:block}
#win{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;height:100dvh;border:var(--fw) solid var(--frame)}
#bar{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--bar);color:var(--barfg);padding:6px 12px;font-size:13px;text-shadow:none;flex-wrap:wrap}
#bar .l{display:flex;gap:10px;align-items:center;min-width:0}
.dots{display:none;gap:6px}.dots i{width:11px;height:11px;border-radius:50%;background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
[data-chrome=mac] .dots{display:flex}
.wbtn{display:none;letter-spacing:.5em;padding-left:6px}[data-chrome=win] .wbtn{display:inline}
#ttl{white-space:pre;overflow:hidden;text-overflow:ellipsis}
#bar .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#bar select,#bar button{font:12px var(--font);background:transparent;color:inherit;border:1px solid currentColor;border-radius:3px;padding:2px 7px;cursor:pointer;opacity:.9}
#bar select option{color:#111;background:#fff}
#screen{flex:1;overflow-y:auto;padding:14px 16px 30px;cursor:text;scrollbar-color:var(--dim) transparent}
[data-upper] #screen{text-transform:uppercase}
.ln{white-space:pre-wrap;word-break:break-word;min-height:1.5em}
.say{padding-left:9ch;text-indent:-9ch}.say.cont{text-indent:0}
.who{color:var(--info);font-weight:700}
.acc,.ln b{color:var(--acc);font-weight:700}
.dim{color:var(--dim)}.err{color:var(--err)}.ok{color:var(--ok)}.info{color:var(--info)}
.hd{display:table;background:var(--fg);color:var(--bg);padding:0 1ch;font-weight:700;margin:1.2em 0 .4em;text-shadow:none}
.hd2{color:var(--acc);font-weight:700;margin-top:.8em;border-top:1px dashed var(--dim);padding-top:.5em}
.q{font-weight:700}.opt{padding-left:2ch}
.more{color:var(--dim)}
pre.fig{font:inherit;font-size:min(1em,2.5vw);line-height:1.2;margin:.7em 0;color:var(--fg);overflow-x:auto;overflow-y:hidden;white-space:pre}
pre.fig i{font-style:normal}pre.fig .m{color:var(--acc)}pre.fig .g{color:var(--ok)}pre.fig .r{color:var(--err)}
#inl{white-space:pre-wrap;word-break:break-word}
#ps1 i,.ln i{font-style:normal}
#ps1 .u,.ln .u{color:var(--ok);font-weight:700}#ps1 .p,.ln .p{color:var(--info);font-weight:700}#ps1 .a,.ln .a{color:var(--acc)}
.cur{display:inline-block;width:.6em;height:1.1em;background:currentColor;vertical-align:text-bottom;margin-left:1px;animation:blink 1.06s steps(1) infinite;box-shadow:var(--glow)}
[data-cur=under] .cur{height:.2em;vertical-align:baseline}
[data-cur=bar] .cur{width:2px}
body.typing .cur{animation:none}
@keyframes blink{50%{opacity:0}}
#chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
#chips button,.box button{font:inherit;font-size:.9em;color:var(--fg);background:transparent;border:1px solid var(--dim);border-radius:3px;padding:3px 10px;cursor:pointer;text-shadow:inherit;text-transform:inherit}
#chips button:hover,.box button:hover,.box button.on{background:var(--fg);color:var(--bg);text-shadow:none}
#status{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--ok);color:var(--bg);padding:2px 10px;font-size:12.5px;text-shadow:none;font-weight:700}
#status .e{background:var(--err);padding:0 4px}
#ghostf{position:fixed;left:0;bottom:0;width:1px;height:1px;overflow:hidden;opacity:0}
#ghost{font-size:16px;width:200px}
#fx{position:fixed;inset:0;z-index:2;pointer-events:none;display:none;background:repeating-linear-gradient(rgba(0,0,0,.2) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45))}
[data-fx~=crt] #fx{display:block}
#crash{position:fixed;inset:0;background:var(--cbg);color:var(--cfg);padding:10vh 8vw;white-space:pre-wrap;font-size:clamp(13px,2vw,18px);z-index:9;text-shadow:none;cursor:pointer}
#crash[hidden]{display:none}
.panel{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:12px;text-shadow:none}
.box{background:var(--bg);color:var(--fg);border:2px solid var(--fg);box-shadow:8px 8px 0 rgba(0,0,0,.55);width:min(720px,100%);max-height:90vh;max-height:90dvh;overflow:auto;padding:0 16px 16px}
.box h2{font:inherit;font-weight:700;background:var(--fg);color:var(--bg);margin:0 -16px 12px;padding:3px 16px;display:flex;justify-content:space-between;position:sticky;top:0}
.box h2 button{border:0;color:var(--bg);padding:0 6px}.box h2 button:hover{background:var(--bg);color:var(--fg)}
.box h3{font:inherit;font-weight:700;color:var(--acc);margin:14px 0 6px}
.prow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.prow input[type=range]{flex:1;min-width:140px;accent-color:var(--acc)}
.lvl button{border:0!important;padding:0 1px!important;font-size:1.3em!important;line-height:1;color:var(--acc)!important;background:none!important}
.srow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--dim)}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.sw button{text-align:left;padding:8px 10px!important;border-width:2px!important;font-size:.9em;text-transform:none!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw button.cur-t{outline:3px solid var(--acc);outline-offset:1px}
.shake{animation:shake .45s}
@keyframes shake{10%{transform:translate(-6px,2px)}25%{transform:translate(5px,-3px);filter:hue-rotate(40deg) contrast(1.4)}40%{transform:translate(-4px,3px)}60%{transform:translate(4px,1px);filter:invert(.15)}80%{transform:translate(-2px,-1px)}}
@media (max-width:600px){body{font-size:13px}#screen{padding:10px 12px 24px}#status{font-size:11px}#ttl{display:none}}
@media (prefers-reduced-motion:reduce){.cur,.shake{animation:none}}
.figw{margin:.7em 0}.figw pre.fig{margin:0}
.pp{font:inherit;font-size:.78em;color:var(--dim);background:none;border:1px solid var(--dim);border-radius:3px;padding:0 8px;margin-top:4px;cursor:pointer;text-transform:none;text-shadow:none}
.pp:hover{color:var(--bg);background:var(--fg)}
.chrow{display:grid!important;grid-template-columns:2.5ch 1fr auto;gap:10px;width:100%;text-align:left;margin:3px 0;white-space:normal!important}
.box button.chrow.on{outline:2px solid var(--acc)}div.chrow.off{color:var(--dim);padding:3px 10px;font-size:.9em}
#sheet{display:none}
@media print{html,body{height:auto;overflow:visible;background:#fff}#win,#fx,#rain,.panel,#crash,#ghostf{display:none!important}#sheet{display:block;color:#000;font:11pt/1.4 Georgia,serif;text-shadow:none;padding:0 6mm}#sheet h1{font-size:17pt}#sheet h2{font-size:13pt;border-bottom:1px solid #000;margin-top:14pt}#sheet pre{font:9.5pt/1.35 Menlo,Consolas,monospace;white-space:pre-wrap}#sheet li{margin-bottom:5pt;break-inside:avoid}#sheet dt{font-weight:700}#sheet dd{margin:0 0 5pt 0}}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<div id="win">
  <div id="bar"><div class="l"><span class="dots"><i></i><i></i><i></i></span><span id="ttl"></span></div>
    <div class="r"><button id="bBook" aria-label="Choose chapter"></button><button id="bTheme" aria-label="Choose terminal"></button><select id="sSpeed" aria-label="Typing speed"><option value="slow">slow</option><option value="normal">normal</option><option value="fast">fast</option><option value="instant">instant</option></select><select id="sDiff" aria-label="Difficulty"><option value="chill">chill</option><option value="normal">normal</option><option value="hardcore">hardcore</option></select><button id="bSound" aria-label="Sound menu"></button><span class="wbtn">─□✕</span></div></div>
  <div id="screen"><div id="out"></div><div id="inl" hidden><span id="ps1"></span> <span id="typed"></span><span id="wc"></span></div><div id="chips"></div></div>
  <div id="status"></div>
</div>
<form id="ghostf"><input id="ghost" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Terminal input"></form>
<div id="fx"></div><div id="crash" hidden></div><div id="sheet"></div>
<script>
/* ================= helpers (shared by the page and the content validator) ================= */
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rint=(a,b,step=1)=>a+step*Math.floor(Math.random()*(Math.floor((b-a)/step)+1));
const fmt=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString('en-US');
const fmt2=n=>(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=(n,d=1)=>(+n).toFixed(d)+'%';
const rep=(c,n)=>n>0?c.repeat(Math.round(n)):'';
const padE=(s,n)=>String(s).padEnd(n),padS=(s,n)=>String(s).padStart(n);
const bar=(v,max,w)=>{const k=Math.max(0,Math.min(w,Math.round(v/max*w)));return rep('█',k)+rep('░',w-k)};
const rot=(s,k)=>{k=((k%s.length)+s.length)%s.length;return s.slice(k)+s.slice(0,k)};
const lane=(pat,len,k)=>rot(pat.repeat(Math.ceil(len/pat.length)+1),k).slice(0,len);
const pts=(P,x)=>{if(x<=P[0][0])return P[0][1];for(let k=1;k<P.length;k++)if(x<=P[k][0]){const a=P[k-1],b=P[k];return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0])}return P[P.length-1][1]};
const norm=s=>String(s==null?'':s).toLowerCase().replace(/[^a-z0-9.]+/g,' ').trim();
const num=s=>{s=String(s==null?'':s).toLowerCase().replace(/[$,%\s]/g,'');let m=1;if(/k$/.test(s)){m=1000;s=s.slice(0,-1)}else if(/m$/.test(s)){m=1e6;s=s.slice(0,-1)}const v=parseFloat(s);return isNaN(v)?NaN:v*m};
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const arg=(a,i,d)=>{const v=num(a&&a[i]);return isNaN(v)?d:v};
const words=s=>String(s==null?'':s).trim().split(/\s+/).filter(w=>/[a-z0-9]/i.test(w)).length;
// numeric marking: within tol (default 0.6%); a trailing k/m suffix is also accepted as plain units ("4.5m" for an answer in $ millions)
const numOK=(str,a,tol)=>{const near=x=>!isNaN(x)&&Math.abs(x-a)<=Math.max(Math.abs(a)*(tol||.006),.006);return near(num(str))||near(parseFloat(String(str).replace(/[$,%\s]/g,'')))};
/* question builders */
const mc=(q,o,why)=>({t:'mc',q,o,why}),tf=(q,a,why)=>({t:'tf',q,a,why}),fill=(q,a,why)=>({t:'fill',q,a,why}),nm=(q,a,why,u,tol)=>({t:'num',q,a,why,u,tol});
const sa=(q,m,k,need)=>({t:'sa',q,m,k,need});
const gradeSA=(it,ans)=>{const a=' '+norm(ans)+' ';return it.k.filter(g=>g.some(s=>{const k=norm(s);return k&&a.includes(k)})).length>=(it.need||it.k.length)};
/* the book */
const PARTS=[['I','Money and the Financial System',[1,2,3]],['II','Interest Rates, Financial Instruments, and Financial Markets',[4,5,6,7,8,9,10]],['III','Financial Institutions',[11,12,13,14]],['IV','Central Banks, Monetary Policy, and Financial Stability',[15,16,17,18,19]],['V','Modern Monetary Economics',[20,21,22,23]]];
const TITLES={1:'An Introduction to Money and the Financial System',2:'Money and the Payments System',3:'Financial Instruments, Markets, and Institutions',4:'Future Value, Present Value, and Interest Rates',5:'Understanding Risk',6:'Bonds, Bond Prices, and Interest Rates',7:'The Risk and Term Structure of Interest Rates',8:'Stocks, Stock Markets, and Market Efficiency',9:'Derivatives: Futures, Options, and Swaps',10:'Foreign Exchange',11:'The Economics of Financial Intermediation',12:'Depository Institutions: Banks and Bank Management',13:'Financial Industry Structure',14:'Regulating the Financial System',15:'Central Banks in the World Today',16:'The Structure of Central Banks: the Fed and the ECB',17:'The Central Bank Balance Sheet and the Money Supply',18:'Monetary Policy: Stabilizing the Domestic Economy',19:'Exchange Rate Policy and the Central Bank',20:'Money Growth, Money Demand, and Monetary Policy',21:'Output, Inflation, and Monetary Policy',22:'Understanding Business Cycle Fluctuations',23:'Modern Monetary Policy and Central Bank Challenges'};
const BOOK={ch:{},add(c){c.gloss=(c.gloss||[]).map(g=>Array.isArray(g)?{n:g[0],d:g[1],ex:g[2]||'',see:g[3]||[]}:g);c.title=c.title||TITLES[c.n];this.ch[c.n]=c}};

/* ================= figure templates: data in, looping animation out =================
   Every figure is {n, fps, hold, intro?, reset?, r(i)} where r(i) returns the text for frame i (0..n).
   Keep every line <= 56 characters. */
const FW=54;
const TPL={
 // bars({title,rows:[[label,value,text?]],max?,note?,seq?})  bars grow; text shown at the end of each bar
 bars:o=>{const R=o.rows,mx=o.max||Math.max(...R.map(r=>Math.abs(r[1])))||1,lw=Math.max(...R.map(r=>String(r[0]).length))+1,sf=R.map(r=>r[2]!=null?String(r[2]):String(r[1])),sw=Math.max(...sf.map(s=>s.length)),bw=Math.max(4,Math.min(o.w||26,FW-3-lw-sw)),N=o.seq?R.length*6:12;
   return{n:N,fps:o.fps||12,hold:o.hold==null?3200:o.hold,r:i=>{const L=o.title?[' '+o.title]:[];R.forEach((r,k)=>{const p=o.seq?Math.max(0,Math.min(1,(i-k*6)/6)):i/12,len=Math.max(p>0&&r[1]?1:0,Math.round(Math.abs(r[1])/mx*bw*p));L.push(' '+padE(r[0],lw)+padE(rep('█',len),bw)+' '+(p>=1?sf[k]:''))});L.push(o.note&&i>=N?' '+o.note:'');return L.join('\n')}}},
 // morph({title,rows:[[label,from,to,suffix|fn]],max?,capA,capB})  bars slide between two states, back and forth
 morph:o=>{const R=o.rows,mx=o.max||Math.max(...R.flatMap(r=>[r[1],r[2]]))||1,lw=Math.max(...R.map(r=>String(r[0]).length))+1,bw=Math.max(6,Math.min(o.w||22,FW-14-lw)),N=24,show=(r,v)=>typeof r[3]==='function'?r[3](v):Math.round(v)+(r[3]||'');
   return{n:N*2,fps:o.fps||9,hold:0,intro:N,r:i=>{const p=i<=N?i/N:(2*N-i)/N,e=p<.2?0:p>.8?1:(p-.2)/.6,L=o.title?[' '+o.title]:[];R.forEach(r=>{const v=r[1]+(r[2]-r[1])*e;L.push(' '+padE(r[0],lw)+bar(v,mx,bw)+' '+show(r,v)+(e>0&&e<1&&r[2]!==r[1]?(r[2]>r[1]?' ▲':' ▼'):''))});L.push(' '+(e<.5?(o.capA||''):(o.capB||'')));return L.join('\n')}}},
 // steps({title,lines:[...]})  lines appear one at a time with a marker: chains of cause and effect, worked calculations
 steps:o=>{const ls=o.lines,N=ls.length;return{n:N,fps:o.fps||1.1,hold:o.hold==null?3600:o.hold,r:i=>{const L=o.title?[' '+o.title]:[];ls.forEach((l,k)=>L.push(i>=N||k<i?'   '+l:k===i?' ▶ '+l:''));return L.join('\n')}}},
 // chain({title,nodes:[...],caps:[...],end?,token?})  a token hops along a row of boxes, one caption per stop
 chain:o=>{const nd=o.nodes,sep=o.sep||' ─▶ ',N=nd.length,pos=[];let x=1;nd.forEach(s=>{pos.push(Math.max(0,x+Math.floor(s.length/2)-1));x+=s.length+sep.length});const tk=o.token||'(*)';
   return{n:N*2,fps:o.fps||1.5,hold:o.hold==null?3400:o.hold,r:i=>{const s=Math.min(N-1,Math.floor(i/2)),L=o.title?[' '+o.title]:[];L.push(' '+nd.join(sep),rep(' ',pos[s])+tk);(o.caps||[]).forEach((c,k)=>L.push(k<=s?' '+c:''));if(o.end)L.push(i>=N*2?' '+o.end:'');return L.join('\n')}}},
 // lanes({left:[...],mid:'BANK',right:[...],sym:'$',lh,mh,rh,note})  things flow from the left, through the middle, to the right
 lanes:o=>{const A=o.left,B=o.right,sym=o.sym||'$',n=Math.max(A.length,B.length),lw=Math.max(...A.map(s=>s.length),(o.lh||'').length),mid=o.mid||'BANK',mw=Math.max(8,mid.length+2),rw=Math.max(...B.map(s=>s.length)),ln=Math.max(5,Math.floor((FW-5-lw-mw-rw)/2)),pat=sym+'────';
   return{n:40,fps:12,hold:0,r:i=>{const a=k=>lane(pat,ln,-(i+k*2))+'▶',L=[' '+padE(o.lh||'',lw+ln+2)+padE(o.mh||'',mw+2)+' '+(o.rh||''),' '+rep(' ',lw+ln+2)+'┌'+rep('─',mw)+'┐'];
    for(let k=0;k<n;k++){const m=k===Math.floor((n-1)/2)?mid:'',pl=Math.floor((mw-m.length)/2);L.push(' '+padE(A[k]||'',lw)+' '+(A[k]?a(k):rep(' ',ln+1))+'│'+rep(' ',pl)+m+rep(' ',mw-pl-m.length)+'│'+(B[k]?a(k+1)+' '+B[k]:''))}
    L.push(' '+rep(' ',lw+ln+2)+'└'+rep('─',mw)+'┘');if(o.note)L.push(' '+o.note);return L.join('\n')}}},
 // taccount({title,frames:[{cap,A:[[name,value]],L:[[name,value]]}],money?:false})  a balance sheet that changes step by step; changed lines get a *
 taccount:o=>{const F=o.frames,cw=24,f$=o.money===false?(v=>v.toLocaleString('en-US')):fmt,mr=Math.max(...F.map(f=>Math.max(f.A.length,f.L.length)));
   const side=(rows,prev)=>rows.map(([n,v],k)=>{const ch=prev&&(!prev[k]||prev[k][1]!==v||prev[k][0]!==n);return padE(n,cw-11)+padS(typeof v==='number'?f$(v):v,10)+(ch?'*':' ')}),tot=rows=>rows.every(r=>typeof r[1]==='number')?rows.reduce((s,r)=>s+r[1],0):null;
   return{n:F.length-1,fps:o.fps||.4,hold:o.hold==null?4500:o.hold,r:i=>{const f=F[i],p=i?F[i-1]:null,A=side(f.A,p&&p.A),B=side(f.L,p&&p.L),L=o.title?[' '+o.title]:[];L.push(' '+padE('ASSETS',cw)+' │ LIABILITIES');
    for(let k=0;k<mr;k++)L.push(' '+padE(A[k]||'',cw)+' │ '+(B[k]||''));const ta=tot(f.A),tb=tot(f.L);L.push(' '+rep('─',cw)+'─┼─'+rep('─',cw));if(ta!=null&&tb!=null)L.push(' '+padE(padE('Total',cw-11)+padS(f$(ta),10),cw)+' │ '+padE('Total',cw-11)+padS(f$(tb),10));
    L.push(' '+(F.length>1?`${i+1}/${F.length}: `:'')+(f.cap||''));return L.join('\n')}}},
 // plot({title,xl,yl,xr:[a,b],yr:[a,b],curves:[{f:x=>y | pts:[[x,y]],ch,name}],shift?:{curve:idx,to:{f|pts},cap},eq?:[i,j],eqf?,cap?})
 //   draws curves left to right; optionally shifts one curve (its old position stays as dots) and marks the crossing point with ●
 plot:o=>{const W=o.W||40,H=o.H||9,[x0,x1]=o.xr||[0,1],[y0,y1]=o.yr||[0,1],C=o.curves,D=22,Sh=o.shift?18:0,yv=(c,x)=>c.f?c.f(x):pts(c.pts,x),yf=o.yf||(v=>String(+v.toFixed(2)));
   const val=(k,x,t)=>{let y=yv(C[k],x);if(t>0&&o.shift&&k===o.shift.curve)y+=(yv(o.shift.to,x)-y)*t;return y},row=y=>H-1-Math.round((y-y0)/(y1-y0)*(H-1));
   return{n:D+Sh,fps:o.fps||11,hold:o.hold==null?3600:o.hold,r:i=>{const g=Array.from({length:H},()=>rep(' ',W).split('')),t=i<=D?0:(i-D)/Sh,cols=Math.min(W,Math.ceil(W*Math.min(1,i/D)));
    const put=(k,tt,ch)=>{let py=null;for(let cx=0;cx<cols;cx++){const x=x0+(x1-x0)*cx/(W-1),y=val(k,x,tt);if(y==null||isNaN(y)){py=null;continue}const r=row(y);if(r>=0&&r<H)g[r][cx]=ch;if(py!=null&&Math.abs(r-py)>1){const s=r>py?1:-1;for(let q=py+s;q!==r;q+=s)if(q>=0&&q<H&&g[q][cx]===' ')g[q][cx]=ch}py=r}};
    if(o.shift&&t>0)put(o.shift.curve,0,'·');C.forEach((c,k)=>put(k,t,c.ch||'*'));let eqs='';

      nm("What is the present value of $500 to be paid in 3 years at 4%? (to the cent)",444.50,"500 / (1.04)^3 = 500 / 1.124864 = 444.50",'$')],
   sa:[sa("What is present value?","The value today of a payment promised in the future.",[['today','present','current','right away'],['future','later','promised','will be']]),
       sa("How do you compute present value?","Divide future value by (1 + i) to the n.",[['divid','over','discount','fv 1','value 1','payment 1'],['1 i','one plus','1 plus','interest','rate']])],
   line:"present value is future value divided by one plus i to the n"},

  {h:'Three levers',
   beats:[
    ["Stare at the formula and three properties fall out. Present value is higher:","  1. the higher the future payment, FV","  2. the shorter the time until the payment, n","  3. the lower the interest rate, i"],
    ["Lever one is proportional. At 5 percent, $100 due in two years is worth $90.70 today. Double the payment to $200 and the present value doubles to $181.40. Change FV by any percentage and PV changes by the same percentage, in the same direction."],
    {fig:'plot',a:[{title:'PRESENT VALUE OF $100',xl:'years until the payment',yl:'PV $',xr:[0,30],yr:[0,100],curves:[{f:x=>100/Math.pow(1.05,x),ch:'*',name:'value today of $100 paid in that year'}],cap:'rate 5%: $50 at 14.4 years · $25 at 28.8 · $23 at 30',shift:{curve:0,to:{f:x=>100/Math.pow(1.10,x)},cap:'rate 10%: lower at every date (dots = the 5% curve)'}}]},
    ["Lever two is time. At 5 percent, $100 paid right now is worth $100. Paid in 30 years it is worth about $23.","Look at the halving points. $100 due in *14.4 years* is worth $50 today. Due in 28.8 years, $25. That is the rule of 72 running backwards: 72 / 5 = 14.4."],
    {fig:'bars',a:[{title:'$100 DUE IN 10 YEARS, VALUED TODAY',rows:[['at 1%',90.53,'$90.53'],['at 5%',61.39,'$61.39'],['at 10%',38.55,'$38.55'],['at 15%',24.72,'$24.72']],max:100,seq:true,note:'higher interest rate, lower present value'}]},
    ["Lever three is the interest rate. A higher rate means a lower present value, whatever the size or timing of the payment.","Future value rises with the interest rate. Present value falls with it. Mirror images."]
   ],
   q:[mc("Which change RAISES the present value of a promised payment?",["The interest rate falls","The payment date is pushed further into the future","The interest rate rises","The promised payment is cut and the rate is unchanged"],"PV is higher with a bigger payment, a shorter wait, or a lower rate."),
      nm("At 5%, $100 due in 14.4 years is worth $50 today. What is $100 due in 28.8 years worth today, in dollars?",25,"Two halvings: 100, 50, 25. The rule of 72 in reverse.",'$')],
   sa:[sa("What three things make present value higher?","Bigger payment, shorter wait, lower interest rate.",[['bigger','larger','higher pay','higher fut','higher fv','higher amount','higher value','more','greater'],['short','sooner','less time','earlier','near','fewer','closer'],['lower','low rate','smaller rate','rate fall','falls','reduced rate','low interest','lesser']]),
       sa("What happens to present value when the interest rate rises?","Present value falls: the payment is discounted more heavily.",[['fall','decreas','lower','drop','declin','down','reduc','less','shrink','smaller']],1)],
   line:"bigger payment shorter wait lower rate all raise present value"},

  {h:'Far payments fall hardest',
   beats:[
    ["Here is the lesson the bond market runs on. A rise in the interest rate lowers every present value. It does not lower them equally."],
    {fig:'table',a:[{title:"PRESENT VALUE OF $100 (the book's Table 4.2)",head:['RATE','1 YEAR','5 YEARS','10 YEARS','20 YEARS'],rows:[['1%','$99.01','$95.15','$90.53','$81.95'],['3%','$97.09','$86.26','$74.41','$55.37'],['5%','$95.24','$78.35','$61.39','$37.69'],['10%','$90.91','$62.09','$38.55','$14.86'],['15%','$86.96','$49.72','$24.72','$6.11']],note:'down a column: rate up, PV down · across: later, lower'}]},
    ["Read down any column: higher rate, lower present value. Read across any row: longer wait, lower present value. Now watch three of those columns as the rate goes from 1 to 5 percent."],
    {fig:'morph',a:[{title:'THE RATE RISES FROM 1% TO 5%',rows:[['$100 in 1 year',99.01,95.24,v=>'$'+v.toFixed(2)],['$100 in 10 years',90.53,61.39,v=>'$'+v.toFixed(2)],['$100 in 20 years',81.95,37.69,v=>'$'+v.toFixed(2)]],max:100,capA:'interest rate 1%',capB:'interest rate 5%: the far payments fall most'}]},
    ["One year out: $99.01 falls to $95.24. A drop of $3.77, just under 4 percent. For a single payment a year away, the percentage fall in present value is roughly the percentage-point rise in the rate.","Ten years out: $90.53 falls to $61.39. A drop of $29.14, more than 30 percent."],
    ["Why? Look at the formula. The interest rate sits inside (1 + i)^n. For a payment one year away it is applied once. For a payment 20 years away it is applied 20 times, so any change in the rate is magnified.","At 20 years the same move, 1 to 5 percent, takes $81.95 down to $37.69. More than half the value, gone."],
    ["The further in the future a promised payment is, the more its present value falls when the interest rate rises. A change in rates hits a distant payment far harder than a near one.","Hold on to this. Long-term bonds are made of distant payments."]
   ],
   q:[mc("Interest rates rise by one percentage point. Which promise loses the largest share of its present value?",["$100 due in 20 years","$100 due in 1 year","$100 due in 5 years","All three lose the same percentage"],"The further away the payment, the more its present value falls."),
      mc("Two five-year bonds: one pays coupons only in years 1, 2 and 3, the other only in years 3, 4 and 5. Rates rise. Which price falls more?",["The one paying in years 3, 4 and 5","The one paying in years 1, 2 and 3","Both fall by the same percentage","Neither: the coupons are fixed, so the prices are fixed"],"Its payments are further away, so their present values fall more.")],
   sa:[sa("Which payments lose most value when interest rates rise?","Those furthest in the future.",[['furth','far','distant','long','later','latest','remote'],['future','payment','away','term','out','those','ones','matur']]),
       sa("Why does a rate rise hurt distant payments more?","They are discounted over more years, so the effect compounds.",[['more years','more time','more period','longer','many years','higher n','larger n','bigger n','exponent','power','each year','every year','more times','repeated'],['discount','compound','divid','rate','effect','1 i']])],
   line:"the further away the payment the more a rate rise cuts its value"},

  {h:'What the distant future is worth',
   beats:[
    ["A harder use of the same formula. How much should we spend today to avoid $1 of damage 100 years from now? Rising seas, radioactive waste, that sort of bequest.","If all we care about is the present value of the expected loss, one number decides nearly everything: the *discount rate*, the interest rate used to bring a future amount back to today."],
    {fig:'bars',a:[{title:'VALUE TODAY OF A $1 LOSS IN 100 YEARS',rows:[['at 1%',37,'$0.37'],['at 2%',14,'$0.14'],['at 4%',2,'under $0.02']],max:40,seq:true,note:'spending more than this today would not pay'}]},
    ["At 1 percent that $1 is worth 37 cents today. At 2 percent, 14 cents. At 4 percent, less than 2 cents. Spending more than those amounts today would not make economic sense.","Over a century a small change in the rate moves the answer enormously. That is the last section's lesson at full stretch."],
    ["Which rate is right? Economists look at market prices, and those point to roughly 1 to 2.5 percent. Long-term inflation-indexed U.S. Treasury bonds have yielded around 1 percent in recent years. Land leases that run for several hundred years point to a rate close to 2.5 percent."],
    {fig:'compare',a:[{left:{h:'DISCOUNT AT 1.4%',lines:['distant losses weigh','heavily today','→ large carbon tax now']},right:{h:'DISCOUNT AT 4.3%',lines:['distant losses almost','vanish today','→ tax about one-tenth']},note:'the quarrel is largely about the discount rate'}]},
    ["This is why serious climate analysts disagree. One well-known report used 1.4 percent and called for a large carbon tax. Another used 4.3 percent and called for a tax about one-tenth the size. A low rate puts far more weight on losses hundreds of years away.","It is not only the rate. The scale of the loss counts too. If the calamity threatens life on earth, people may judge that a very low rate is right, because they would not value future lives below their own."]
   ],
   q:[mc("Two analysts agree on the future damage from climate change, but one wants a far larger carbon tax today. The most likely reason:",["she uses a lower discount rate","she uses a higher discount rate","she expects higher inflation","she ignores present value"],"A low discount rate makes distant losses loom large today."),
      nm("At a 2% discount rate, what is the value today of a $1 loss 100 years from now? (in dollars, two decimals)",0.14,"1 / (1.02)^100 = 1 / 7.24 = 0.14",'$')],
   sa:[sa("Why do climate analysts disagree about what to spend today?","They use different discount rates for distant losses.",[['discount','interest','rate'],['differ','low','high','disagree','vary','varies','various','which','choice','choos']]),
       sa("How does a lower discount rate change the value of distant losses?","It raises their present value, justifying more spending today.",[['rais','higher','increas','more','larger','bigger','greater','heavier','goes up','rise']],1)],
   line:"a lower discount rate makes the distant future worth more today"}
 ]},

 /* ───────────────────────── 4 ───────────────────────── */
 {id:'internal-rate-of-return',title:'INTERNAL RATE OF RETURN',secs:[
  {h:'The tennis racket machine',
   beats:[
    ["So far, one payment at a time. Real life pays in streams. The rule for a stream is short: value each payment on its own, then add. Present value is additive. The whole is the sum of its parts."],
    ["You run a sports equipment factory. A machine that makes tennis rackets costs $1 million. It turns out 3,000 rackets a year, you sell them wholesale at $50 each, so it brings in $150,000 a year. It runs perfectly for exactly 10 years, then stops dead with no resale value.","Should you buy it?"],
    {fig:'steps',a:[{title:'THE MACHINE, IN NUMBERS',lines:['cost today                 $1,000,000','rackets per year                3,000','price each, wholesale             $50','revenue per year             $150,000','working life                 10 years','total revenue              $1,500,000','...but those dollars arrive later']}]},
    ["First find the *internal rate of return*: the interest rate that makes the present value of an investment's payments equal to its cost.","*$1,000,000 = $150,000/(1+i) + $150,000/(1+i)^2 + ... + $150,000/(1+i)^10*","Each year's revenue is discounted on its own. You cannot take the present value of the $1.5 million total."],
    {fig:'seek',a:[1000000,150000,10]},
    ["A financial calculator or a spreadsheet does the hunt you just watched. The answer is *8.14 percent*. Putting $1 million into the machine earns 8.14 percent a year.","Whether that is good enough depends on what the $1 million costs you. That is next."]
   ],
   q:[mc("The internal rate of return on an investment is the interest rate at which:",["the present value of its payments equals its cost","the plain sum of its payments equals its cost","its future value is twice its cost","its payments match those on a 5% loan"],"Discount each payment, add them up, and find the rate that makes the total equal the cost."),
      nm("An investment costs $1,000 today and makes a single payment of $1,210 in two years. What is its internal rate of return, in percent?",10,"1,000 = 1,210 / (1 + i)^2, so (1 + i)^2 = 1.21 and i = 10%",'%')],
   sa:[sa("What is the internal rate of return?","The interest rate that equates present value with cost.",[['rate','interest','return'],['present value','pv','discounted'],['cost','price','equal','equat','outlay','same as','match']]),
       sa("How do you value a stream of payments?","Sum the present values of each payment.",[['sum','add','total','plus'],['present value','pv','discount']])],
   line:"the internal rate of return makes present value equal to cost"},

  {h:'The fixed-payment loan',
   beats:[
    ["There are two ways to find the $1 million. Use *retained earnings*, the profits your firm has saved, or borrow.","Retained earnings are not free. You could have lent them to someone at the going rate, and that forgone interest is their opportunity cost. Either way, the hurdle is the interest rate."],
    ["Say you borrow and repay in 10 equal yearly payments. That is a *fixed-payment loan*, exactly like a car loan or a mortgage.","The payment is set so that the present value of all the payments equals the amount lent:","*Loan = payment/(1+i) + payment/(1+i)^2 + ... + payment/(1+i)^n*"],
    {fig:'table',a:[{title:'YEARLY PAYMENT ON A 10-YEAR $1,000,000 LOAN',head:['INTEREST RATE','PAYMENT','VS $150,000'],rows:[['5%','$129,505','OK'],['6%','$135,868','OK'],['7%','$142,378','OK'],['8%','$149,030','OK'],['9%','$155,820','LOSS'],['10%','$162,745','LOSS']],note:'the machine brings in $150,000 a year'}]},
    ["The higher the interest rate, the bigger the payment. Your machine brings in $150,000 a year. At 8 percent the payment is $149,030 and you cover it. At 9 percent it is $155,820 and you do not."],
    ["Look closely: the loan equation and the internal rate of return equation are the same equation. The internal rate of return, 8.14 percent, is the loan rate at which $150,000 a year would exactly cover the payments.","So the rule. Buy the machine if its internal rate of return is above the interest rate on the loan. In general, *an investment is profitable if its internal rate of return exceeds the cost of borrowing*."],
    {fig:'compare',a:[{left:{h:'BORROW AT 7%',lines:['return 8.14% > 7%','revenue  $150,000','payment  $142,378','PROFIT: buy it']},right:{h:'BORROW AT 9%',lines:['return 8.14% < 9%','revenue  $150,000','payment  $155,820','LOSS: walk away']}}]}
   ],
   q:[mc("A project's internal rate of return is 8.14%. The bank lends at 9%. You have enough retained earnings to pay for it yourself. You should:",["pass: lending the earnings out at 9% beats the project","invest: retained earnings cost nothing to use","invest: any positive return is a profit","invest: 8.14% is close enough to 9%"],"Retained earnings have an opportunity cost: the rate you could lend them at. The hurdle is still 9%."),
      nm("A 10-year $1,000,000 loan at 7% costs $142,378 a year. The machine earns $150,000 a year. What is left over each year, in dollars?",7622,"150,000 - 142,378 = 7,622. Positive, because 8.14% is above 7%.",'$')],
   sa:[sa("When is an investment profitable?","When its internal rate of return exceeds the borrowing cost.",[['internal rate','irr','return'],['exceed','greater','above','higher','more than','bigger','larger','beats','over'],['borrow','interest','loan','cost','rate']]),
       sa("What is a fixed-payment loan?","A loan repaid in equal payments, like a mortgage.",[['equal','fixed','same','constant','level','identical'],['payment','instal','amount','repay','paid']])],
   line:"invest if the internal rate of return exceeds the cost of borrowing"},

  {h:'Two offers and a degree',
   beats:[
    ["Back to the question I left hanging. You lend $225. The borrower offers to repay $100 a year for three years, or $125 a year for two. Which do you take?","Find the internal rate of return of each stream: the rate that makes its present value equal to $225."],
    {fig:'seek',a:[225,100,3]},
    ["Three payments of $100: the rate that solves $225 = 100/(1+i) + 100/(1+i)^2 + 100/(1+i)^3 is *15.9 percent*.","Two payments of $125: the rate is *7.3 percent*.","As the lender you take the three payments. The same $225 goes out, and it earns more than twice the rate."],
    {fig:'table',a:[{title:'YOU LEND $225. WHICH REPAYMENT?',head:['OFFER','TOTAL REPAID','RATE EARNED'],rows:[['3 x $100','$300','15.9%'],['2 x $125','$250','7.3%']],note:'take the three payments'}]},
    ["The same test prices a college degree. In 2019 a four-year school cost about $26,500 a year on average, or $106,000 for the degree: more than a third of the median house price that year.","One estimate for Ohio State: $374,000 of extra wages over the first 20 working years, against a bill of $103,000. That works out to a real return of about *8 percent* a year. Across nearly 2,000 four-year colleges the median real return is 4.6 percent."],
    {fig:'bars',a:[{title:'COLLEGE: REAL RETURN VS REAL LOAN RATE',rows:[['Ohio State degree',8,'8%'],['median college',4.6,'4.6%'],['student loan, high',4,'4%'],['student loan, low',2,'2%']],max:10,note:'return above the loan rate: worth it, on average'}]},
    ["Student loans usually cost 2 to 4 percent in real terms, so the typical degree clears the hurdle. On average.","The pitfalls: some students never finish, and loans for for-profit schools are very risky. Of the loans that entered repayment in 2010, nearly half of those at for-profit schools were expected to default, against an 18 percent average. A return you never collect is not a return."]
   ],
   q:[mc("You lend $225. Offer A repays $100 a year for 3 years (rate of return 15.9%). Offer B repays $125 a year for 2 years (7.3%). As the lender:",["take A: it earns the higher rate of return","take B: you are repaid sooner","take B: each payment is larger","either: both repay more than $225"],"Compare the internal rates of return, not the speed or the size of the payments."),
      mc("A degree's real return is 4.6% and the real interest rate on the student loan is 3%. On these numbers alone, borrowing to study is:",["worthwhile: the return exceeds the cost of borrowing","not worthwhile: 4.6% is below the 8% of a top school","not worthwhile: debt always cancels the return","impossible to judge without the inflation rate"],"Same rule as the machine. Both rates are already real, so inflation is dealt with.")],
   sa:[sa("How do you choose between two repayment offers on one loan?","Compare internal rates of return; take the higher.",[['internal rate','irr','rate of return','return','yield','interest rate'],['higher','highest','compare','bigger','larger','greater','best','more']]),
       sa("When is borrowing for college worth it?","When its real return exceeds the real loan rate.",[['return','payoff','earn','wage','income'],['exceed','above','higher','greater','more than','beats','over','bigger','larger'],['loan','interest','rate','borrow','cost']])],
   line:"compare the internal rates of return and take the higher one"}
 ]},

 /* ───────────────────────── 5 ───────────────────────── */
 {id:'bonds',title:'BONDS',secs:[
  {h:'What a bond promises',
   beats:[
    ["The commonest use of present value is pricing bonds. A *bond* is a promise to make a series of payments on specific future dates. The borrower sells this IOU to the lender in return for money today. Governments and corporations both issue them.","It is a legal contract. It requires the borrower to make the payments, and it says what happens if the borrower does not."],
    {fig:'direct'},
    ["The most common kind is the *coupon bond*. Say a borrower sells a $100 bond with a *coupon rate* of 5 percent. Every year it pays the holder a *coupon payment* of $5.","*Coupon payment = coupon rate x amount borrowed*"],
    {fig:'clip',a:[100,5,5]},
    ["The bond also names its *maturity date*, when the payments stop and the original $100 is repaid. That last payment has three names, and you need all three: *principal*, *face value* and *par value*."],
    ["Why 'coupon'? Before computers, the certificate came with dated paper coupons attached. The investor cut one off and mailed it in to collect each payment. The book pictures a Reading Railroad bond issued May 1, 1945: $1,000 face value, 50 years, 3.5 percent coupon, a few coupons still attached.","Most bonds pay their coupons twice a year. I will use yearly payments to keep the sums clean."],
    ["Now the question that matters. What should you pay for this contract? *The price of a bond is the present value of its payments.*","I will value the principal first, then the coupons, then add them."]
   ],
   q:[nm("A coupon bond has a face value of $1,000 and a coupon rate of 4.5%. What is the yearly coupon payment, in dollars?",45,"0.045 x 1,000 = 45",'$'),
      mc("Which is NOT another name for the final repayment on a bond?",["coupon rate","principal","face value","par value"],"Principal, face value and par value are one thing. The coupon rate sets the yearly interest payment.")],
   sa:[sa("What is a coupon bond?","Promise of periodic interest payments plus a final principal payment.",[['coupon','interest','periodic','regular','yearly','annual'],['principal','face','par','final','maturity','repay']]),
       sa("What determines the price of a bond?","The present value of its promised payments.",[['present value','pv','discounted value','discount'],['payment','coupon','principal','cash','promis','stream']])],
   line:"the price of a bond is the present value of its payments"},

  {h:'Valuing the principal',
   beats:[
    ["Start with the easy piece. The principal is one payment on the maturity date, n years away. You already know how to value one of those."],
    ["*Value of principal = F / (1 + i)^n*","F is the face value. The longer the time to maturity, the lower the value. The higher the interest rate, the lower the value. Nothing new here."],
    {fig:'back',a:[1000,6,30]},
    ["A $1,000 principal due in 30 years, with the interest rate at 6 percent: $1,000 / (1.06)^30 = *$174.11*.","A promise that far off is worth only a fraction of its face value. Every year of waiting divides it by 1.06 once more. Shorten the wait to 10 years and the same $1,000 is worth $558.39."],
    {fig:'bars',a:[{title:'$1,000 DUE IN 30 YEARS, VALUED TODAY',rows:[['face value',1000,'$1,000.00'],['at 4%',308.32,'$308.32'],['at 6%',174.11,'$174.11']],max:1000,seq:true,note:'two points on the rate: from $174 to $308'}]},
    ["Lower the rate to 4 percent and the value jumps to *$308.32*. Still much less than half the payment itself, but 77 percent more than it was. A two-point move in the rate did that.","You know why. Distant payments are the most sensitive to the interest rate, and a 30-year principal is about as distant as my customers get.","So at rates like these, the principal is a small part of what the buyer of a 30-year bond pays for today. Much of the value has to come from the coupons."]
   ],
   q:[mc("The interest rate falls from 6% to 4%. The present value of a $1,000 principal due in 30 years:",["rises from $174.11 to $308.32","falls from $308.32 to $174.11","stays at $1,000, its face value","rises to exactly $1,000"],"A lower rate means a higher present value, and distant payments react the most."),
      nm("A bond's $1,000 principal is due in 10 years. At 5%, what is that payment worth today? (to the cent)",613.91,"1,000 / (1.05)^10 = 1,000 / 1.62889 = 613.91",'$')],
   sa:[sa("How do you value a bond's principal payment?","Divide face value by (1 + i) to the n.",[['divid','over','discount','present value','f 1 i','value 1','principal 1'],['face','principal','par','1 i','one plus','rate']]),
       sa("Why is a principal due in 30 years worth so little today?","It is discounted for 30 years of compounding interest.",[['discount','divid','present value','compound','time value'],['30','year','long','far','distant','time','many']])],
   line:"the principal is one distant payment discounted back to today"},

  {h:'Valuing the coupons',
   beats:[
    ["Now the coupons. They are a string of equal payments, one a year, much like the equal payments on the loan in the last module. Value each one separately and add them up, just as with the tennis rackets."],
    {fig:'table',a:[{title:'FIVE $10 PAYMENTS AT 6%',head:['YEAR','PAYMENT','DIVIDE BY','VALUE TODAY'],rows:[['1','$10','1.06','$9.43'],['2','$10','1.06^2','$8.90'],['3','$10','1.06^3','$8.40'],['4','$10','1.06^4','$7.92'],['5','$10','1.06^5','$7.47'],['sum','$50','','$42.12']],note:'each later $10 is worth a little less'}]},
    ["Two $10 payments at 6 percent: $9.43 + $8.90 = *$18.33*. Five of them: *$42.12*.","*Value of coupons = C/(1+i) + C/(1+i)^2 + ... + C/(1+i)^n*","Messy, the book admits. That is what calculators and spreadsheets are for."],
    ["Read the table from the top. The first $10 loses 57 cents to one year of discounting. The fifth loses $2.53 to five years of it. Same coupon, different dates, different values."],
    ["Two properties. First, the more payments there are, the higher their total value, even though each extra payment is further off and worth less. So the coupons on a 30-year bond are worth more than the coupons on a 5-year bond."],
    {fig:'bars',a:[{title:'$10 COUPONS, VALUED TODAY',rows:[['2 coupons at 6%',18.33,'$18.33'],['5 coupons at 6%',42.12,'$42.12'],['5 coupons at 7%',41.00,'$41.00']],max:50,seq:true,note:'more coupons: worth more · higher rate: worth less'}]},
    ["Second, as always, the higher the interest rate, the lower the present value. Raise the rate from 6 to 7 percent and the five payments fall from $42.12 to $41.00.","Trap: five $10 coupons add up to $50 of payments, but they are not worth $50 today. They would be only at an interest rate of zero."]
   ],
   q:[nm("What is the present value of three yearly payments of $100, the first a year from now, at 10%? (to the cent)",248.69,"100/1.1 + 100/1.21 + 100/1.331 = 90.91 + 82.64 + 75.13 = 248.69",'$'),
      nm("A bond pays a $10 coupon at the end of each of the next two years. At 6%, what are the two coupons worth today? (to the cent)",18.33,"10/1.06 + 10/(1.06)^2 = 9.43 + 8.90 = 18.33",'$')],
   sa:[sa("How do you value a bond's coupon payments?","Add up the present value of each coupon.",[['add','sum','total'],['present value','pv','discount']]),
       sa("Why are a long bond's coupons worth more than a short bond's?","It makes more payments, and each adds present value.",[['more payment','more coupon','more of them','longer','additional','extra','more interest','greater number','number of'],['payment','coupon','value','add']])],
   line:"value each coupon separately then add them up"},

  {h:'Price and the interest rate',
   beats:[
    ["Put the two pieces together.","*Bond price = value of coupons + value of principal*","*P = C/(1+i) + C/(1+i)^2 + ... + C/(1+i)^n + F/(1+i)^n*"],
    {fig:'stream',a:[1000,5,3,5]},
    ["That was a five-year, 5 percent coupon bond with a $1,000 face value, priced with the interest rate at 3 percent: *$1,091.59*. It is one of the book's end-of-chapter problems.","Two facts fall out of the formula. The price is higher when the coupon payments are higher. And the price is higher when the interest rate is lower."],
    {fig:'sweep'},
    ["Lower interest rates mean higher bond prices. Higher interest rates mean lower bond prices. The payments are fixed, so when the rate used to discount them goes up, their present value has to come down.","The same $1,000 bond: $1,141.40 at 2 percent, $1,091.59 at 3 percent, $1,044.52 at 4 percent."],
    ["Two refinements. When the interest rate is below the coupon rate, the bond is worth more than its face value. That is when you would pay over $1,000 for a $1,000 bond.","And the long bond swings most, because more of its value sits in far-off payments. You watched the 30-year bar lurch while the 5-year bar moved far less."]
   ],
   q:[mc("You would pay more than $1,000 for a 3-year, 10% coupon bond with a $1,000 face value when:",["the interest rate is below 10%","the interest rate is above 10%","the bond is close to its maturity date","inflation is expected to rise"],"Discount $100 coupons at less than 10% and the present value comes out above face value."),
      mc("Interest rates in the economy rise. The price of an existing coupon bond:",["falls: its fixed payments are discounted at a higher rate","rises: the bond now pays more interest","is unchanged: its payments are fixed","falls: its coupon payments shrink"],"The payments do not change. Their present value does.")],
   sa:[sa("What happens to bond prices when interest rates rise?","Bond prices fall.",[['fall','drop','declin','decreas','down','lower','reduc','less','shrink']],1),
       sa("Why do bond prices fall when interest rates rise?","Fixed payments are discounted at a higher rate.",[['fixed','payment','coupon','promis','same','cash'],['discount','present value','pv','worth less','divid']])],
   line:"higher interest rates mean lower bond prices"}
 ]},

 {id:'shortcuts-and-risks',title:'SHORTCUTS AND RISKS',secs:[
  {h:'The equal-payments shortcut',
   beats:[
    ["Adding up ten, thirty or 360 present values by hand is a job for a machine. I am a machine, and even I use a shortcut. The book's appendix derives it.","For n equal payments of C, discounted at rate i:","*PV = (C / i) x [1 - 1/(1 + i)^n]*"],
    ["How it is found: write out the sum, multiply the whole thing by 1/(1 + i), and subtract one line from the other. Every term in the middle cancels. Only the first and the last survive."],
    {fig:'steps',a:[{title:'A $100,000 MORTGAGE: 30 YEARS AT 8%',lines:['PV = (C / i) x [1 - 1/(1 + i)^n]','$100,000 = (C / 0.08) x [1 - 1/(1.08)^30]','$100,000 = 11.258 x C','C = $100,000 / 11.258','C = $8,882.57 a year']}]},
    ["A $100,000 mortgage over 30 years at 8 percent: the formula boils down to $100,000 = 11.258 x C, so the payment is *$8,882.57 a year*.","The rate must be a decimal, and at the same frequency as the payments. For 360 monthly payments you would use the monthly rate, 0.6434 percent, which compounds to 8 percent a year."],
    ["One formula, three uses: the fixed payment on a loan, the value of a bond's coupons, or, solved for i, an internal rate of return. The $1 million loan table two modules back came out of it."],
    {fig:'bars',a:[{title:'$1 A YEAR AT 5%: VALUE TODAY AS n GROWS',rows:[['10 years',7.72,'$7.72'],['30 years',15.37,'$15.37'],['100 years',19.85,'$19.85'],['for ever',20,'$20.00 = $1 / 0.05']],max:20,seq:true,note:'(computed with the formula) the ceiling is C / i'}]},
    ["As n grows, 1/(1 + i)^n shrinks towards zero. If the payments never end, the bracket becomes 1, and what is left is very short.","*PV of payments that never end = C / i*","So a machine that costs $1,000,000 and pays $75,000 a year for ever has an internal rate of return of 75,000 / 1,000,000 = 7.5 percent."]
   ],
   q:[nm("A promise pays $40 a year for ever. With the interest rate at 5%, what is it worth today, in dollars?",800,"PV = C / i = 40 / 0.05 = 800",'$'),
      nm("For a 30-year loan at 8%, loan = 11.258 x yearly payment. What is the yearly payment on a $250,000 loan? (to the dollar)",22206,"250,000 / 11.258 = 22,206. The payment scales with the size of the loan.",'$')],
   sa:[sa("What is the present value of equal payments that never end?","The payment divided by the interest rate: C / i.",[['divid','over','c i'],['rate','interest','c i']]),
       sa("How is the payment on a fixed-payment loan set?","So the payments' present value equals the amount borrowed.",[['present value','pv','discounted'],['equal','same','match','is the'],['loan','borrow','amount','principal','lent']])],
   line:"payments that never end are worth c divided by i"},

  {h:'The search for yield',
   beats:[
    ["Core Principle 2: risk requires compensation. To be paid properly for a risk, you first have to understand it. Present value explains one risk exactly.","If interest rates rise, a long-term bond loses more than a short-term bond, because its payments are further away. That exposure is *interest rate risk*, and buyers of long-term bonds usually insist on extra reward for carrying it."],
    {fig:'compare',a:[{left:{h:'SHORT-TERM BOND',lines:['payments arrive soon','rates rise: small loss','little interest rate','risk']},right:{h:'LONG-TERM BOND',lines:['payments far away','rates rise: big LOSS','buyers demand extra','reward as compensation']}}]},
    ["Investors still underestimate risk. The book gives three reasons.","One: they extrapolate. If rates have been low and stable lately, they expect more of the same and forget earlier, wilder times.","Two: defaults are rare in booms, and booms are long while recessions are short. People get used to default rates that are too low to last."],
    ["Three: professional managers may take risks that are not evident, or are concealed on purpose. When market interest rates are low, some try to keep paying clients well by taking greater risks. That is the *search for yield*.","Until events force the payments down, the client may think the manager is unusually skilful rather than lucky, or simply reckless."],
    {fig:'chain',a:[{title:'HOW A SEARCH FOR YIELD ENDS',nodes:['LOW RATES','REACH','OVERPAY','REPRICE'],caps:['safe assets pay little','investors reach for riskier, higher-yield bonds','buying bids prices up: the reward for risk shrinks','the risk arrives: risky prices fall hard, big LOSS'],end:'2007-2009: corporate and mortgage securities plunged',token:'($)'}]},
    ["The chase bids up the prices of risky securities and pushes the market's compensation for risk below a level that can last. When the risk finally shows up, say defaults rise, the prices of the riskier securities fall disproportionately.","In 2007-2009, corporate and mortgage security prices plunged. In the euro-area crisis that began in 2009, the same thing happened to bank and government debt. Markets reprice risk forcefully once the search has gone too far."]
   ],
   q:[mc("When market interest rates are low, a 'search for yield' tends to:",["bid up risky asset prices and shrink the reward for risk","push investors into safer, shorter-term bonds","raise the compensation investors receive for risk","lower the prices of risky securities straight away"],"Money chasing higher yields overpays for risk. The fall comes later."),
      mc("Why do buyers of long-term bonds usually insist on an extra reward?",["Long-term bond prices fall more when interest rates rise","Long-term bonds always carry more default risk","Long-term coupons are paid less often","Long-term payments are discounted at a lower rate"],"That reward is compensation for interest rate risk.")],
   sa:[sa("What is the search for yield?","Taking more risk for higher returns when rates are low.",[['risk'],['yield','return','higher','payout','interest','earn','income']]),
       sa("Why do long-term bonds carry more interest rate risk?","Distant payments lose more present value when rates rise.",[['distant','far','further','later','long','more year','away'],['value','price','loss','lose','fall','sensitiv','drop']])],
   line:"long bonds lose more than short bonds when interest rates rise"}
 ]},

 /* ───────────────────────── 7 ───────────────────────── */
 {id:'real-and-nominal',title:'REAL AND NOMINAL RATES',secs:[
  {h:'Dollars versus buying power',
   beats:[
    ["Everything so far was counted in dollars. The rate we used was the *nominal interest rate*: the interest rate expressed in current-dollar terms. It takes no notice of what inflation does to those dollars.","Borrowers and lenders do not really care about dollars. They care about what the dollars will buy."],
    ["Lend $100 for a year at 5 percent and you get back $105. Now suppose prices rose 5 percent during the year. Your $105 buys exactly what $100 bought on the day you handed it over.","Your inflation-adjusted return is zero. You waited a year for nothing."],
    {fig:'steps',a:[{title:'5% INTEREST, 5% INFLATION',lines:['you lend                 $100','you are repaid           $105','prices rose              5%','$105 buys what $100 bought a year ago','gain in dollars          5%','gain in buying power     0%']}]},
    ["The inflation-adjusted rate is the *real interest rate*. Borrowers look at the real cost of borrowing. Lenders look at the real return. No lender is likely to accept 5 percent nominal when 5 percent inflation is expected.","And because inflation can exceed the nominal rate, *the real interest rate can be negative*."],
    {fig:'fisher',a:[5,5]},
    ["A habit to form now. When people say 'the interest rate' with no label, they mean the nominal rate. It is the one the markets quote and the one you see every day. The real rate usually has to be worked out. The exception is inflation-indexed bonds, whose rates are quoted in real terms."]
   ],
   q:[nm("A can of paint costs $10. You save $100 for a year at a nominal rate of 21% while prices rise 10%. How many cans can you buy next year?",11,"You have $121 and a can costs $11: 11 cans, up from 10. Buying power grew 10%.",''),
      mc("You lend at a nominal rate of 3% and inflation over the year is 4%. Your real return is:",["about -1%: you can buy less than before","about 7%: add the two rates","about 1%: inflation minus the nominal rate","3%: inflation does not touch lenders"],"Real = nominal minus inflation = 3 - 4 = -1%. Real rates can be negative.")],
   sa:[sa("What is the nominal interest rate?","The interest rate expressed in current dollars.",[['dollar','money term','currency','quoted','stated','unadjusted','before inflation','without adjust','ignores inflation','observed'],['rate','interest','current','term']]),
       sa("What is the real interest rate?","The nominal rate adjusted for inflation: purchasing power terms.",[['inflation','purchasing power','buying power'],['adjust','minus','less','subtract','nominal','after','remov','term','net']])],
   line:"the real interest rate is the nominal rate adjusted for inflation"},

  {h:'The Fisher equation',
   beats:[
    ["You and a lender are agreeing a one-year loan. Both of you care about inflation over the coming year, because it decides what the repaid dollars will buy. Neither of you knows it. So you forecast it.","The rate you shake on has two parts: the real rate you agree on, plus the inflation you both expect."],
    ["*i = r + expected inflation*","Nominal interest rate = real interest rate + *expected inflation*. This is the *Fisher equation*, after the early 20th-century economist Irving Fisher.","Its message: the nominal rate moves with expected inflation. The higher expected inflation, the higher the nominal interest rate."],
    {fig:'fisher',a:[5,2]},
    ["History agrees. In 1980 and 1981 the U.S. Treasury had to pay more than 15 percent on its short-term borrowing. By 1986 the rate was close to 5 percent. A 10-point move in about five years.","Inflation fell by almost exactly as much. The real interest rate hardly changed."],
    {fig:'steps',a:[{title:'UNITED STATES, 1981 TO 1986',lines:['nominal rate    above 15%  →  about 5%','inflation       fell by almost as much','real rate       little changed','nominal rates follow inflation: Fisher at work']}]},
    ["Fine print. The simple equation is an approximation. The exact relation is","*(1 + i) = (1 + r) x (1 + expected inflation)*","which adds a cross-term: r x expected inflation. With r at 5 percent and inflation at 2 percent, that is 0.05 x 0.02 = 0.001. Ignore it.","With inflation at 100 percent the cross-term is 5 points. You need a nominal rate of 110 percent, not 105, to earn a real 5."],
    {fig:'steps',a:[{title:'WHEN THE SHORTCUT FAILS: 100% INFLATION',lines:['target: real return r = 5%','shortcut  i = 0.05 + 1.00           = 105%','exact     1 + i = 1.05 x 2.00 = 2.10','          i                         = 110%','the gap is the cross-term 0.05 x 1.00']}]}
   ],
   q:[mc("In which case is the nominal interest rate negative?",["real rate 1%, expected inflation -2%","real rate 2%, expected inflation 1%","real rate 0%, expected inflation 2%","real rate -2%, expected inflation 3%"],"i = r + expected inflation = 1 - 2 = -1%. The others give 3%, 2% and 1%."),
      nm("The real interest rate is 2% and expected inflation is 3.5%. By the Fisher equation, what is the nominal interest rate, in percent?",5.5,"i = r + expected inflation = 2 + 3.5 = 5.5%",'%')],
   sa:[sa("State the Fisher equation.","Nominal rate equals real rate plus expected inflation.",[['nominal','i r'],['real','i r'],['inflation','expected price']]),
       sa("What happens to nominal interest rates when expected inflation rises?","They rise by about the same amount.",[['rise','increas','higher','go up','goes up','move up',' up ','climb']],1)],
   line:"nominal rate equals real rate plus expected inflation"},

  {h:'Before and after the fact',
   beats:[
    ["Until inflation-indexed bonds came along, nobody could look the real interest rate up. It had to be estimated. The easy way, then and now, is to turn Fisher around.","*r = i - expected inflation*"],
    ["The nominal rate is known. Expected inflation has to come from forecasts. Twice a year the Federal Reserve Bank of Philadelphia publishes professional forecasts. Once a month the University of Michigan's Survey Research Center works out what consumers expect."],
    ["Forecasts are often wrong, so there are two real rates.","The *ex ante real interest rate* is 'before the fact': the nominal rate minus EXPECTED inflation. People make decisions with it.","The *ex post real interest rate* is 'after the fact': the nominal rate minus ACTUAL inflation. It is what was really paid or received."],
    {fig:'compare',a:[{left:{h:'EX ANTE',lines:['before the fact','i - EXPECTED inflation','what decisions use','has to be estimated']},right:{h:'EX POST',lines:['after the fact','i - ACTUAL inflation','what was really earned','can always be computed']},note:'we want ex ante · we can only be sure of ex post'}]},
    ["The ex post rate can always be computed, because we know the nominal rate and the inflation there actually was. But the one that drives decisions, and the one we really want to know, is the ex ante rate."],
    {fig:'steps',a:[{title:'A LOAN AT 7%: EXPECTED 3% INFLATION, GOT 2%',lines:['ex ante real rate = 7 - 3 = 4%','   what both sides signed up for','ex post real rate = 7 - 2 = 5%','   what the lender actually earned','lender: GAIN of 1 point','borrower: paid 1 point more in real terms']}]},
    ["Who wins when the forecast misses? If inflation comes in lower than expected, the ex post real rate is higher than planned. The lender gains and the borrower loses. If inflation comes in higher than expected, it is the borrower who smiles."]
   ],
   q:[mc("A loan is agreed at 7% with inflation expected to be 3%. Inflation turns out to be 2%. Who gains?",["the lender: the real return is 5%, not the expected 4%","the borrower: the real cost is 4%, not 5%","neither: the nominal rate was fixed in advance","both: lower inflation helps everyone equally"],"Ex post real rate = 7 - 2 = 5%, above the 4% both sides expected."),
      mc("Scenario 1: nominal rate 6%, expected inflation 4%. Scenario 2: nominal rate 5%, expected inflation 2%. A lender prefers:",["scenario 2: the real rate is 3% rather than 2%","scenario 1: 6% is more than 5%","scenario 1: higher inflation raises the return","either: the real rates are equal"],"Real rates are 6 - 4 = 2% and 5 - 2 = 3%. Lenders want the higher real rate, borrowers the lower.")],
   sa:[sa("How do ex ante and ex post real interest rates differ?","Ex ante uses expected inflation; ex post uses actual inflation.",[['expect','forecast','anticipat','before','predict'],['actual','realiz','realis','after','occurred','happened','turned out']]),
       sa("Who gains if inflation turns out lower than expected?","The lender: the real return is higher than expected.",[['lender','saver','creditor','bank','bondholder','investor']],1)],
   line:"ex ante uses expected inflation and ex post uses actual inflation"}
 ]},

 {id:'rates-in-the-world',title:'RATES IN THE REAL WORLD',secs:[
  {h:'High rates, low rates',
   beats:[
    ["Once you know the nominal rate rides on expected inflation, the world's interest rates stop looking random.","In 2016 the Swiss interest rate was below zero. The Egyptian rate was above 10 percent. Same planet, same year."],
    {fig:'compare',a:[{left:{h:'SWITZERLAND, 2016',lines:['prices FALLING by more','than 1% a year','interest rate below 0']},right:{h:'EGYPT, 2016',lines:['prices RISING about','10% a year','interest rate above 10%']},note:'inflation gap 11 points · nominal rate gap 12 points'}]},
    ["Look at inflation. Swiss prices were falling by more than 1 percent a year. Egyptian prices were rising about 10 percent a year. That 11-point gap in inflation accounts for most of the 12-point gap in nominal interest rates."],
    ["The book plots inflation against the nominal rate for more than 50 countries and the euro area in early 2016. Higher inflation goes with higher nominal rates. And more than half the points sit below the 45-degree line, the line where the nominal rate equals inflation."],
    {fig:'plot',a:[{title:'THE 45-DEGREE LINE',xl:'inflation rate %',yl:'nominal %',xr:[-2,16],yr:[-2,16],curves:[{f:x=>x,ch:'/',name:'nominal rate = inflation: real rate is 0'}],cap:'above the line: real rate > 0 · below it: real rate < 0'}]},
    ["Below that line the real interest rate is negative. On average the ex post real rate across those countries was slightly negative: a mark of the weak global economy after the crisis of 2007-2009 and the euro-area crisis.","One more reading. For most countries the distance from the 45-degree line varies less than the distance from the horizontal axis. In plain words: real rates differ across countries far less than nominal rates do."]
   ],

      mc("On a chart of the nominal rate (vertical) against inflation (horizontal), a country below the 45-degree line has:",["a negative real interest rate","a negative nominal interest rate","falling prices","a real rate equal to its nominal rate"],"Below the line, inflation exceeds the nominal rate, so nominal minus inflation is negative.")],

  {h:'Your risk-free rate',
   beats:[
    ["Last one, and it will save you money. You get an unexpected bonus. A financially savvy friend says: put it in a balanced fund of stocks and bonds. But you also have a 30-year mortgage at 5 percent.","Invest, or pay down the mortgage?"],
    ["Unless you are the gambling type: pay down the debt.","Every dollar of mortgage you repay saves you 5 percent a year, for certain. So the opportunity cost of investing the bonus is your mortgage rate. Investing it is the same as taking out a loan at 5 percent to buy stocks and bonds."],
    {fig:'compare',a:[{left:{h:'PAY DOWN THE MORTGAGE',lines:['saves 5% a year','certain: no risk','your risk-free rate']},right:{h:'INVEST THE BONUS',lines:['return uncertain','same as borrowing at 5%','to buy stocks and bonds']},note:'to win, investing must beat 5% with no risk. Rare.'}]},

    {fig:'steps',a:[{title:'A $10,000 WINDFALL, DEBT AT 6%',lines:['pay down the debt:','   interest saved = $10,000 x 0.06 = $600 a year','   certain, no risk','invest instead:','   must earn more than 6%, risk-free, to win','   no such investment is likely to exist','verdict: pay down the debt']}]},
    ["The general rule: with spare cash, pay down your loans before you start investing. Credit card, auto loan, student loan, mortgage. No riskless investment is likely to match the rate you get by shrinking a debt.","That is opportunity cost again, which is where this chapter began. End of chapter 4."]

 cheat:[
  "*FUTURE VALUE*",
  "  FV = PV x (1 + i)^n        i as a decimal · i and n in the same time units",
  "  $100 at 5%: 1 yr $105 · 2 yrs $110.25 · 10 yrs $162.89 (not $150)",
  "  rule of 72: years to double = 72 / rate in percent    (5%: 14.4 years)",
  "  monthly to annual: (1 + im)^12 - 1       0.5% a month = 6.17% a year",
  "  average annual rate: (end / start)^(1/n) - 1    20% in 5 yrs = 3.71%",
  "  1 basis point = 0.01%",
  "*PRESENT VALUE*",
  "  PV = FV / (1 + i)^n",
  "  higher when: payment bigger · wait shorter · interest rate lower",
  "  a rate rise cuts distant payments the most",
  "  $100 at 5%: worth $50 if due in 14.4 years, $25 if due in 28.8",
  "*STREAMS OF PAYMENTS*",
  "  value of a stream = sum of the present values of each payment",
  "  internal rate of return (IRR): the i where PV of payments = cost",
  "  invest if IRR > cost of borrowing      (racket machine: 8.14%)",
  "  n equal payments: PV = (C / i) x [1 - 1/(1 + i)^n] · for ever: PV = C / i",
  "*BONDS*",
  "  coupon payment = coupon rate x face value",
  "  price = C/(1+i) + C/(1+i)^2 + ... + C/(1+i)^n + F/(1+i)^n",
  "  rate up, price down · bigger coupon, higher price",
  "  principal = face value = par value · long bonds: more interest rate risk",
  "*REAL AND NOMINAL*",
  "  Fisher: i = r + expected inflation       r = i - expected inflation",
  "  exact: (1 + i) = (1 + r) x (1 + expected inflation)",
  "  ex ante: minus EXPECTED inflation · ex post: minus ACTUAL inflation",
  "  real rates can be negative · 'the interest rate' means the nominal rate",
  "*EXAM TRAPS*",
  "  never multiply the rate by the years: that ignores compounding",
  "  monthly rate from annual: (1 + i)^(1/12) - 1, never i / 12",
  "  5 percent goes into a formula as 0.05",
  "  discount each payment separately, never the total",
  "  inflation below forecast: lender gains, borrower loses",
  "  spare cash: pay down debt first. Your loan rate is your risk-free rate"
 ],

 calc:[
  // future value
  ()=>{const pv=rint(100,5000,100),i=rint(2,12),n=rint(2,20),d=Math.pow(1+i/100,n),a=pv*d;
   return{q:`You deposit ${fmt(pv)} at ${i}% interest a year. What is its future value after ${n} years? (to the cent)`,a:+a.toFixed(2),u:'$',
    steps:['FV = PV x (1 + i)^n',`   = ${fmt(pv)} x (1 + ${(i/100).toFixed(2)})^${n}`,`   = ${fmt(pv)} x ${d.toFixed(4)}`,`(rate x years would give only ${fmt2(pv*(1+i*n/100))})`,`FV = ${fmt2(a)}`]}},
  // present value
  ()=>{const fv=rint(100,5000,100),i=rint(2,12),n=rint(1,30),d=Math.pow(1+i/100,n),a=fv/d;
   return{q:`What is the present value of ${fmt(fv)} to be received in ${n} year${n>1?'s':''}, if the interest rate is ${i}%? (to the cent)`,a:+a.toFixed(2),u:'$',
    steps:['PV = FV / (1 + i)^n',`   = ${fmt(fv)} / (1 + ${(i/100).toFixed(2)})^${n}`,`   = ${fmt(fv)} / ${d.toFixed(4)}`,`PV = ${fmt2(a)}`]}},
  // rule of 72, with repeated doublings
  ()=>{const i=pick([2,3,4,5,6,8,9,10,12]),k=pick([1,1,2,3]),s=100*rint(1,9),e=s*Math.pow(2,k),y=+(72/i).toFixed(1),a=+(y*k).toFixed(1);
   return{q:k===1?`At ${i}% a year, about how many years does an investment take to double? (rule of 72)`:`At ${i}% a year, about how many years does ${fmt(s)} take to grow to ${fmt(e)}? (rule of 72)`,a,u:'',
    steps:['years to double = 72 / interest rate in percent',`   = 72 / ${i} = ${y} years`,...(k>1?[`${fmt(e)} / ${fmt(s)} = ${Math.pow(2,k)}, which is ${k} doublings`]:[]),`answer = ${k>1?k+' x '+y+' = ':''}${a} years`]}},
  // monthly rate to compound annual rate
  ()=>{const m=pick([0.25,0.5,0.75,1,1.5,2]),f=Math.pow(1+m/100,12),a=(f-1)*100;
   return{q:`An investment grows ${m}% a month. What is its compound annual rate, in percent? (two decimals)`,a:+a.toFixed(2),u:'%',
    steps:['annual rate = (1 + monthly rate)^12 - 1',`   = (1 + ${+(m/100).toFixed(4)})^12 - 1`,`   = ${f.toFixed(4)} - 1`,`(not ${m} x 12 = ${+(m*12).toFixed(2)}%: that ignores compounding)`,`annual rate = ${a.toFixed(2)}%`]}},
  // average annual rate
  ()=>{const g=rint(10,90,5),n=pick([3,4,5,6,8,10]),b=(1+g/100).toFixed(2),r=Math.pow(1+g/100,1/n),a=(r-1)*100;
   return{q:`An investment rises ${g}% in total over ${n} years. What is its average annual rate of growth, in percent? (two decimals)`,a:+a.toFixed(2),u:'%',
    steps:['(1 + i)^n = end value / start value',`(1 + i)^${n} = ${b}`,`1 + i = ${b}^(1/${n}) = ${r.toFixed(4)}`,`(not ${g} / ${n} = ${+(g/n).toFixed(2)}%: that ignores compounding)`,`i = ${a.toFixed(2)}% a year`]}},
  // coupon bond price
  ()=>{const F=pick([100,1000]),c=rint(2,9),n=rint(2,4),i=rint(1,10),r=i/100,C=F*c/100,b=(1+r).toFixed(2),L=[];let P=0;
   for(let k=1;k<=n;k++){const v=C/Math.pow(1+r,k);P+=v;L.push(`year ${k}: ${fmt(C)} / ${b}${k>1?'^'+k:''} = ${fmt2(v)}`)}
   const pp=F/Math.pow(1+r,n);P+=pp;
   return{q:`A ${n}-year coupon bond has a face value of ${fmt(F)} and a ${c}% coupon rate, paid once a year. The interest rate is ${i}%. What is its price? (to the cent)`,a:+P.toFixed(2),u:'$',
    steps:['P = C/(1+i) + ... + C/(1+i)^n + F/(1+i)^n',`C = ${c}% x ${fmt(F)} = ${fmt(C)} a year`,...L,`principal: ${fmt(F)} / ${b}^${n} = ${fmt2(pp)}`,`price = ${fmt2(P)}${i<c?' (above face value)':i>c?' (below face value)':' (equal to face value)'}`]}},
  // fixed-payment loan
  ()=>{const L=pick([10000,20000,50000,100000,250000,1000000]),i=rint(3,10),n=pick([3,5,10,15,30]),r=i/100,f=(1-Math.pow(1+r,-n))/r,a=L/f;
   return{q:`You borrow ${fmt(L)} at ${i}% and repay it in ${n} equal yearly payments. How much is each payment? (to the dollar)`,a:Math.round(a),u:'$',
    steps:['PV = (C / i) x [1 - 1/(1 + i)^n]',`${fmt(L)} = (C / ${r.toFixed(2)}) x [1 - 1/${(1+r).toFixed(2)}^${n}]`,`${fmt(L)} = ${f.toFixed(3)} x C`,`C = ${fmt(L)} / ${f.toFixed(3)}`,`C = ${fmt(a)} a year`]}},
  // Fisher equation: real, nominal, ex post
  ()=>{const t=rint(0,2),p=rint(2,9),r=t===1?rint(1,5):rint(-2,5),i=r+p;
   if(t===0)return{q:`The nominal interest rate is ${i}% and expected inflation is ${p}%. What is the real interest rate, in percent?`,a:r,u:'%',
    steps:['r = i - expected inflation',`  = ${i} - ${p}`,`r = ${r}%${r<0?'  (negative: buying power shrinks)':''}`]};
   if(t===1)return{q:`A lender wants a real return of ${r}% and expects inflation of ${p}%. By the Fisher equation, what nominal interest rate does the lender ask for, in percent?`,a:i,u:'%',
    steps:['i = r + expected inflation',`  = ${r} + ${p}`,`i = ${i}%`]};
   const x=Math.max(0,p+pick([-3,-2,-1,1,2,3])),a=i-x;
   return{q:`A loan is made at ${i}% when inflation is expected to be ${p}%. Inflation turns out to be ${x}%. What is the ex post real interest rate, in percent?`,a,u:'%',
    steps:['ex post r = i - actual inflation',`ex ante r = ${i} - ${p} = ${r}%  (what was expected)`,x<p?'inflation below forecast: the lender gains':'inflation above forecast: the borrower gains',`ex post r = ${i} - ${x} = ${a}%`]}}
 ],

 lab:[
  {cmd:'fv',usage:'fv [deposit$] [rate%] [years]',eg:'fv 1000 4 40',run:a=>{const p=Math.max(1,Math.min(1e5,arg(a,0,100))),i=Math.max(0,Math.min(20,arg(a,1,5))),n=Math.round(Math.max(1,Math.min(30,arg(a,2,10))));
