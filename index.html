  ["Second, the letter of credit: my guarantee that a customer will make a promised payment. A U.S. importer of televisions must reassure a Chinese exporter. I send a commercial letter of credit. My guarantee takes the place of the importer's credit risk, and I collect a fee.","A standby letter of credit is a form of insurance: if a firm that issued commercial paper defaults, I repay the lender. States and cities usually need one to issue debt as well."],
  {fig:'chain',a:[{title:'COMMERCIAL LETTER OF CREDIT',nodes:['U.S. IMPORTER','BANK','CHINESE EXPORTER'],caps:['the importer pays the bank a fee','the bank guarantees the payment','the exporter ships: it trusts the bank'],end:"the bank's guarantee replaces the importer's risk",token:'($)'}]},
  ["The danger is that outsiders cannot see these risks. Long-Term Capital Management had assets of over $100 billion on its balance sheet. What scared everyone was off it: $1.25 trillion of interest rate swaps.","In 2007-2009 it happened again. Hidden off-balance-sheet risks at some of the largest banks added to doubts about whether they were solvent."]],
  q:[mc("A bank grants a firm a $5 million line of credit. When does it show up on the bank's balance sheet?",["Only when the firm actually draws on the line","As soon as the agreement is signed","When the firm pays the fee","Never, even after the line is drawn"],"A commitment is off the balance sheet. A drawn loan is an asset."),
     mc("By issuing a commercial letter of credit for an importer, a bank:",["substitutes its own guarantee for the importer's credit risk","lends the importer the purchase price","buys the goods and resells them to the importer","insures the exporter against exchange rate changes"],"The exporter relies on the bank's promise. The bank earns a fee for taking the risk.")],
  sa:[sa("What are off-balance-sheet activities?","Fee-earning activities that are neither assets nor liabilities.",[['fee','commitment','guarantee','letter','line','credit','activit'],['neither','off','not appear','not on','not record','hidden','invisible','not show','not asset','nor']]),
      sa("Why do off-balance-sheet activities worry regulators?","They create risks that outsiders cannot easily see.",[['risk','loss','exposure','danger'],['see','hidden','invisible','discern','not appear','not show','apparent','visible','outsider','unseen','hard to','conceal']])],
  line:"a line of credit is invisible until the customer draws on it"},

 {h:'The cost of payday loans',beats:[
  ["A detour outside the bank. Shops with 'Checks Cashed' signs and websites promising 'Bad Credit Okay' lend to people who cannot borrow from mainstream institutions. Their most common product is the *payday loan*."],
  ["You give very little information. You walk out with cash, or receive a deposit within a day or two, and the lender debits your account when the loan falls due, usually within two weeks.","The catch is the fee: typically 15 percent of the principal. Borrow $500 and you must repay at least $575."],
  {fig:'steps',a:[{title:'ONE PAYDAY LOAN',lines:['borrow                        $500','fee = 15% x $500            =  $75','repay within two weeks      = $575','15% for only two weeks of credit','implied annual rate: can exceed 2,000%']}]},
  ["Lenders often must disclose the implied annual interest rate. It can exceed 2,000 percent."],
  ["The real damage is the renewal trap. A Consumer Financial Protection Bureau study found that more than 80 percent of payday borrowers take out another loan within two weeks, and 15 percent roll the debt over in a series of 10 loans or more.","Every renewal costs another fee. On a $500 loan, 10 renewals means $825 in fees over 22 weeks, and the borrower still owes the original $500."],
  {fig:'table',a:[{title:'ROLLING OVER A $500 PAYDAY LOAN',head:['LOAN','WEEK','FEES PAID','STILL OWED'],rows:[['original',2,'$75','$500'],['renewal 1',4,'$150','$500'],['renewal 2',6,'$225','$500'],['renewal 5',12,'$450','$500'],['renewal 8',18,'$675','$500'],['renewal 10',22,'$825','$500']],note:'11 fees of $75 and the debt has not moved'}]},
  ["They are not all bad. A short-term loan from a legitimate lender helps some people. The harm comes from the cycle of costly renewals.","So governments regulate. The federal Military Lending Act caps rates and rollovers on loans to service families. States restrict the number of loans, renewals and annual rates."]],
  q:[nm("A payday lender charges 15% of principal for each two-week loan. You borrow $400 and renew the loan 3 times. What do you pay in fees in total, in dollars?",240,"4 loans (the original + 3 renewals) x 15% x $400 = 4 x $60 = $240",'$'),
     mc("According to the CFPB study, what is the main problem with payday loans?",["Many borrowers are trapped in a cycle of new fees for repeated renewals","Lenders demand too much collateral","Borrowers wait weeks to receive the money","Lenders ask for too much information"],"Over 80% borrow again within two weeks; 15% roll over 10 times or more.")],
  sa:[sa("What is the main danger of payday loans?","Repeated renewals trap borrowers in a cycle of fees.",[['renew','roll','repeat','again','cycle','trap','another loan'],['fee','cost','debt','interest','expens','charge']]),
      sa("What is the typical fee on a payday loan?","About 15 percent of the principal, every two weeks.",[['15','fifteen'],['percent','principal','loan','two week','2 week','borrow']])],
  line:"payday loans trap borrowers in a cycle of renewal fees"},

 {h:'Shadow banking in China',beats:[
  ["Another case from outside the vault. China's households save more than almost anyone on earth, yet for years they had few attractive places to put the money."],
  ["Until 2015, regulation capped bank deposit rates far below the growth rate of the economy. Through large state-controlled banks, the government funnelled an outsized share of the nation's savings to favoured borrowers, typically state-owned enterprises, at low interest rates. That is *financial repression*."],
  {fig:'chain',a:[{title:'FINANCIAL REPRESSION',nodes:['SAVERS','STATE BANKS','STATE FIRMS'],caps:['deposit rates are capped far below growth','state-controlled banks collect the savings','favoured borrowers get cheap loans'],end:'savers earn little; chosen borrowers pay little'}]},
  ["Enter shadow banking. In 2008, as the world economy sank, China loosened credit to boost demand. Regulators let banks and others sell new products that looked like short-term deposits but paid far more, often above 10 percent. Households flocked to them.","Seen kindly, it was financial liberalization through the back door."],
  {fig:'events',a:[{title:'CHINA: FROM REPRESSION TO SHADOW BANKS',fps:3,events:[['pre-2008','deposit rates capped below growth'],['2008','credit loosened to boost demand'],['2008 on','new products pay over 10%'],['2008 on','credit passes 250% of GDP'],['2015','deposit-rate caps end']]}]},
  ["The trouble was incentives. Neither the lenders nor the borrowers, especially state firms and local government financing vehicles, had much interest in controlling risk, and nobody was sure who would bear the losses.","Total credit soared to more than 250 percent of GDP. Much of it went through off-balance-sheet finance to real estate projects with uncertain prospects of repayment. Credit booms like that are the fuel for financial crises."],
  ["The government has the means to steady the system even as loans go bad. But bailouts wear away market discipline. If creditors never bear losses, nobody has a reason to limit risk, or even to monitor it.","The challenge is to keep the benefits of shadow banking, contain the risks, and let markets set prices and allocate resources."]],
  q:[mc("Capping deposit rates far below the growth rate so that savings flow cheaply to favoured borrowers is called:",["financial repression","financial liberalization","shadow banking","liability management"],"The state holds down what savers earn and directs where the funds go."),
     mc("Why did China's shadow banking boom raise fears of financial instability?",["Credit grew very fast while nobody had much incentive to control risk","Shadow products paid less than bank deposits","Households stopped saving","Banks held too much capital against the new products"],"Credit passed 250% of GDP, and it was unclear who would bear the losses.")],
  sa:[sa("What is financial repression?","Government caps deposit rates and steers savings to favoured borrowers.",[['cap','low','below','limit','held down','ceiling','control','suppress'],['rate','interest','saving','deposit','borrower','state']]),
      sa("Why do repeated government bailouts weaken a financial system?","Without losses, creditors have no incentive to monitor risk.",[['incentive','disciplin','reason','moral hazard','monitor','care','careless'],['risk','loss','monitor','lend','creditor']])],
  line:"bailouts remove the market discipline that limits risk taking"}
]},

/* ---------------------------------------------------------------- 6 */
{id:'liquidity-risk',title:'LIQUIDITY RISK',secs:[
 {h:'Sudden demands for cash',beats:[
  ["Now the risks. Banking is risky because I am highly leveraged and because of what I do. Four headline risks: liquidity, credit, interest rate and trading. First, *liquidity risk*: the risk of a sudden demand for liquid funds."],
  ["It comes from both sides of my balance sheet. Liability side: depositors withdraw. Asset side: a customer takes down a line of credit and I must find the money for the loan I promised.","If I cannot pay on demand I can fail, even with positive net worth. Who keeps money in a bank that cannot hand over cash? Wachovia faced exactly such a run in September 2008."],
  {fig:'crowd',a:[{title:'A BANK RUN: o = calm depositor, # = withdrawing',n:40,per:20,off:'o',on:'#',stages:[{frac:.1,cap:'a normal day: a few withdrawals'},{frac:.3,cap:'doubt: can the bank pay on demand?'},{frac:.7,cap:'nobody wants to be last in the line'},{frac:1,cap:'a RUN: even a solvent bank can fail'}]}]},
  ["Take the book's bank, in millions of dollars. Reserves 15, loans 100, securities 35. Deposits 100, borrowed funds 30, capital 20.","*Required reserves = required reserve ratio x deposits*","*Excess reserves = reserves - required reserves*","With a 10 percent requirement I must hold 10. I hold 15, so I have 5 of *excess reserves*."],
  {fig:'taccount',a:[{title:'A $5 MILLION WITHDRAWAL ($ millions)',frames:[
    {cap:'reserves 15, required 10: excess reserves 5',A:[['Reserves',15],['Loans',100],['Securities',35]],L:[['Deposits',100],['Borrowings',30],['Bank capital',20]]},
    {cap:'customer withdraws $5: paid from excess reserves',A:[['Reserves',10],['Loans',100],['Securities',35]],L:[['Deposits',95],['Borrowings',30],['Bank capital',20]]}]}]},
  ["A corporate customer withdraws 5. I pay it straight out of excess reserves, without difficulty. A loan commitment of 5, suddenly taken down, would be met the same way.","Holding spare reserves is the passive way to manage liquidity risk, and it used to be the common way. The problem is that it is expensive. Every dollar in excess reserves is a dollar not earning the higher interest paid on loans or securities. So I look for other ways. There are two: adjust my assets, or adjust my liabilities."]],
  q:[nm("A bank has deposits of $250 million and reserves of $32 million. Required reserves are 10% of deposits. What are its excess reserves, in $ millions?",7,"Required = 0.10 x 250 = 25. Excess = 32 - 25 = 7.",'$'),
     mc("How can off-balance-sheet lines of credit create liquidity risk for a bank?",["When a customer takes down the line, the bank must find the funds at once","They lower the bank's required reserves","They convert deposits into borrowings","They cannot: only deposit withdrawals create liquidity risk"],"That is liquidity risk on the asset side.")],
  sa:[sa("What is liquidity risk?","The risk of a sudden demand for liquid funds.",[['sudden','unexpected','immediate','at once','run','demand','quick'],['withdraw','cash','liquid','fund','deposit','takedown','credit line']]),
      sa("Why is holding excess reserves a costly way to manage liquidity risk?","Reserves earn less interest than loans or securities would.",[['less','lower','forgo','give up','lose','opportunity','miss','little','idle','sacrific'],['interest','return','earn','profit','yield','income']]),
      sa("How can a bank with positive net worth still fail?","It cannot meet customers' demands for cash: illiquidity.",[['cash','liquid','withdraw','fund','pay'],['cannot','can t','unable','run out','runs out','out of cash','illiquid','lack','short','not enough','fail to']])],
  line:"excess reserves equal reserves minus required reserves"},

 {h:'Fix one: asset management',beats:[
  ["Now a leaner bank. Reserves 10, loans 100, securities 40. Deposits are 100, so required reserves are 10 and excess reserves are zero. A customer withdraws 5. I cannot simply take it out of reserves. Something else on the balance sheet has to move."],
  ["Option one, on the asset side: sell securities. Some of them are U.S. Treasuries, which sell quickly at low cost. A bank that worries about liquidity arranges its securities holdings with exactly this in mind."],
  {fig:'taccount',a:[{title:'MEET IT BY SELLING SECURITIES ($ millions)',frames:[
    {cap:'no excess reserves; a $5 withdrawal arrives',A:[['Reserves',10],['Loans',100],['Securities',40]],L:[['Deposits',100],['Borrowings',30],['Bank capital',20]]},
    {cap:'sell $5 of securities for cash',A:[['Reserves',15],['Loans',100],['Securities',35]],L:[['Deposits',100],['Borrowings',30],['Bank capital',20]]},
    {cap:'pay the depositor: the bank is $5 smaller',A:[['Reserves',10],['Loans',100],['Securities',35]],L:[['Deposits',95],['Borrowings',30],['Bank capital',20]]}]}]},
  ["Option two: reduce loans. I can sell some loans to another bank; I keep a portion of my loans marketable for that purpose. Or I can refuse to renew a short-term loan that has come due.","Refusing to renew is unappealing. It alienates a creditworthy customer I went to trouble and expense to find, and may drive that customer to another bank."],
  {fig:'taccount',a:[{title:'MEET IT BY REDUCING LOANS ($ millions)',frames:[
    {cap:'no excess reserves; a $5 withdrawal arrives',A:[['Reserves',10],['Loans',100],['Securities',40]],L:[['Deposits',100],['Borrowings',30],['Bank capital',20]]},
    {cap:'sell or call in $5 of loans, pay the depositor',A:[['Reserves',10],['Loans',95],['Securities',40]],L:[['Deposits',95],['Borrowings',30],['Bank capital',20]]}]}]},
  ["Look at the totals either way: 150 before, 145 after. Asset management shrinks the bank. I earn my profit by turning liabilities into assets, so a smaller balance sheet means a smaller profit. Bankers do not like that.","Fine print for the careful: the withdrawal lowers deposits to 95, so required reserves fall by 0.5. Paying it from reserves would still leave me 4.5 short."]],
  q:[mc("A bank with no excess reserves meets a $5 million withdrawal by selling securities. Afterwards:",["total assets and total liabilities are both $5 million lower","total assets are unchanged; only their mix has changed","liabilities are unchanged because borrowing rose","bank capital is $5 million lower"],"Securities down 5 on the left, deposits down 5 on the right. The bank shrinks."),
     nm("A bank has deposits of $100 million, reserves of $10 million and a 10% reserve requirement. A depositor withdraws $5 million, paid from reserves. By how many $ millions do reserves now fall short of the requirement?",4.5,"Reserves left = 5. Required = 0.10 x 95 = 9.5. Shortfall = 9.5 - 5 = 4.5.",'$')],
  sa:[sa("Why do bankers dislike meeting withdrawals by selling assets?","It shrinks the balance sheet, which lowers profits.",[['shrink','smaller','contract','reduc','less','fewer','size','lower'],['profit','balance sheet','bank','asset','earn','income']]),
      sa("Why is refusing to renew a loan a poor way to raise liquidity?","It alienates good customers the bank paid to find.",[['customer','borrower','client','relationship'],['alienat','lose','drive','upset','anger','rival','another bank','leave','damage','hurt','annoy']])],
  line:"selling assets to meet withdrawals shrinks the bank"},

 {h:'Fix two: liability management',beats:[
  ["Today's bankers prefer the other route: *liability management*. Do not sell assets. Find other sources of funds to replace the deposits that left."],
  ["Way one: borrow, from the Federal Reserve or from another bank. Deposits fall by 5 and borrowed funds rise by 5. The asset side ends up exactly where it began."],
  {fig:'taccount',a:[{title:'MEET IT BY BORROWING ($ millions)',frames:[
    {cap:'no excess reserves',A:[['Reserves',10],['Loans',100],['Securities',40]],L:[['Deposits',100],['Borrowings',30],['Bank capital',20]]},
    {cap:'a depositor takes $5: reserves are too low',A:[['Reserves',5],['Loans',100],['Securities',40]],L:[['Deposits',95],['Borrowings',30],['Bank capital',20]]},
    {cap:'borrow $5 from the Fed or another bank',A:[['Reserves',10],['Loans',100],['Securities',40]],L:[['Deposits',95],['Borrowings',35],['Bank capital',20]]}]}]},
  ["Way two: attract new deposits. The usual tool is the large certificate of deposit, over $100,000, which amounts to borrowing in the wholesale money market. Deposits fall by 5, then come back to 100. (The book lumps the CDs in with checking accounts; I show them on their own line.)"],
  {fig:'taccount',a:[{title:'MEET IT WITH LARGE CDs ($ millions)',frames:[
    {cap:'no excess reserves',A:[['Reserves',10],['Loans',100],['Securities',40]],L:[['Checking etc.',100],['Large CDs',0],['Borrowings',30],['Bank capital',20]]},
    {cap:'a depositor takes $5: reserves are too low',A:[['Reserves',5],['Loans',100],['Securities',40]],L:[['Checking etc.',95],['Large CDs',0],['Borrowings',30],['Bank capital',20]]},
    {cap:'issue $5 of large CDs: deposits back at 100',A:[['Reserves',10],['Loans',100],['Securities',40]],L:[['Checking etc.',95],['Large CDs',5],['Borrowings',30],['Bank capital',20]]}]}]},
  ["Now you know why large CDs became such an important source of funds. They let me manage liquidity risk without changing the asset side. The bank keeps its size, and its earning power.","A footnote worth a mark: unlike checking accounts, CDs are not subject to a reserve requirement."],
  {fig:'compare',a:[{left:{h:'ASSET MANAGEMENT',lines:['sell securities','sell or call in loans','the bank SHRINKS','so profit falls']},right:{h:'LIABILITY MANAGEMENT',lines:['borrow: Fed, other banks','issue large CDs','the bank keeps its SIZE','preferred today']}}]},
  ["It is not foolproof. In 2007-2009 the usual mechanisms failed together. Banks could not sell their illiquid assets, and could not obtain funding at a reasonable cost to keep holding them. Market liquidity and funding liquidity vanished at the same moment, and the whole system was threatened."]],
  q:[mc("Why do today's bankers prefer liability management to asset management when deposits flow out?",["It meets the outflow without shrinking the balance sheet or its profits","Borrowed funds never have to be repaid","It raises the bank's capital","Regulators prohibit banks from selling securities"],"Replace the lost funds and keep the assets earning."),
     mc("A bank replaces a $5 million deposit outflow by borrowing from another bank. Compared with before the outflow:",["total assets are unchanged; deposits are down 5 and borrowings are up 5","total assets and total liabilities are both 5 lower","reserves are 5 lower and loans are unchanged","bank capital is 5 lower"],"Only the mix of liabilities changes.")],
  sa:[sa("What is liability management?","Replacing lost deposits with new borrowing or new deposits.",[['borrow','new deposit','cds','certificate','attract','other source','new fund','rais','issue'],['deposit','withdraw','outflow','instead','liquid','replac','not sell','without sell','asset','fund']]),
      sa("Why are large CDs an important source of bank funds?","They cover deposit outflows without changing the asset side.",[['liquid','outflow','withdraw','fund','deposit','borrow','wholesale','resold','negotiable'],['without','asset','size','shrink','sell','quick','market','need']])],
  line:"liability management replaces lost deposits without shrinking the bank"}
]},

/* ---------------------------------------------------------------- 7 */
{id:'credit-and-rate-risk',title:'CREDIT AND INTEREST RATE RISK',secs:[
 {h:'Credit risk',beats:[
  ["My profit is the difference between the rate borrowers pay me and the rate I pay depositors. That only works if the borrowers repay. *Credit risk* is the risk that my loans will not be repaid."],
  {fig:'taccount',a:[{title:'DEFAULTS LAND ON CAPITAL (illustrative, $m)',frames:[
    {cap:'before: capital is $20',A:[['Reserves',15],['Loans',100],['Securities',35]],L:[['Deposits',100],['Borrowings',30],['Bank capital',20]]},
    {cap:'$8 of loans default: capital falls to $12',A:[['Reserves',15],['Loans',92],['Securities',35]],L:[['Deposits',100],['Borrowings',30],['Bank capital',12]]}]}]},
  ["Tool one: diversification. Make a variety of loans so that no single default can sink me. It is harder than it sounds. Banks are specialists in information, so it is tempting to stick to one industry or one region. Then one local or industry-wide downturn hits every loan at once."],
  {fig:'diversify',a:[40,10]},
  ["Tool two: credit risk analysis. Rating agencies grade large corporations. I do the same for small firms, and specialised firms track the credit histories of individuals. Statistical models plus information about the applicant give an estimate of the chance of default.","Then I price it. To the rate I pay on my liabilities I add a markup. The poorer the borrower's credit rating, the higher the interest rate."],
  {fig:'steps',a:[{title:'PRICING A LOAN (illustrative rates)',lines:['rate paid on liabilities              3%','+ markup, strong borrower   +2%  → 5%','+ markup, weak borrower     +6%  → 9%','worse credit rating → higher interest rate']}]},
  ["I can also buy a credit default swap, a derivative that insures me against a borrower's default, and I monitor borrowers to hold down moral hazard.","It still goes wrong. In 2007-2009 many banks badly underestimated the risk of mortgage and household lending. They had not expected the first nationwide fall in house prices since the Great Depression, or double-digit unemployment, so they overestimated the value of the collateral.","Credit risk moves with the economy. For credit cards, each one-point rise in the unemployment rate lifts default rates by nearly a full point. Peer-to-peer lenders, who try to cut out the bank, have yet to prove their screening through a recession."]],
  q:[mc("A bank lends only to oil drillers in a single state. Its main weakness is:",["poor diversification: one industry or local downturn hits all its loans together","interest rate risk, because its deposits are long term","too little information about its borrowers","holding too much capital"],"Specialising gives an information edge but concentrates credit risk."),
     mc("How does a loan officer use a borrower's credit rating?",["To set the markup over the bank's cost of funds: worse rating, higher rate","To decide how many reserves to hold against the loan","To choose the maturity of the bank's deposits","To calculate the bank's leverage ratio"],"Risk requires compensation.")],
  sa:[sa("What is credit risk?","The risk that borrowers will not repay their loans.",[['repay','repaid','default','pay back','paid back','not pay','fail to pay'],['loan','borrower','debt','credit']]),
      sa("How do banks manage credit risk?","Diversify loans and analyse borrowers' creditworthiness before pricing.",[['diversif','spread','variety','many different'],['analy','screen','credit','rating','model','monitor','swap','cds','history']])],
  line:"credit risk is the risk that loans will not be repaid"},

 {h:'Interest rate risk: the mismatch',beats:[
  ["My two sides do not match. My liabilities tend to be short term: deposits. My assets tend to be long term: loans. That mismatch of maturities creates *interest rate risk*."],
  ["Think of both sides as bonds. When interest rates rise, bond prices fall, and the longer the term, the bigger the fall. My assets are the long bonds. So when rates rise, the value of my assets falls by more than the value of my liabilities, and the difference comes out of my capital."],
  {fig:'morph',a:[{title:'RATES RISE: WHICH SIDE LOSES MORE? (illustrative)',rows:[['interest rate',5,6,'%'],['long assets',100,93,v=>'$'+Math.round(v)],['short liabs',80,79,v=>'$'+Math.round(v)],['capital',20,14,v=>'$'+Math.round(v)]],max:100,capA:'before: capital = 100 - 80 = 20',capB:'long assets fall furthest, so capital shrinks'}]},
  ["Now look at income instead of value. A long-term loan pays me the same amount whatever rates do. My short-term, variable-rate liabilities cost more as soon as rates rise. Revenue stays put, expenses climb, profit is squeezed."],
  ["The key phrase is interest rate sensitive: a change in interest rates changes the revenue from the asset, or the cost of the liability. Short-term bonds that keep maturing and being replaced are sensitive. A 5 percent, 10-year bond pays $5 per $100 of face value for 10 years, whatever happens. It is not."],
  {fig:'compare',a:[{left:{h:'RATE SENSITIVE',lines:['short-term bonds','floating-rate loans','variable-rate deposits','moves with the market']},right:{h:'NOT RATE SENSITIVE',lines:['long-term bonds','fixed-rate loans','existing CDs','payment is locked in']}}]},
  ["The general principle: when a bank's liabilities are more interest rate sensitive than its assets, a rise in interest rates cuts its profits.","A problem from the back of the chapter shows it. Issue a one-year CD at 3 percent and buy a two-year Treasury note paying 5 percent. If all rates then rise 1 point, the second year's funding costs 4 percent while the note still pays 5. The margin halves, from 2 points to 1."]],
  q:[mc("Interest rates rise. For a bank that funds long-term loans with short-term deposits:",["its assets lose more value than its liabilities do, which cuts its capital","its liabilities lose more value than its assets do, which raises its capital","both sides lose the same value, leaving its capital unchanged","its assets gain value, because new loans pay more"],"Longer term means a bigger price change, and the bank's long side is its assets."),
     mc("Which of these is interest rate sensitive?",["A short-term security that keeps maturing and being replaced","A 10-year bond with a fixed 5% coupon","A 30-year fixed-rate mortgage the bank holds","An existing certificate of deposit with a fixed rate"],"Sensitive means the revenue or cost changes when market rates change.")],
  sa:[sa("Why do banks face interest rate risk?","Their liabilities are short term but their assets long term.",[['short','long','matur','mismatch','sensitiv'],['asset','liabilit','loan','deposit','mismatch','balance sheet','borrow','lend']]),
      sa("What happens to a typical bank's profits when interest rates rise?","Profits fall: funding costs rise faster than loan revenue.",[['fall','drop','declin','lower','decreas','squeez','cut','hurt','reduc','shrink','down'],['cost','expens','liabilit','deposit','pay','revenue','fixed','faster','sensitiv','profit']])],
  line:"banks borrow short and lend long so rising rates hurt them"},

 {h:'Gap analysis',beats:[
  ["Time to put numbers on it. This is the chapter's set piece. Work per $100 of assets.","Assets: $20 is interest rate sensitive and $80 is not. All of it earns 5 percent. Liabilities: $50 is sensitive and $50 is not. All of it costs 3 percent."],
  {fig:'table',a:[{title:'PER $100 OF ASSETS',head:['','ASSETS','LIABILITIES'],rows:[['rate sensitive','$20','$50'],['not rate sensitive','$80','$50'],['rate at the start','5%','3%'],['sensitive part after','6%','4%']],note:'a 1-point rise reaches only the sensitive part'}]},
  ["Before: revenue is 0.05 x $100 = $5.00 and cost is 0.03 x $100 = $3.00. Profit is $2.00. Now rates rise 1 point on everything that is interest rate sensitive."],
  {fig:'steps',a:[{title:'RATES RISE 1 POINT',lines:['revenue = 0.06 x $20 + 0.05 x $80 = $5.20','cost    = 0.04 x $50 + 0.03 x $50 = $3.50','profit  = $5.20 - $3.50           = $1.70','before it was                       $2.00','change  = -$0.30 per $100: a 15% fall']}]},
  ["Revenue rose by 20 cents. Cost rose by 50 cents. Profit fell from $2.00 to $1.70: down 30 cents, or 15 percent."],
  {fig:'morph',a:[{title:'A 1-POINT RISE, PER $100 OF ASSETS',rows:[['revenue',5,5.2,v=>'$'+v.toFixed(2)],['cost',3,3.5,v=>'$'+v.toFixed(2)],['profit',2,1.7,v=>'$'+v.toFixed(2)]],max:6,capA:'rates at 5% and 3%: profit $2.00',capB:'sensitive rates +1 point: profit $1.70'}]},
  ["The shortcut is *gap analysis*.","*Gap = rate-sensitive assets - rate-sensitive liabilities*","*Change in profit = Gap x change in the interest rate*","Here the gap is 20 - 50 = -30. Times a 1 point rise, 0.01, gives -$0.30 per $100 of assets. Same answer in one line."],
  ["Read the sign. A negative gap means more sensitive liabilities than assets: rising rates hurt and falling rates help. With a gap of -20, a 1 point fall in rates raises profit by 20 cents per $100 of assets.","A finer tool is duration analysis: percentage change in market value = -(duration) x (percentage-point change in the rate). Because rate rises hurt banks, you can infer that their assets have a longer duration than their liabilities."]],
  q:[nm("Per $100 of assets a bank has $30 of rate-sensitive assets and $70 of rate-sensitive liabilities. Interest rates rise by 1 percentage point. What is the change in profit per $100 of assets, in dollars? (Use a minus sign for a fall.)",-0.4,"Gap = 30 - 70 = -40. -40 x 0.01 = -$0.40.",'$'),
     nm("A bank faces a gap of -20. Interest rates FALL by 1 percentage point. What is the change in its profit per $100 of assets, in dollars?",0.2,"-20 x (-0.01) = +$0.20. A negative gap gains when rates fall.",'$')],
  sa:[sa("What is the gap in gap analysis?","Interest-rate-sensitive assets minus interest-rate-sensitive liabilities.",[['sensitiv'],['asset'],['liabilit']]),
      sa("What does a negative gap tell a bank manager?","Rising interest rates will reduce the bank's profits.",[['ris','increas','higher','go up','hike'],['reduc','cut','lower','hurt','fall','drop','los','declin','decreas','squeez','less','shrink'],['profit','earn','income','margin']])],
  line:"gap equals rate sensitive assets minus rate sensitive liabilities"},

 {h:'Taming interest rate risk',beats:[
  ["Once I know my gap, what do I do about it? The simplest answer is to match the interest rate sensitivity of the two sides. If I accept a variable-rate deposit, I use the funds to buy short-term securities."],
  ["Or I make my long-term loans at a floating rate. The adjustable-rate mortgage, the ARM, does that: the borrower's rate moves with the market instead of staying fixed as in a conventional mortgage.","There is a catch. Rising rates now strain the floating-rate borrowers, who become more likely to default. Less interest rate risk, more credit risk."],
  {fig:'morph',a:[{title:'FIXED-RATE LOANS → ADJUSTABLE-RATE LOANS (sketch)',rows:[['rate risk',8,3,v=>v>5.5?'high':'lower'],['credit risk',3,7,v=>v>5?'higher':'low']],max:10,capA:'fixed-rate loans: the bank carries the rate risk',capB:'ARMs: rate risk falls, credit risk rises'}]},
  ["Matching has a second cost. Restructuring assets to match liabilities reduces risk, but it also reduces potential profit. So bankers looked for another way."],
  ["They found a derivative: the interest rate swap. One party makes fixed-rate payments and receives floating-rate payments in return.","For a bank with long-term assets and short-term liabilities, that is exactly the tool. It pays fixed and receives floating. If rates rise, the floating payments it receives rise along with the cost of its deposits. The risk of rising rates has moved to someone else."],
  {fig:'swap'},
  ["For the exam: a bank with the typical maturity structure wants to PAY fixed and RECEIVE floating. Its loans already bring in fixed payments and its deposits already cost floating ones. The swap cancels the mismatch."]],
  q:[mc("A bank with long-term fixed-rate assets and short-term liabilities enters an interest rate swap. To cut its risk it should:",["pay a fixed rate and receive a floating rate","pay a floating rate and receive a fixed rate","pay and receive fixed rates","pay and receive floating rates"],"Floating receipts rise with its deposit costs; its fixed loan income funds the fixed payments."),
     mc("Replacing fixed-rate mortgages with adjustable-rate mortgages lowers a bank's interest rate risk but:",["raises its credit risk, because rising rates strain borrowers","raises its liquidity risk, because ARMs cannot be sold","raises its trading risk","removes its net interest margin"],"The rate risk passes to the borrowers, who may then default.")],
  sa:[sa("How does an interest rate swap help a typical bank?","It transfers the risk of rising rates to another party.",[['transfer','shift','pass','move','hedg','another party','someone else','offload','protect'],['risk','rate','rising','floating','fixed']]),
      sa("Why do adjustable-rate mortgages increase a bank's credit risk?","Rising rates strain borrowers, making default more likely.",[['borrower','payment','homeowner','customer'],['default','strain','cannot pay','can t pay','fail','not repay','higher payment','unable','struggle','miss']])],
  line:"a bank hedges by paying fixed and receiving floating in a swap"}
]},

/* ---------------------------------------------------------------- 8 */
{id:'trading-and-other-risks',title:'TRADING AND OTHER RISKS',secs:[
 {h:'Trading risk',beats:[
  ["There was a time when banks took deposits, made loans and held them until they were paid off. Now I also hire traders, who buy and sell securities, loans and derivatives with part of my capital, hoping to add to the owners' profit."],
  {fig:'ticker',a:[{title:'WHAT THE TRADER BOUGHT',start:100,vol:.035,drift:0,f:v=>'$'+v.toFixed(2),note:'the price can go down as well as up: trading risk'}]},
  ["An instrument bought at one price may be worth less when it is sold. That is *trading risk*, sometimes called market risk.","A footnote: U.S. banks may not hold stock, so their traders may not either. It hardly restrains them. They trade derivatives based on bonds, commodities and foreign exchange."],
  ["The deeper problem is moral hazard. Traders normally share in the profits from good bets, but the bank pays for the losses. Heads, the trader wins. Tails, the bank loses. So traders have an incentive to take more risk than the bank's managers would like."],
  {fig:'coin'},
  ["The fix is to measure the risk each trader's portfolio creates, with tools such as standard deviation and value at risk. The risk manager then limits how much risk any one trader may take and checks each trader's holdings closely, at least once a day."],
  ["Even so, large banks find it hard to monitor their traders, and the managers who are meant to do the monitoring. Multi-billion-dollar trading losses are surprisingly frequent, even at well-run banks. In 2007-2009 large banks sharply underestimated the risk of mortgage-backed securities and related derivatives, and the losses seriously depleted their capital.","The rule: the higher the risk in the bank's portfolio, the more capital it needs to stay solvent."]],
  q:[mc("Why do bank traders tend to take more risk than bank managers would like?",["They share in the gains, but the bank bears the losses","They are paid the same fixed salary whatever happens","Regulators require a minimum level of trading risk","They may trade only safe Treasury securities"],"Moral hazard: heads the trader wins, tails the bank loses."),
     mc("How does a bank's risk manager control trading risk?",["Measures each trader's risk, sets limits, and monitors holdings at least daily","Bans all trading in derivatives","Holds more required reserves at the Fed","Matches the maturities of assets and liabilities"],"Measure with tools like value at risk, limit, monitor. And hold more capital.")],
  sa:[sa("What is trading risk?","The risk that traded instruments lose value, causing losses.",[['trad','instrument','securit','market','price','derivative'],['los','fall','drop','declin','down','lower']]),
      sa("Why does trading create moral hazard?","Traders share the profits, but the bank bears losses.",[['trader','employee','they'],['bank','owner','firm','employer'],['los','profit','gain','bonus','risk']])],
  line:"traders share the gains but the bank bears the losses"},

 {h:'Operational and cyber risk',beats:[
  ["Some risks have nothing to do with loans or interest rates. *Operational risk* is the risk of loss resulting from inadequate or failed internal processes, people and systems."],
  {fig:'events',a:[{title:'WHEN OPERATIONS FAIL',fps:3,events:[['2001','9/11 destroys critical financial systems'],['2012','Hurricane Sandy floods Manhattan'],['2017','Hurricane Irma paralyses Gulf Florida'],['hack','Equifax breach: 143 million people']]}]},
  ["The 2001 attack on the World Trade Center destroyed critical financial systems and threatened to shut down banks, ATMs and card operations across the country. Hurricanes Sandy and Irma raised the same doubts about infrastructure.","The defence is a business continuity plan, often with a backup site that duplicates the equipment far from the main one."],
  ["Operational risk includes *cyber risk*: losses when information technology systems fail or are compromised. Equipment failure is handled with cloud computing and other redundant systems. Data breaches are harder. From 2005 to 2018 nearly 800 financial data breaches exposed 650 million records.","Why finance? It runs on technology, holds enormous client databases and is one big network, so attackers hunt for the weakest link. And, as the bank robber Willie Sutton supposedly said, that is where the money is."],
  ["Now the economics. Each firm pays for its own protection, but a breach spills over onto everyone else. A firm cannot reap the full benefit of its security spending, so, left alone, the private market underinvests. That creates a role for government."],
  {fig:'chain',a:[{title:'WHY FIRMS UNDERINVEST IN CYBERSECURITY',nodes:['FIRM PAYS','OTHERS GAIN','TOO LITTLE','GOVERNMENT'],caps:['one firm bears the whole cost of protection','much of the benefit spills over to others','so each firm spends less than society wants','government promotes disclosure and sharing']}]},
  ["A key job for government is to encourage disclosure. Firms conceal successful attacks, for legal and reputational reasons. Then other firms cannot learn the threats, attacks spread unnoticed, and there is too little data to price cyber insurance, so institutions are probably underinsured.","Firms now share data through groups such as FS-ISAC, and regulators run tabletop exercises that simulate an emergency. Financial firms spent an estimated $16 billion on cybersecurity in 2017. It is an arms race."]],
  q:[mc("Why will private firms, left alone, spend too little on cybersecurity?",["A breach harms others too, so a firm cannot reap the full benefit it creates","Banks are forbidden to buy cybersecurity","Attacks on financial firms are very rare","Insurance fully covers all cyber losses"],"Spillovers: the private benefit is below the benefit to society."),
     mc("Which of these is an example of operational risk?",["A flood knocks out a bank's data centre","A borrower defaults on a mortgage","Depositors suddenly withdraw their funds","Interest rates rise by 2 points"],"Operational risk comes from failed processes, people and systems.")],
  sa:[sa("What is operational risk?","Risk of loss from failed internal processes, people and systems.",[['process','people','system','internal','technolog','disaster','operat'],['fail','inadequate','loss','break','breach','error','compromis']]),
      sa("Why is there a role for government in cybersecurity?","Breaches spill over, so private firms underinvest in security.",[['spill','external','others','system','contagion','social','everyone'],['underinvest','too little','not enough','incentive','under invest','insufficient','less than']])],
  line:"cyber risk spills over so private firms underinvest in security"},

 {h:'Risks abroad, and the scorecard',beats:[
  ["Two more risks for a bank that operates across borders. *Foreign exchange risk* comes from holding assets denominated in one currency and liabilities denominated in another.","A U.S. bank with dollar liabilities buys bonds issued by Sony or lends to a Japanese business. Those assets are in yen. When the dollar-yen rate moves, the dollar value of the assets changes and the liabilities do not."],
  {fig:'morph',a:[{title:'YEN ASSET, DOLLAR LIABILITIES (illustrative)',rows:[['yen per dollar',100,125,v=>String(Math.round(v))],['yen loan in $',100,80,v=>'$'+Math.round(v)],['$ deposits',90,90,v=>'$'+Math.round(v)]],max:125,capA:'a 10,000 yen loan is worth $100',capB:'the yen weakens: asset $80, deposits still $90'}]},
  ["Two defences. Attract deposits in the same currency as the loans, so assets and liabilities match. Or hedge with foreign exchange futures and swaps. Both can bring in other risks that then need managing."],
  ["*Sovereign risk*: a foreign borrower fails to repay, not because it is unwilling, but because its government prohibits it. A country in a financial crisis may restrict dollar payments. It happened in Asia in 1997, Russia in 1998 and Argentina in 2002. The courts give the bank very little recourse.","Three ways to manage it: diversify loans and securities around the world, refuse to do business in a risky country, or hedge with derivatives."],
  ["In 2011-2012, fear that some countries would abandon the euro led banks to move assets out of the euro area's periphery, to avoid what was called redenomination risk.","Managing any of this takes information. A lesson of 2007-2009 is that many large banks could not quickly add up their exposures across business lines and borders. Governments now keep closer watch on big banks' risk reporting. Here is the whole list in one table."],
  {fig:'table',a:[{title:'THE RISKS AND THE REMEDIES',head:['RISK','SOURCE','MAIN FIXES'],rows:[['Liquidity','withdrawals','cash; borrowing'],['Credit','loan defaults','diversify; screen'],['Interest rate','maturity mismatch','match; swaps'],['Trading','trading losses','limits; VaR'],['Operational','failed systems','backup systems']]}]}],
  q:[mc("A U.S. bank funds a yen-denominated loan with dollar deposits. The yen then loses value against the dollar. The bank:",["loses: the dollar value of its asset falls but its liabilities do not","gains: its liabilities shrink in dollar terms","is unaffected, because loans are not traded","faces sovereign risk rather than foreign exchange risk"],"Assets in one currency, liabilities in another: foreign exchange risk."),
     mc("A healthy foreign firm cannot repay a U.S. bank because its government has restricted dollar payments. This is:",["sovereign risk","foreign exchange risk","liquidity risk","operational risk"],"The borrower is willing. Its government forbids the payment.")],
  sa:[sa("What is sovereign risk?","A foreign government stops borrowers repaying their loans.",[['government','sovereign','country','state'],['repay','payment','prohibit','restrict','block','prevent','stop','forbid','default','pay']]),
      sa("How do banks manage foreign exchange risk?","Match the currencies of assets and liabilities, or hedge.",[['match','same currency','hedg','futures','swap','derivative'],['currenc','deposit','asset','liabilit','futures','swap','hedg','derivative','loan']])],
  line:"sovereign risk means a foreign government blocks repayment"}
]}
],

['interest rate risk','The danger that a change in market rates hurts profit or capital because assets are long term and liabilities short term.','Rates rise 1 point and profit drops from $2.00 to $1.70.',['gap analysis']],
['gap analysis','Estimating how profit changes with rates by subtracting rate-sensitive liabilities from rate-sensitive assets.','20 - 50 = -30, so a 1-point rise costs 30 cents per $100.',['interest rate risk']],

cheat:[
"*THE BALANCE SHEET*",
"  assets = liabilities + bank capital",
"  assets = USES of funds: cash items, securities, loans",
"  liabilities = SOURCES of funds: deposits, borrowings",
"  reserves = vault cash + deposits at the Fed   (an ASSET)",
"  capital = assets - liabilities = owners' stake (LIABILITY side)",
"  Dec 2018: cash 11.5% · securities 20.6% · loans 56.3% · capital 11.3%",
"*PROFIT AND LEVERAGE*",
"  ROA = net profit after taxes / total assets",
"  ROE = net profit after taxes / bank capital = ROA x (assets / capital)",
"  leverage ratio = assets / capital = debt-to-equity + 1   (2018: about 9)",
"  net interest income = interest income - interest expense",
"  net interest margin = net interest income / total assets",
"  % fall in assets that wipes out capital = 100 / leverage ratio",
"*LIQUIDITY RISK*  sudden demand for cash (withdrawals, credit-line takedowns)",
"  required reserves = ratio x deposits · excess = reserves - required",
"  asset management: sell securities or loans → the bank SHRINKS",
"  liability management: borrow or issue large CDs → size KEPT (preferred)",
"*CREDIT RISK*  loans not repaid → diversify, credit analysis, monitor, CDS",
"*INTEREST RATE RISK*  short-term liabilities, long-term assets",
"  gap = rate-sensitive assets - rate-sensitive liabilities",
"  change in profit = gap x change in rate    (-30 x 0.01 = -$0.30 per $100)",
"  fixes: match sensitivities · ARMs (more credit risk) · swap: pay fixed",
"*TRADING RISK*  traders keep gains, bank eats losses → limits, VaR, monitoring",
"*OPERATIONAL / CYBER*  failed processes, people, systems · spillovers → gov role",
"*ABROAD*  FX risk: currency mismatch · sovereign risk: government blocks payment",
"*EXAM TRAPS*",
"  capital is NOT reserves: capital absorbs losses, reserves meet withdrawals",
"  off-balance-sheet: a credit line appears only when it is drawn",
"  negative gap: rising rates HURT, falling rates help",
"  high ROE may be leverage, not skill · illiquid is not the same as insolvent",
"  federal funds = unsecured, bank to bank · repo = collateralized",
"  payday loan: 15% per two weeks; 10 renewals of $500 = $825 in fees"],

calc:[
 // ROA -> profit (end-of-chapter problem 2)
 ()=>{const r=rint(100,300,50),l=rint(600,1200,50),s=rint(400,1000,50),A=r+l+s,roa=pick([0.8,1,1.2,1.5]),a=+(A*roa/100).toFixed(2),N=v=>v.toLocaleString('en-US');
  return{q:`A bank holds reserves of $${r} million, loans of $${N(l)} million and securities of $${N(s)} million. Its return on assets (ROA) was ${roa}%. What were its after-tax profits, in $ millions? (two decimals)`,a,u:'$',
   steps:['Net profit = ROA x Total assets',`Total assets = ${r} + ${N(l)} + ${N(s)} = ${N(A)}`,`Net profit = ${roa}% x ${N(A)}`,`   = $${a.toFixed(2)} million`]}},
 // ROE from a balance sheet (problem 3)
 ()=>{const cap=rint(6,14),dep=rint(60,100,5),bor=rint(2,12),A=cap+dep+bor,p=+(cap*rint(80,200)/1000).toFixed(1),a=+(p/cap*100).toFixed(1);
  return{q:`A bank has total assets of $${A} million, deposits of $${dep} million and borrowings of $${bor} million. Its net profit after taxes is $${p} million. What is its return on equity (ROE), in percent? (one decimal)`,a,u:'%',
   steps:['ROE = Net profit after taxes / Bank capital','Capital = assets - liabilities',`   = ${A} - (${dep} + ${bor}) = ${cap}`,`ROE = ${p} / ${cap}`,`   = ${a.toFixed(1)}%`]}},
 // leverage ratio, or the asset fall that wipes out capital (problem 3, Lessons from the Crisis)
 ()=>{const cap=rint(8,20)*10,A=cap*rint(6,13)+rint(0,9)*10,L=A-cap,N=v=>v.toLocaleString('en-US');
  if(Math.random()<.55){const a=+(A/cap).toFixed(2);return{q:`A bank has liabilities of $${N(L)} million and bank capital of $${cap} million. What is its leverage ratio (total assets / capital)? (two decimals)`,a,u:'',

  const a=+(cap/A*100).toFixed(2);return{q:`A bank has assets of $${N(A)} million, funded by $${N(L)} million of liabilities and the rest by capital. What percentage fall in the value of its assets would wipe out its capital? (two decimals)`,a,u:'%',
   steps:['% fall that wipes out capital = Capital / Assets',`Capital = ${N(A)} - ${N(L)} = ${cap}`,`Leverage ratio = ${N(A)} / ${cap} = ${(A/cap).toFixed(2)}`,`${cap} / ${N(A)} = ${a.toFixed(2)}% of assets`]}},
 // ROE = ROA x leverage (problem 13)
 ()=>{const cap=pick([50,80,100,125,200]),L=1000-cap,lev=1000/cap,roa=rint(6,16)/10,a=+(roa*lev).toFixed(2);

   steps:['ROE = ROA x (Bank assets / Bank capital)',`Capital = 1,000 - ${L} = ${cap}`,`Leverage = 1,000 / ${cap} = ${lev}`,`ROE = ${roa}% x ${lev}`,`   = ${a}%`]}},
 // excess reserves, or the shortfall after a withdrawal (Figures 12.4-12.5 and footnote 5)
 ()=>{const D=rint(100,500,50),rr=pick([5,10,10,20]),req=D*rr/100;

   steps:['Excess reserves = reserves - required reserves',`Required = ${rr}% x ${D} = ${req}`,`Excess = ${R} - ${req}`,`   = $${e} million`]}}
  const W=5*rint(1,Math.max(1,Math.min(5,Math.floor(req/5)))),res=+(req-W).toFixed(2),req2=+((D-W)*rr/100).toFixed(2),a=+(req2-res).toFixed(2);
  return{q:`A bank has deposits of $${D} million and holds exactly its required reserves: ${rr}% of deposits, or $${req} million. A customer withdraws $${W} million, paid out of reserves. By how many $ millions do reserves now fall short of the requirement? (two decimals)`,a,u:'$',
   steps:['Shortfall = new required reserves - reserves left',`Reserves left = ${req} - ${W} = ${res}`,`New required = ${rr}% x (${D} - ${W}) = ${req2}`,`Shortfall = ${req2} - ${res}`,`   = $${a} million`]}},
 // net interest margin, or payday loan fees (Your Financial World)
 ()=>{if(Math.random()<.65){const A=rint(200,900,50),X=+(A*rint(40,65)/1000).toFixed(1),Y=+(A*rint(15,35)/1000).toFixed(1),nii=+(X-Y).toFixed(1),a=+(nii/A*100).toFixed(2);
   return{q:`A bank has total assets of $${A} million. This year it receives $${X} million of interest on its loans and securities and pays $${Y} million of interest on its deposits and borrowings. What is its net interest margin, in percent? (two decimals)`,a,u:'%',
    steps:['Net interest margin = Net interest income / Assets',`Net interest income = ${X} - ${Y} = ${nii}`,`Margin = ${nii} / ${A}`,`   = ${a.toFixed(2)}%`]}}
  const P=rint(200,800,100),k=rint(2,10),fee=P*.15,a=Math.round(fee*(k+1));

/* ================= sound: two sets (arcade = new, classic = the original) ================= */
let AC=null,MG=null,NB=null,lastTick=0;
function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.connect(AC.destination)}if(AC.state==='suspended')AC.resume();MG.gain.value=Math.pow(S.vol/100,1.5)*.7;return AC}
function note(f,t,d,o={}){const os=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+t;os.type=o.type||S.wave;os.frequency.setValueAtTime(f,t0);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t0+d);
  const v=(o.vol||.2)*(os.type==='sine'||os.type==='triangle'?1.7:1);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+.008);g.gain.exponentialRampToValueAtTime(.0001,t0+d);os.connect(g);g.connect(MG);os.start(t0);os.stop(t0+d+.03)}
function tone1(f,d,v,type,delay){const t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=f;g.gain.value=v*3.2;o.connect(g);g.connect(MG);o.start(t0);o.stop(t0+d)}
function noise(t,d,o={}){if(!NB){NB=AC.createBuffer(1,AC.sampleRate*.6,AC.sampleRate);const ch=NB.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1}
  const s=AC.createBufferSource(),g=AC.createGain(),fl=AC.createBiquadFilter(),t0=AC.currentTime+t;s.buffer=NB;fl.type=o.ft||'bandpass';fl.frequency.value=o.f||2000;g.gain.setValueAtTime(o.vol||.2,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);s.connect(fl);fl.connect(g);g.connect(MG);s.start(t0,Math.random()*.3,d+.03)}
const seq=(ns,o={})=>{let t=0;for(const[f,d] of ns){if(f)note(f,t,d*1.5,o);t+=d}};
const SFX={
 advance:()=>note(740,0,.05,{vol:.11}),

};

const SFX1={
 correct:()=>{tone1(660,.07,.03);tone1(990,.09,.03,null,.07)},
 wrong:()=>tone1(110,.35,.05,'sawtooth'),hurt:()=>tone1(110,.35,.05,'sawtooth'),
 meltdown:()=>tone1(70,.8,.06,'sawtooth'),

};
const CAT={advance:'advance',correct:'correct',grant:'correct',hit:'correct',cash:'correct',wrong:'wrong',deny:'wrong',hurt:'wrong',meltdown:'crash',module:'module',chapter:'chapter',streak:'fx',plot:'fx',pickup:'fx',select:'fx',boot:'fx',rewind:'fx'};
function play(n,force){if(!force&&(!S.sound||!S.vol||S.snd[CAT[n]]===false))return;try{ac();((S.pack==='classic'&&SFX1[n])||SFX[n])()}catch(e){}}
function tick(force){if(!force&&(!S.sound||!S.vol||S.snd.typing===false))return;const st=S.typeSnd==='auto'?(S.pack==='classic'?'v1':(TH[S.theme]&&TH[S.theme].snd||'blip')):S.typeSnd;if(st==='off')return;
  try{ac();const now=AC.currentTime;if(!force&&now-lastTick<(st==='v1'?.042:.035))return;lastTick=now;
   if(st==='v1')tone1(700+Math.random()*200,.012,.012);
   else if(st==='blip')note(680+Math.random()*240,0,.018,{type:'square',vol:.045});
   else if(st==='chip')note(Math.random()<.5?440:523,0,.03,{type:'square',vol:.05});
   else if(st==='soft')note(500+Math.random()*80,0,.03,{type:'sine',vol:.06});
   else if(st==='click')noise(0,.014,{f:3500+Math.random()*1500,vol:.15,ft:'highpass'});
   else if(st==='tele'){noise(0,.03,{f:1200,vol:.18});note(110,0,.035,{type:'square',vol:.06})}}catch(e){}}

/* ================= panels: sound menu, terminal gallery, book ================= */
let panelEl=null,panelDone=null;
function openPanel(title,build){closePanel();const p=el('div','panel'),b=el('div','box');b.innerHTML=`<h2><span>${title}</span><button type="button" data-x>[x] close</button></h2><div class="pb"></div>`;p.append(b);document.body.append(p);panelEl=p;
  p.addEventListener('click',e=>{if(e.target===p||e.target.closest('[data-x]'))closePanel()});build(b.querySelector('.pb'));return new Promise(r=>panelDone=r)}
function closePanel(){if(!panelEl)return;panelEl.remove();panelEl=null;const d=panelDone;panelDone=null;d&&d();if(mode==='ask'&&!matchMedia('(pointer:coarse)').matches)ghost.focus()}
const SROWS=[['typing','Typing',()=>{let k=0;const t=setInterval(()=>{tick(true);if(++k>12)clearInterval(t)},60)}],['advance','Continue to the next part',()=>play('advance',1)],['correct','Correct answer',()=>play('correct',1)],['wrong','Wrong answer',()=>play('wrong',1)],['crash','Meltdown / game over',()=>play('meltdown',1)],['module','Module complete',()=>play('module',1)],['chapter','Whole chapter done / boss beaten',()=>play('chapter',1)],['fx','Drawing, term pickups, streaks',()=>{play('pickup',1);setTimeout(()=>play('streak',1),260)}]];
function soundPanel(){return openPanel('SOUND MENU',b=>{const draw=()=>{
  b.innerHTML=`<div class="prow"><button type="button" id="pOn" class="${S.sound?'on':''}">${S.sound?'[x] sound ON':'[ ] sound OFF'}</button><span>volume</span><span class="lvl">${Array.from({length:10},(_,i)=>`<button type="button" data-l="${(i+1)*10}" aria-label="volume ${(i+1)*10}%">${S.vol>=(i+1)*10?'█':'░'}</button>`).join('')}</span><b>${S.vol}%</b></div>
  <div class="prow"><input type="range" id="pVol" min="0" max="100" step="5" value="${S.vol}" aria-label="Volume"></div>
  <h3>Sound set</h3><div class="prow">${[['arcade','Arcade (new)'],['classic','Classic (the original beeps)']].map(x=>`<button type="button" data-pk="${x[0]}" class="${S.pack===x[0]?'on':''}">${x[1]}</button>`).join('')}</div>
  <h3>Typing voice</h3><div class="prow">${[['auto','auto (matches set & terminal)'],['v1','original blip'],['blip','blip'],['chip','8-bit chip'],['click','mechanical keys'],['tele','teletype'],['soft','soft'],['off','silent']].map(x=>`<button type="button" data-ty="${x[0]}" class="${S.typeSnd===x[0]?'on':''}">${x[1]}</button>`).join('')}</div>
  <h3>Tone (arcade set)</h3><div class="prow">${[['square','8-bit'],['triangle','mellow'],['sine','pure'],['sawtooth','buzzy']].map(x=>`<button type="button" data-wv="${x[0]}" class="${S.wave===x[0]?'on':''}">${x[1]}</button>`).join('')}</div>
  <h3>Which sounds play</h3>${SROWS.map((r,i)=>`<div class="srow"><label><input type="checkbox" data-c="${r[0]}" ${S.snd[r[0]]===false?'':'checked'}> ${r[1]}</label><button type="button" data-t="${i}">▶ test</button></div>`).join('')}
  <div class="prow" style="margin-top:14px"><button type="button" id="pAll">▶ play them all</button><button type="button" data-x>done</button></div>`;
  b.querySelector('#pOn').onclick=()=>{S.sound=!S.sound;save();syncUI();draw();play('select')};
  b.querySelectorAll('[data-l]').forEach(x=>x.onclick=()=>{S.vol=+x.dataset.l;S.sound=true;save();syncUI();draw();play('correct',1)});
  b.querySelector('#pVol').oninput=e=>{S.vol=+e.target.value;save();syncUI();b.querySelector('.prow b').textContent=S.vol+'%';b.querySelectorAll('[data-l]').forEach(x=>x.textContent=S.vol>=+x.dataset.l?'█':'░');tick(true)};
  b.querySelectorAll('[data-pk]').forEach(x=>x.onclick=()=>{S.pack=x.dataset.pk;save();draw();play('correct',1);setTimeout(SROWS[0][2],500)});
  b.querySelectorAll('[data-ty]').forEach(x=>x.onclick=()=>{S.typeSnd=x.dataset.ty;save();draw();SROWS[0][2]()});
  b.querySelectorAll('[data-wv]').forEach(x=>x.onclick=()=>{S.wave=x.dataset.wv;save();draw();play('correct',1)});

  b.querySelector('#pAll').onclick=()=>SROWS.forEach((r,i)=>setTimeout(r[2],i*1100))};draw()})}

  b.querySelectorAll('[data-th]').forEach(x=>x.onclick=()=>{setTheme(x.dataset.th);play('select');draw()})};draw()})}

async function type(text,o={}){
  const ln=el('div','ln '+(o.cls||''));out.append(ln);
  if(o.who){const w=el('span','who');w.textContent='TELLER ▸ ';ln.append(w)}
  const sp=SPEED[S.speed],per=sp.per*(turbo||o.turbo?10:1);let n=0;const prev=mode;setMode('typing');
  for(const seg of String(text).split(/(\*[^*]+\*)/)){
    if(!seg)continue;const b=seg[0]==='*'&&seg.length>2;const holder=b?el('b'):document.createTextNode('');ln.append(holder);
    const node=b?holder.appendChild(document.createTextNode('')):holder;ln.append(cur);
    for(const ch of b?seg.slice(1,-1):seg){node.appendData(ch);
      if(!skip&&sp.d){if(++n%per===0){if(ch!==' ')tick();scroll();await sleep(sp.d)}
        if(!turbo&&!o.turbo&&'.?!:'.includes(ch))await sleep(sp.d*sp.p)}}
    if(b&&o.who!==undefined)collect(seg.slice(1,-1));
  }
  ln.append(cur);setMode(prev==='typing'?'idle':prev);scroll();return ln;
}

function rawAsk(o={}){return new Promise(res=>{skip=false;setMode('ask');if(o.ans!=null)window.__ans=o.ans;askWords=o.words||0;
  ps1El.innerHTML=o.ps||ps1();ghost.value='';showTyped();inl.hidden=false;typedEl.after(cur);hi=hist.length;
  chipsEl.innerHTML='';(o.chips||[]).forEach(c=>{const b=el('button');b.type='button';b.textContent=c;b.onclick=e=>{e.stopPropagation();if(mode==='ask')resolver(c)};chipsEl.append(b)});
  let tm=null;if(o.timeout){timer=o.timeout;updateStatus();tm=setInterval(()=>{if(panelEl)return;timer--;updateStatus();if(timer<=0)resolver(null)},1000)}
  resolver=v=>{clearInterval(tm);timer=null;askWords=0;setMode('idle');inl.hidden=true;chipsEl.innerHTML='';
    const ln=el('div','ln');ln.innerHTML=ps1El.innerHTML+' ';ln.append(document.createTextNode(v==null?'(time up)':v));ln.append(cur);out.append(ln);
    if(v)hist.push(v);updateStatus();scroll();res(v)};
  scroll();if(!panelEl&&!matchMedia('(pointer:coarse)').matches)ghost.focus();})}
async function askQ(o){for(;;){const v=await rawAsk(o);if(v===null)return null;const[c,...a]=v.toLowerCase().split(/\s+/);
  if(['quit','exit','menu',':q','q'].includes(c)&&!(o.words&&a.length))throw ABORT;
  const s=!(o.words&&a.length>1)&&SYS[SALIAS[c]||c];if(s){await s(a);continue}
  return v}}

    if(document.activeElement!==ghost){if(e.key==='Enter'){e.preventDefault();resolver(ghost.value.trim())}else if(!e.ctrlKey&&!e.metaKey)ghost.focus()}}
});

const LIVE=[],REDUCED=matchMedia('(prefers-reduced-motion:reduce)').matches;
const IO='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{e.target._vis=e.isIntersecting})):null;
setInterval(()=>{if(document.hidden)return;const now=performance.now();for(let k=LIVE.length-1;k>=0;k--){const L=LIVE[k];if(!L.pre.isConnected){LIVE.splice(k,1);continue}if(L.paused||L.pre._vis===false||now<L.next)continue;
  L.i++;if(L.i>L.f.n){L.i=0;L.f.reset&&L.f.reset()}L.pre.innerHTML=color(L.f.r(L.i));L.next=now+(L.i===L.f.n?(L.f.hold==null?2400:L.f.hold):1000/L.f.fps)}},40);

async function fig(f,inst){
  const w=el('div','figw'),pre=el('pre','fig');w.append(pre);out.append(w);let mx=1;const stp=Math.max(1,Math.floor(f.n/30));for(let i=0;i<=f.n;i+=stp)mx=Math.max(mx,f.r(i).split('\n').length);mx=Math.max(mx,f.r(f.n).split('\n').length);pre.style.minHeight=(mx*1.2)+'em';
  const prev=mode;setMode('typing');inst=inst||!SPEED[S.speed].d;const still=REDUCED||!S.anim;
  if(!inst&&!skip){const first=f.r(0),step=Math.max(2,Math.ceil(first.length/50));let c=0;for(let k=0;k<first.length;k+=step){pre.innerHTML=color(first.slice(0,k))+'█';scroll();if(c++%3===0)play('plot');await sleep(14);if(skip)break}}
  let i=0;pre.innerHTML=color(f.r(0));scroll();
  if(!still&&!inst){const intro=f.intro==null?f.n:f.intro;while(i<intro&&!skip){await sleep(1000/f.fps);i++;pre.innerHTML=color(f.r(i))}}
  if(f.n&&!f.once){if(still){i=f.n;pre.innerHTML=color(f.r(i))}IO&&IO.observe(pre);const L={pre,f,i,paused:still,next:performance.now()+(i>=f.n?(f.hold==null?2400:f.hold):1000/f.fps),btn:el('button','pp')};L.btn.type='button';ppLabel(L);
    L.btn.onclick=e=>{e.stopPropagation();L.paused=!L.paused;L.next=performance.now();ppLabel(L);play('select')};w.append(L.btn);LIVE.push(L);if(LIVE.length>60){const o=LIVE.shift();o.paused=true;o.btn.remove();o.pre.innerHTML=color(o.f.r(o.f.n))}}
  else pre.innerHTML=color(f.r(f.n));
  setMode(prev==='typing'?'idle':prev);scroll();
}

async function quiz(q,o={}){
  await type(q.q,{cls:'q'});let chips=[],key,correct,opts,gone=[];
  if(q.t==='mc'){opts=shuffle(q.o);for(let i=0;i<opts.length;i++)await type(`${'abcd'[i]}) ${opts[i]}`,{cls:'opt',turbo:true});key='abcd'[opts.indexOf(q.o[0])];correct=key+') '+q.o[0];chips=[...'abcd'].slice(0,opts.length)}
  else if(q.t==='tf'){key=q.a?'true':'false';correct=q.a?'TRUE':'FALSE';chips=['true','false']}
  else if(q.t==='fill'){key=q.a[0];correct=q.a[0]}
  else{key=String(q.a);correct=q.u==='$'?(Math.abs(q.a)<1000&&q.a%1?fmt2(q.a):fmt(q.a)):q.a+(q.u==='%'?'%':q.u?' '+q.u:'')}
  for(;;){const v=await askQ({chips:chips.concat(o.noHint?[]:['hint']),ps:'<i class="a">answer</i>&gt;',timeout:o.timeout,ans:key});
    if(v===null)return{ok:false,correct,timeout:true};const a=v.toLowerCase();
    if(a==='hint'&&!o.noHint){if(q.t==='mc'){const w=[...'abcd'].slice(0,opts.length).filter(k=>k!==key&&!gone.includes(k));if(w.length>1){const g=pick(w);gone.push(g);await type(`hint: it is not ${g}.`,{cls:'dim'})}else await type('No more hints. Commit.',{cls:'dim'})}
      else if(q.t==='fill')await type(`hint: ${key.length} letters, starts with "${key[0]}".`,{cls:'dim'});else if(q.t==='tf')await type('hint: it is one of the two.',{cls:'dim'});else await type('hint: write out the formula, then plug in.',{cls:'dim'});continue}
    if(a==='help'||a==='?'){await type("Answer the question. Also: hint · quit · theme · sound · speed · difficulty · status",{cls:'dim'});continue}
    if(!a)continue;
    if(q.t==='mc'){const k='abcd'.includes(a[0])&&(a.length===1||a[1]===')')?a[0]:null;if(!k||'abcd'.indexOf(k)>=opts.length){await type('Type a letter: '+chips.join(', ')+'.',{cls:'dim'});continue}return{ok:k===key,correct,ans:v}}
    if(q.t==='tf'){if(!/^(t|f|true|false|y|n|yes|no)$/.test(a)){await type('Type true or false.',{cls:'dim'});continue}return{ok:(/^(t|y)/.test(a))===q.a,correct,ans:v}}
    if(q.t==='fill')return{ok:q.a.map(norm).includes(norm(a)),correct,ans:v};
    const n=num(a);if(isNaN(n)){await type('I need a number.',{cls:'dim'});continue}return{ok:numOK(a,q.a,q.tol),correct,ans:v}}
}
// the professor's format: explain it back in 10 words or less
async function askSA(it,o={}){await type('IN 10 WORDS OR LESS',{cls:'hd2'});await type(it.q,{cls:'q'});
  for(;;){const v=await askQ({ps:'<i class="a">10 words</i>&gt;',ans:it.m,words:10,timeout:o.timeout});if(v===null)return{ok:false,timeout:true,ans:''};if(!v)continue;const n=words(v);
    if(n>10){play('deny');await type(`${n} words. The limit is 10. Tighten it.`,{cls:'err'});continue}
    if(o.silent)return{ok:gradeSA(it,v),ans:v};
    if(gradeSA(it,v))return{ok:true,ans:v};
    await type('Model answer: *'+it.m+'*');await type("I couldn't match yours to the key ideas. Did yours say the same thing? Be honest.",{cls:'dim'});
    for(;;){const y=((await askQ({chips:['y','n'],ps:'<i class="a">same idea? [y/n]</i>&gt;',ans:'y'}))||'').toLowerCase();if(/^y/.test(y))return{ok:true,ans:v,self:true};if(/^n/.test(y))return{ok:false,ans:v,shown:true}}}}

function meltdown(title,body){return new Promise(res=>{play('meltdown');crashEl.textContent=`\n  *** ${title} ***\n\n${body}\n\n  Press any key to continue _`;crashEl.hidden=false;setMode('idle');setTimeout(()=>{setMode('crash');resolver=()=>{crashEl.hidden=true;setMode('idle');res()}},700)})}
async function detention(line,times){await say([`Detention. Type this line${times>1?' '+times+' times':''}. Exactly.`]);
  for(let k=0;k<times;k++)for(;;){await type('  '+line,{cls:'acc',turbo:true});const v=await askQ({ps:`<i class="a">line ${k+1}/${times}</i>&gt;`,ans:line,words:99});if(norm(v)===norm(line)){play('advance');break}play('deny');await type('Not the same. Again. Slowly.',{cls:'err'})}}
const mkey=e=>[e.c,e.m,e.s,e.t,e.i].join('|');
function addMiss(e){if(!S.miss.some(x=>mkey(x)===mkey(e))){S.miss.push(e);if(S.miss.length>300)S.miss.shift();save()}}
function dropMiss(e){S.miss=S.miss.filter(x=>mkey(x)!==mkey(e));save()}

async function playSection(sec,si,replay){turbo=replay;auto=replay;try{
  await type(`§${si+1} ${sec.h}${replay?'  (replay ▶▶)':''}`,{cls:'hd'});
  for(const b of sec.beats){if(Array.isArray(b)){await say(b);await wait()}else await fig(figOf(b),replay)}
 }finally{turbo=false;auto=false}}
async function runModule(mi,startSi=0){const M=C.modules[mi],NM=C.modules.length;
  for(let first=true;;first=false){integrity=100;streak=0;let dead=false;loc=`${mi+1}/${NM}`;updateStatus();
    await type(`MODULE ${mi+1} OF ${NM} · ${M.title}`,{cls:'hd'});
    for(let si=first?startSi:0;si<M.secs.length&&!dead;si++){const sec=M.secs[si];let fails=0,replay=false,show=true;S.pos={c:C.n,mi,si};save();
      for(;;){loc=`${mi+1}/${NM} §${si+1}/${M.secs.length}`;updateStatus();
        if(show)await playSection(sec,si,replay);
        await type('CHECKPOINT',{cls:'hd2'});
        const qi=fails%sec.q.length,q=sec.q[qi],r=await quiz(q);let bad=null;
        if(!r.ok)bad={t:'q',i:qi,correct:r.correct,why:q.why,line:sec.line};
        else{await good(q);if(sec.sa&&sec.sa.length){const ki=fails%sec.sa.length,it=sec.sa[ki],g=await askSA(it);if(g.ok)await goodSA(it,g);else bad={t:'sa',i:ki,correct:it.m,why:'',line:it.m,shown:g.shown}}}
        if(!bad)break;
        fails++;streak=0;addMiss({c:C.n,m:mi,s:si,t:bad.t,i:bad.i});await crashFx();
        if(!bad.shown)await say([`Wrong. The answer was *${bad.correct}*.`,bad.why].filter(Boolean));
        if(S.diff==='chill'){await say(["Chill mode: no penalty. Different question, same idea."]);show=false;continue}
        if(S.diff==='hardcore'){dead=true;break}
        integrity=Math.max(0,integrity-25);updateStatus();await type(`integrity -25% → ${integrity}%  [${bar(integrity,100,20)}]`,{cls:'err',turbo:true});
        if(integrity<=0){dead=true;break}
        await detention(bad.line,Math.min(fails,3));
        await say(["Now we do the section again. Then a different question."]);play('rewind');await fig(FIG.rewind(),false);replay=true;show=true}}
    if(!dead)break;
    await meltdown('CORE MELTDOWN',`  A fatal exception 0x11 has occurred in MODULE ${mi+1}.\n\n  ${S.diff==='hardcore'?'Hardcore mode: one wrong answer is fatal.':'Integrity reached 0%.'}\n  Everything from this module has been dumped on the vault floor.\n\n  * The module will restart from section 1.\n  * Tip: type "hint" at a question, or "difficulty chill".`);
    out.innerHTML='';await say([`Rebooted. Module ${mi+1}, from the top, ${S.name||'operator'}.`])}
  const st=cs(C.n),first=!st.done[mi];st.done[mi]=1;S.xp+=50;S.pos=mi+1<NM?{c:C.n,mi:mi+1,si:0}:null;save();updateStatus();
  const all=modsDone(C)===NM;play(all&&first?'chapter':'module');
  await type(`MODULE ${mi+1} COMPLETE · +50 xp · integrity ${integrity}%`,{cls:'hd'});await fig(FIG.fireworks(),true);
}

async function shell(){for(;;){ctx='shell';updateStatus();const v=await rawAsk({chips:['learn','ten','calc','exam','boss','gallery','book','menu','help']});if(v)await runCmd(v)}}

/* ================= title screen, intro, main menu ================= */
const COIN_F=["     .-'''''-.     ","   .'  _____  '.   ","  /   |_   _|   \\  "," ;      | |      ; "," |      | |      | "," ;      | |      ; ","  \\     |_|     /  ","   '.         .'   ","     '-.....-'     "];
const COIN_B=["     .-'''''-.     ","   .'   _|_   '.   ","  /    / |      \\  "," ;     \\_|_      ; "," |       | \\     | "," ;      _|_/     ; ","  \\      |      /  ","   '.         .'   ","     '-.....-'     "];
const spin=(i,n)=>{const c=Math.cos(i/n*2*Math.PI),src=c>=0?COIN_F:COIN_B,a=Math.abs(c),cx=9;return src.map(row=>{let s='';for(let x=0;x<19;x++){const dx=x-cx;if(a<.1){s+=dx===0&&row.trim()?'║':' ';continue}const sx=Math.round(cx+dx/a);s+=sx>=0&&sx<19?row[sx]:' '}return s})};
const WORD=['▀█▀ █▀▀ █   █   █▀▀ █▀▄',' █  █▀▀ █   █   █▀▀ █▀▄',' ▀  ▀▀▀ ▀▀▀ ▀▀▀ ▀▀▀ ▀ ▀'];
function titleFig(){let t=0,last=-1;const mk=()=>'  ◆  '+CHN().map(n=>{const c=BOOK.ch[n],d=modsDone(c),m=c.modules.length;return`CH${String(n).padStart(2,'0')} ${d>=m?'DONE':d?d+'/'+m:'····'}`}).join('  ◆  ')+'  ◆  SYSTEM STATUS: ALL VAULTS NOMINAL';let M=mk();
  const R=['',...WORD,'','FIRST TERMINAL BANK & TRUST','TRAINING SYSTEM · v23.0','MONEY, BANKING AND','FINANCIAL MARKETS'];
  return{n:48,fps:10,hold:0,intro:0,reset:()=>{M=mk()},r:i=>{if(i!==last){t++;last=i}const coin=spin(i,48),L=[' ╔'+rep('═',50)+'╗'];for(let k=0;k<9;k++)L.push(' ║ '+coin[k]+'  '+padE(R[k],28)+'║');L.push(' ╟'+rep('─',50)+'╢',' ║'+lane(M,50,t)+'║',' ╚'+rep('═',50)+'╝','  (C) FIRST TERMINAL BANK & TRUST · TRAINEES ONLY');return L.join('\n')}}}
const postFig=()=>({n:44,fps:14,once:1,r:i=>[' TELLER BIOS v23.0   (C) First Terminal Bank & Trust',' CPU: 1 TELLER @ 110 BAUD',' MEMORY TEST: '+padS(Math.min(640,i*40),3)+'K'+(i>=16?' OK':''),i>=18?' VAULT LINK ............ '+(i>=22?'OK':''):'',i>=24?' TEXTBOOK .............. '+(i>=28?CHN().length+' CHAPTERS FOUND':''):'',i>=30?' LOADING ['+bar(Math.min(14,i-30),14,24)+'] '+Math.min(100,Math.round((i-30)/14*100))+'%':''].join('\n')});
const vaultFig=()=>{const W=42,H=9,cx=20,inner=Array.from({length:H},()=>rep(' ',W));const put=(a,r,s)=>{const x=Math.floor((W-[...s].length)/2);a[r]=a[r].slice(0,x)+s+a[r].slice(x+[...s].length)};WORD.forEach((w,k)=>put(inner,2+k,w));put(inner,6,'FIRST TERMINAL BANK & TRUST');
  return{n:46,fps:11,once:1,r:i=>{const door=Array.from({length:H},()=>rep('▒',W)),ph=i%2,d=["  .-'''''-.  ",ph?" /  \\   /  \\ ":" /    |    \\ ",ph?"|     ●     |":"|  ───●───  |",ph?" \\  /   \\  / ":" \\    |    / ","  '-.....-'  "];if(i<26)d.forEach((s,k)=>put(door,2+k,s));
    const k=i<=26?-1:(i-26)*1.15,rows=door.map((row,r)=>[...row].map((ch,x)=>Math.abs(x-cx)<=k?inner[r][x]:ch).join(''));
    return[' ╔'+rep('═',W)+'╗',...rows.map(r=>' ║'+r+'║'),' ╚'+rep('═',W)+'╝',' COMBINATION  '+(i>=6?'23':'··')+' · '+(i>=12?'11':'··')+' · '+(i>=18?'04':'··')+(i>=22?'    ACCESS GRANTED':'')].join('\n')}}};
async function mainMenu(){skip=false;const st=cs(C.n),nd=CHN().filter(n=>modsDone(BOOK.ch[n])>=BOOK.ch[n].modules.length).length,p=S.pos&&BOOK.ch[S.pos.c]?S.pos:null,wide=innerWidth>=760;
  const I=[['1','learn','guided lessons with checkpoints'],['2','ten','professor mode: 10 words or less'],['3','calc','calculation drills, fresh numbers'],['4','exam','his format, marked at the end'],['5','boss','fight '+(C.boss?C.boss.name:'THE LEMON')],['6','crack','decrypt the key terms'],['7','review','your mistakes, all chapters ('+S.miss.length+')'],['8','gallery','every animation in the chapter'],['9','book','change chapter ('+CHN().length+' loaded)']];
  const cell=(x,w)=>x[0]+' *'+x[1]+'*'+rep(' ',8-x[1].length)+' '+x[2]+rep(' ',(w||0)-11-x[2].length);
  await fig(titleFig(),true);
  const L=['OPERATOR *'+(S.name||'trainee').toUpperCase()+'* · '+S.xp.toLocaleString()+' XP · chapters done '+nd+'/'+CHN().length,'┌─ NOW STUDYING '+rep('─',wide?62:30),'│ *CH '+C.n+' · '+C.title.toUpperCase()+'*','│ modules '+bar(modsDone(C),C.modules.length,8)+' '+modsDone(C)+'/'+C.modules.length+' · terms '+termsGot(C)+'/'+C.gloss.length+(st.boss?' · boss ★':'')+(st.exam?' · exam '+st.exam+'%':'')];
  if(wide){L.push('├─ LEARN '+rep('─',38)+' PROVE IT '+rep('─',22));[[0,3],[1,4],[2,5],[7,6],[8,null]].forEach(([l,r])=>L.push('│ '+cell(I[l],45)+(r==null?'':'│ '+cell(I[r]))))}
  else{L.push('├─ LEARN '+rep('─',36));[0,1,2].forEach(k=>L.push('│ '+cell(I[k])));L.push('├─ PROVE IT '+rep('─',33));[3,4,5,6].forEach(k=>L.push('│ '+cell(I[k])));L.push('├─ LOOK '+rep('─',37));[7,8].forEach(k=>L.push('│ '+cell(I[k])))}

  for(const l of L)await type(l,{turbo:true})}

const rain=$('#rain');let rainT=null;
function rainFx(on){clearInterval(rainT);rainT=null;if(!on||REDUCED)return;const c=rain.getContext('2d');let cols=[];const size=()=>{rain.width=innerWidth;rain.height=innerHeight;cols=Array.from({length:Math.ceil(innerWidth/16)},()=>Math.random()*-40)};size();onresize=size;
  rainT=setInterval(()=>{if(document.hidden)return;c.fillStyle='rgba(0,0,0,.09)';c.fillRect(0,0,rain.width,rain.height);c.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--fg');c.font='15px monospace';cols.forEach((y,i)=>{c.fillText(pick([...'$¢€£¥0123456789%']),i*16,y*16);cols[i]=y*16>rain.height&&Math.random()>.975?0:y+1})},70)}
function setTheme(n){if(!TH[n])n='dos';const t=TH[n],r=document.documentElement,c=t.c.split(' ');S.theme=n;
  ['bg','fg','dim','acc','ok','err','info','bar','barfg','cbg','cfg'].forEach((k,i)=>r.style.setProperty('--'+k,c[i]));
  r.style.setProperty('--glow',t.glow||'none');r.style.setProperty('--font',t.font||FONT);r.style.setProperty('--frame',t.frame||'transparent');r.style.setProperty('--fw',t.frame?'clamp(8px,3.2vw,36px)':'0px');r.style.setProperty('--bgimg',t.bgimg||'none');
  r.dataset.cur=t.cur||'block';r.dataset.fx=t.fx||'';r.dataset.chrome=t.chrome||'none';r.toggleAttribute('data-upper',!!t.upper);
  rainFx(t.fx==='matrix');save();syncUI()}
function setChapter(n){if(!BOOK.ch[n])n=BOOK.ch[11]?11:CHN()[0];C=BOOK.ch[n];S.cur=n;save();syncUI()}
function syncUI(){if(TH[S.theme])$('#ttl').textContent=tx(TH[S.theme].title);$('#bTheme').textContent='▦ '+(TH[S.theme]?TH[S.theme].label:'terminal');$('#bBook').textContent='▤ Ch '+(C?C.n:'');$('#sSpeed').value=S.speed;$('#sDiff').value=S.diff;$('#bSound').textContent='♪ '+(S.sound&&S.vol?S.vol+'%':'off');if(MG)MG.gain.value=Math.pow(S.vol/100,1.5)*.7;if(mode==='ask'&&ctx==='shell'&&TH[S.theme])ps1El.innerHTML=ps1();updateStatus()}
$('#bTheme').onclick=e=>{e.target.blur();themePanel()};$('#bSound').onclick=e=>{e.target.blur();soundPanel()};$('#bBook').onclick=e=>{e.target.blur();bookPanel()};
$('#sSpeed').onchange=e=>{S.speed=e.target.value;save();e.target.blur()};$('#sDiff').onchange=e=>{S.diff=e.target.value;save();updateStatus();e.target.blur()};
async function boot(full){ctx='boot';skip=false;play('boot');for(const l of TH[S.theme].boot)await type(tx(l),{cls:'dim',turbo:true});
  if(full||!S.name){await fig(postFig());play('select');await fig(vaultFig());play('grant');await sleep(SPEED[S.speed].d?500:0);out.innerHTML=''}

    await say(["Good. You're in."]);await say(["I am *TELLER*. I have run this vault since before your professor was born.",`All ${CHN().length} chapters of the book are stored in here. I teach one piece at a time. The pictures move. Then I ask.`,"Your professor wants answers in *10 words or less*. So do I. We will practise exactly that, and the calculations too.","Get one wrong and there are consequences."]);
