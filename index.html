<html lang="en">
<head>

<title>TELLER — Chapter 11 Terminal Tutor</title>
<style>
:root{--bg:#1e1e2e;--fg:#cdd6f4;--dim:#8a90aa;--acc:#f9e2af;--ok:#a6e3a1;--err:#f38ba8;--info:#89dceb;--bar:#313244;--barfg:#cdd6f4;--cbg:#11111b;--cfg:#f38ba8;--glow:none;--frame:transparent;--fw:0px;--bgimg:none;
  --font:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);background-image:var(--bgimg);color:var(--fg);font:15px/1.5 var(--font);text-shadow:var(--glow);overflow:hidden}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.2;display:none}
[data-fx~=matrix] #rain{display:block}
#win{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh;height:100dvh;border:var(--fw) solid var(--frame)}
#bar{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--bar);color:var(--barfg);padding:6px 12px;font-size:13px;text-shadow:none;flex-wrap:wrap}
#bar .l{display:flex;gap:10px;align-items:center;min-width:0}
.dots{display:none;gap:6px}.dots i{width:11px;height:11px;border-radius:50%;background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
[data-chrome=mac] .dots{display:flex}
.wbtn{display:none;letter-spacing:.5em;padding-left:6px}[data-chrome=win] .wbtn{display:inline}
#ttl{white-space:pre;overflow:hidden;text-overflow:ellipsis}
#bar .r{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#bar select,#bar button{font:12px var(--font);background:transparent;color:inherit;border:1px solid currentColor;border-radius:3px;padding:2px 7px;cursor:pointer;opacity:.9}
#bar select option{color:#111;background:#fff}
#screen{flex:1;overflow-y:auto;padding:14px 16px 30px;cursor:text;scrollbar-color:var(--dim) transparent}
[data-upper] #screen{text-transform:uppercase}
.ln{white-space:pre-wrap;word-break:break-word;min-height:1.5em}
.say{padding-left:9ch;text-indent:-9ch}.say.cont{text-indent:0}
.who{color:var(--info);font-weight:700}
.acc,.ln b{color:var(--acc);font-weight:700}
.dim{color:var(--dim)}.err{color:var(--err)}.ok{color:var(--ok)}.info{color:var(--info)}
.hd{display:table;background:var(--fg);color:var(--bg);padding:0 1ch;font-weight:700;margin:1.2em 0 .4em;text-shadow:none}
.hd2{color:var(--acc);font-weight:700;margin-top:.8em;border-top:1px dashed var(--dim);padding-top:.5em}
.q{font-weight:700}.opt{padding-left:2ch}
.more{color:var(--dim)}
pre.fig{font:inherit;font-size:min(1em,2.5vw);line-height:1.2;margin:.7em 0;color:var(--fg);overflow-x:auto;overflow-y:hidden;white-space:pre}
pre.fig i{font-style:normal}pre.fig .m{color:var(--acc)}pre.fig .g{color:var(--ok)}pre.fig .r{color:var(--err)}
#inl{white-space:pre-wrap;word-break:break-word}
#ps1 i,.ln i{font-style:normal}
#ps1 .u,.ln .u{color:var(--ok);font-weight:700}#ps1 .p,.ln .p{color:var(--info);font-weight:700}#ps1 .a,.ln .a{color:var(--acc)}
.cur{display:inline-block;width:.6em;height:1.1em;background:currentColor;vertical-align:text-bottom;margin-left:1px;animation:blink 1.06s steps(1) infinite;box-shadow:var(--glow)}
[data-cur=under] .cur{height:.2em;vertical-align:baseline}
[data-cur=bar] .cur{width:2px}
body.typing .cur{animation:none}
@keyframes blink{50%{opacity:0}}
#chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
#chips button,.box button{font:inherit;font-size:.9em;color:var(--fg);background:transparent;border:1px solid var(--dim);border-radius:3px;padding:3px 10px;cursor:pointer;text-shadow:inherit;text-transform:inherit}
#chips button:hover,.box button:hover,.box button.on{background:var(--fg);color:var(--bg);text-shadow:none}
#status{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--ok);color:var(--bg);padding:2px 10px;font-size:12.5px;text-shadow:none;font-weight:700}
#status .e{background:var(--err);padding:0 4px}
#ghostf{position:fixed;left:0;bottom:0;width:1px;height:1px;overflow:hidden;opacity:0}
#ghost{font-size:16px;width:200px}
#fx{position:fixed;inset:0;z-index:2;pointer-events:none;display:none;background:repeating-linear-gradient(rgba(0,0,0,.2) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.45))}
[data-fx~=crt] #fx{display:block}
#crash{position:fixed;inset:0;background:var(--cbg);color:var(--cfg);padding:10vh 8vw;white-space:pre-wrap;font-size:clamp(13px,2vw,18px);z-index:9;text-shadow:none;cursor:pointer}
#crash[hidden]{display:none}
.panel{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:12px;text-shadow:none}
.box{background:var(--bg);color:var(--fg);border:2px solid var(--fg);box-shadow:8px 8px 0 rgba(0,0,0,.55);width:min(720px,100%);max-height:90vh;max-height:90dvh;overflow:auto;padding:0 16px 16px}
.box h2{font:inherit;font-weight:700;background:var(--fg);color:var(--bg);margin:0 -16px 12px;padding:3px 16px;display:flex;justify-content:space-between;position:sticky;top:0}
.box h2 button{border:0;color:var(--bg);padding:0 6px}.box h2 button:hover{background:var(--bg);color:var(--fg)}
.box h3{font:inherit;font-weight:700;color:var(--acc);margin:14px 0 6px}
.prow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.prow input[type=range]{flex:1;min-width:140px;accent-color:var(--acc)}
.lvl button{border:0!important;padding:0 1px!important;font-size:1.3em!important;line-height:1;color:var(--acc)!important;background:none!important}
.srow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--dim)}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.sw button{text-align:left;padding:8px 10px!important;border-width:2px!important;font-size:.9em;text-transform:none!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw button.cur-t{outline:3px solid var(--acc);outline-offset:1px}
.shake{animation:shake .45s}
@keyframes shake{10%{transform:translate(-6px,2px)}25%{transform:translate(5px,-3px);filter:hue-rotate(40deg) contrast(1.4)}40%{transform:translate(-4px,3px)}60%{transform:translate(4px,1px);filter:invert(.15)}80%{transform:translate(-2px,-1px)}}
@media (max-width:600px){body{font-size:13px}#screen{padding:10px 12px 24px}#status{font-size:11px}#ttl{display:none}}
@media (prefers-reduced-motion:reduce){.cur,.shake{animation:none}}
</style>

let AC=null,MG=null,NB=null,lastTick=0;
function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.connect(AC.destination)}if(AC.state==='suspended')AC.resume();MG.gain.value=Math.pow(S.vol/100,1.5)*.7;return AC}
function note(f,t,d,o={}){const os=AC.createOscillator(),g=AC.createGain(),t0=AC.currentTime+t;os.type=o.type||S.wave;os.frequency.setValueAtTime(f,t0);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t0+d);
  const v=(o.vol||.2)*(os.type==='sine'||os.type==='triangle'?1.7:1);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+.008);g.gain.exponentialRampToValueAtTime(.0001,t0+d);os.connect(g);g.connect(MG);os.start(t0);os.stop(t0+d+.03)}

  const s=AC.createBufferSource(),g=AC.createGain(),fl=AC.createBiquadFilter(),t0=AC.currentTime+t;s.buffer=NB;fl.type=o.ft||'bandpass';fl.frequency.value=o.f||2000;g.gain.setValueAtTime(o.vol||.2,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);s.connect(fl);fl.connect(g);g.connect(MG);s.start(t0,Math.random()*.3,d+.03)}
const seq=(ns,o={})=>{let t=0;for(const[f,d] of ns){if(f)note(f,t,d*1.5,o);t+=d}};
const SFX={

const CAT={advance:'advance',correct:'correct',grant:'correct',hit:'correct',cash:'correct',wrong:'wrong',deny:'wrong',hurt:'wrong',meltdown:'crash',module:'module',chapter:'chapter',streak:'fx',plot:'fx',pickup:'fx',select:'fx',boot:'fx',rewind:'fx'};
function play(n,force){if(!force&&(!S.sound||!S.vol||S.snd[CAT[n]]===false))return;try{ac();SFX[n]()}catch(e){}}
function tick(force){if(!force&&(!S.sound||!S.vol||S.snd.typing===false))return;const st=S.typeSnd==='auto'?(TH[S.theme]&&TH[S.theme].snd||'blip'):S.typeSnd;if(st==='off')return;
  try{ac();const now=AC.currentTime;if(!force&&now-lastTick<.035)return;lastTick=now;
   if(st==='blip')note(680+Math.random()*240,0,.018,{type:'square',vol:.045});
   else if(st==='chip')note(Math.random()<.5?440:523,0,.03,{type:'square',vol:.05});

const out=$('#out'),screen=$('#screen'),inl=$('#inl'),ps1El=$('#ps1'),typedEl=$('#typed'),chipsEl=$('#chips'),ghost=$('#ghost'),win=$('#win'),crashEl=$('#crash'),statusEl=$('#status');
const cur=el('span','cur');
const SPEED={slow:{d:30,per:1,p:9},normal:{d:15,per:1,p:8},fast:{d:8,per:3,p:3},instant:{d:0,per:1,p:0}};
const ABORT={abort:true};
let mode='idle',resolver=null,skip=false,turbo=false,auto=false,ctx='boot',loc='',integrity=100,streak=0,timer=null,hist=[],hi=0;
const scroll=()=>{screen.scrollTop=screen.scrollHeight};
function setMode(m){mode=m;document.body.classList.toggle('typing',m==='typing')}
function updateStatus(){statusEl.innerHTML=`<span>[ch11] ${esc(ctx)}${loc?' '+esc(loc):''}</span><span>${timer!=null?`<span class="${timer<=10?'e':''}">T-${timer}s</span> · `:''}integrity ${bar(integrity,100,5)} ${integrity}% · streak ${streak} · xp ${S.xp} · terms ${Object.keys(S.terms).length}/${GLOSS.length} · ${S.diff}</span>`}
const TALIAS={'screen and certify':'screening','monitor':'monitoring','diversifying':'diversification'};
function collect(txt){const t=txt.toLowerCase();let got=false;for(const g of GLOSS){if(S.terms[g.n])continue;if(TALIAS[t]===g.n||new RegExp('\\b'+g.n+'s?\\b').test(t)){S.terms[g.n]=1;got=true}}if(got){save();play('pickup');updateStatus()}}

async function type(text,o={}){
  const ln=el('div','ln '+(o.cls||''));out.append(ln);
  if(o.who){const w=el('span','who');w.textContent='TELLER ▸ ';ln.append(w)}
  const sp=SPEED[S.speed],per=sp.per*(turbo||o.turbo?10:1);let n=0;const prev=mode;setMode('typing');
  for(const seg of String(text).split(/(\*[^*]+\*)/)){
    if(!seg)continue;const b=seg[0]==='*'&&seg.length>2;const holder=b?el('b'):document.createTextNode('');ln.append(holder);
    const node=b?holder.appendChild(document.createTextNode('')):holder;ln.append(cur);
    for(const ch of b?seg.slice(1,-1):seg){node.appendData(ch);
      if(!skip&&sp.d){if(++n%per===0){if(ch!==' ')tick();scroll();await sleep(sp.d)}
        if(!turbo&&!o.turbo&&'.?!:'.includes(ch))await sleep(sp.d*sp.p)}}
    if(b&&o.who!==undefined)collect(seg.slice(1,-1));
  }
  ln.append(cur);setMode(prev==='typing'?'idle':prev);scroll();return ln;
}
async function say(lines,o={}){skip=false;lines=[].concat(lines);for(let i=0;i<lines.length;i++)await type(lines[i],{cls:'say'+(i?' cont':''),who:i===0,turbo:o.turbo})}
function wait(){if(auto)return Promise.resolve();return new Promise((res,rej)=>{skip=false;const ln=el('div','ln more');ln.textContent=TH[S.theme].more+' ';ln.append(cur);out.append(ln);scroll();setMode('wait');
  resolver=v=>{setMode('idle');const p=ln.previousElementSibling;ln.remove();if(p&&p.tagName!=='PRE')p.append(cur);if(v){play('advance');res()}else rej(ABORT)}})}
function rawAsk(o={}){return new Promise(res=>{skip=false;setMode('ask');if(o.ans!=null)window.__ans=o.ans;
  ps1El.innerHTML=o.ps||TH[S.theme].ps1;typedEl.textContent='';ghost.value='';inl.hidden=false;inl.append(cur);hi=hist.length;
  chipsEl.innerHTML='';(o.chips||[]).forEach(c=>{const b=el('button');b.type='button';b.textContent=c;b.onclick=e=>{e.stopPropagation();if(mode==='ask')resolver(c)};chipsEl.append(b)});
  let tm=null;if(o.timeout){timer=o.timeout;updateStatus();tm=setInterval(()=>{if(panelEl)return;timer--;updateStatus();if(timer<=0)resolver(null)},1000)}
  resolver=v=>{clearInterval(tm);timer=null;setMode('idle');inl.hidden=true;chipsEl.innerHTML='';
    const ln=el('div','ln');ln.innerHTML=ps1El.innerHTML+' ';ln.append(document.createTextNode(v==null?'(time up)':v));ln.append(cur);out.append(ln);
    if(v)hist.push(v);updateStatus();scroll();res(v)};
  scroll();if(!panelEl&&!matchMedia('(pointer:coarse)').matches)ghost.focus();})}
async function askQ(o){for(;;){const v=await rawAsk(o);if(v===null)return null;const[c,...a]=v.toLowerCase().split(/\s+/);
  if(['quit','exit','menu',':q','q'].includes(c))throw ABORT;
  const s=SYS[SALIAS[c]||c];if(s){await s(a);continue}
  return v}}

ghost.addEventListener('input',()=>{typedEl.textContent=ghost.value;scroll()});
$('#ghostf').addEventListener('submit',e=>{e.preventDefault();if(mode==='ask'&&!panelEl)resolver(ghost.value.trim())});
document.addEventListener('keydown',e=>{
  if(panelEl){if(e.key==='Escape')closePanel();return}
  if(e.target.matches&&e.target.matches('select'))return;
  if(mode==='crash'){e.preventDefault();resolver();return}
  if(mode==='typing'){if(e.key==='Enter'||e.key===' '){skip=true;e.preventDefault()}return}
  if(mode==='wait'){if(e.key==='q'||e.key==='Escape')resolver(false);else if(!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();resolver(true)}return}
  if(mode==='ask'){
    if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();hi=Math.max(0,Math.min(hist.length,hi+(e.key==='ArrowUp'?-1:1)));ghost.value=hist[hi]||'';typedEl.textContent=ghost.value;return}
    if(document.activeElement!==ghost){if(e.key==='Enter'){e.preventDefault();resolver(ghost.value.trim())}else if(!e.ctrlKey&&!e.metaKey)ghost.focus()}}
});

function color(s){return esc(s).replace(/\$[\d,]+(\.\d+)?k?/g,m=>`<i class="m">${m}</i>`).replace(/\b(FUNDED|PEACH|OK|STAY|GRANTED|UNDERWRITTEN)\b/g,'<i class="g">$1</i>').replace(/\b(LEMON|BAD|DEFAULT|WITHDRAWN|LEAVE|INSOLVENT|DENIED|SHUT|COLLAPSE|BONK)\b|#/g,m=>`<i class="r">${m}</i>`)}

const IO='IntersectionObserver' in window?new IntersectionObserver(es=>es.forEach(e=>{e.target._vis=e.isIntersecting})):null;
setInterval(()=>{if(document.hidden)return;const now=performance.now();for(let k=LIVE.length-1;k>=0;k--){const L=LIVE[k];if(!L.pre.isConnected){LIVE.splice(k,1);continue}if(L.pre._vis===false||now<L.next)continue;
  L.i++;if(L.i>L.f.n){L.i=0;L.f.reset&&L.f.reset()}L.pre.innerHTML=color(L.f.r(L.i));L.next=now+(L.i===L.f.n?(L.f.hold==null?2400:L.f.hold):1000/L.f.fps)}},40);
async function fig(f,inst){
  const pre=el('pre','fig');out.append(pre);let mx=1;const stp=Math.max(1,Math.floor(f.n/30));for(let i=0;i<=f.n;i+=stp)mx=Math.max(mx,f.r(i).split('\n').length);mx=Math.max(mx,f.r(f.n).split('\n').length);pre.style.minHeight=(mx*1.2)+'em';
  const prev=mode;setMode('typing');inst=inst||!SPEED[S.speed].d;
  if(!inst&&!skip){const first=f.r(0),step=Math.max(2,Math.ceil(first.length/50));let c=0;for(let k=0;k<first.length;k+=step){pre.innerHTML=color(first.slice(0,k))+'█';scroll();if(c++%3===0)play('plot');await sleep(14);if(skip)break}}
  let i=0;pre.innerHTML=color(f.r(0));scroll();
  if(!REDUCED&&!inst){const intro=f.intro==null?f.n:f.intro;while(i<intro&&!skip){await sleep(1000/f.fps);i++;pre.innerHTML=color(f.r(i))}}
  if(f.n&&!f.once&&!REDUCED){IO&&IO.observe(pre);LIVE.push({pre,f,i,next:performance.now()+(i>=f.n?(f.hold==null?2400:f.hold):1000/f.fps)});if(LIVE.length>48){const o=LIVE.shift();o.pre.innerHTML=color(o.f.r(o.f.n))}}

const mc=(q,o,why)=>({t:'mc',q,o,why}),tf=(q,a,why)=>({t:'tf',q,a,why}),fill=(q,a,why)=>({t:'fill',q,a,why}),nm=(q,a,why,u)=>({t:'num',q,a,why,u});
const MODULES=[
{id:'big-picture',title:'THE BIG PICTURE',secs:[
 {h:'What I am',beats:[["A *financial intermediary* stands in the middle. On one side: savers with spare money. On the other: borrowers who can put money to work.","Banks, insurers, pension funds, brokers, mutual funds: all intermediaries."],{fig:'flow'},["That is *indirect finance*. I owe the savers. The borrowers owe me. Saver and borrower never have to meet."],{fig:'direct'},["And that is *direct finance*: the borrower sells a stock or bond straight to the saver in a financial market. Money one way, securities the other."]],
  q:[mc("A company sells newly issued bonds straight to investors in the bond market. This is:",["direct finance","indirect finance","internal finance","deposit finance"],"No institution's balance sheet sits in the middle, so it is direct."),tf("True or false: in indirect finance, a third party stands between the saver and the borrower.",true,"That third party is the intermediary.")],line:"indirect finance runs through an intermediary"},
 {h:'Why anyone should care',beats:[["The financial system is plumbing. When it works, nobody notices. When it breaks, you get an expensive mess."],["Great Depression: banks closed, then unemployment passed *25 percent* and economic activity fell by nearly *a third*. Asia in 1997 and the crisis of 2007-2009 told the same story."],{fig:'crisis'},["Across countries, financial development and income per person move together. The correlation is about *0.6*. Rich countries have deep financial systems."],{fig:'scatter'}],
  q:[mc("The correlation between financial development and real GDP per person is roughly:",["0.6","0.1","-0.6","1.0"],"Positive and strong, but not perfect."),tf("True or false: in the Great Depression, bank closings were followed by unemployment above 25%.",true,"And output fell by nearly a third.")],line:"when finance fails the economy fails with it"},
 {h:'Banks versus markets',beats:[["How big are bank loans next to stock and bond markets? To compare countries, measure everything as a percent of GDP.","*Loans-to-securities ratio = C / (A + B)*","A = stock market value.  B = debt securities.  C = credit from banks."],{fig:'ratio'},["France: 86.7 / (63.3 + 45.2) = *0.80*. Below 1, so markets are a bit bigger than loans there. China's 1.90 means loans dominate.","Trap: these numbers can add up to far more than 100% of GDP. They are not pieces of GDP. A firm is often worth several years of its sales."]],
  q:[nm("Stocks are 80% of GDP, debt securities 40%, bank credit 90%. What is the loans-to-securities ratio? (two decimals)",.75,"90 / (80 + 40) = 0.75"),nm("Stocks are 50% of GDP, debt securities 50%, bank credit 150%. Loans-to-securities ratio?",1.5,"150 / (50 + 50) = 1.50")],line:"bank credit divided by stocks plus bonds"},
 {h:'The eBay puzzle',beats:[["You can buy almost anything on eBay. But nobody auctions off a mortgage there. Why not?"],["Problem one: *transactions costs*. Mort needs $100,000. Finding 100 strangers with $1,000 each, writing the contracts, collecting the payments... a nightmare.","Problem two: *information costs*. Can Mort repay? Will he even buy a house? Strangers can't cheaply find out."],{fig:'ebay'},["Institutions like me exist to cut those two costs. Remember them. The whole chapter hangs on them."]],
  q:[mc("Finding out whether a borrower is trustworthy is a(n):",["information cost","transactions cost","liquidity cost","sunk cost"],"Writing contracts is a transactions cost. Judging trustworthiness is an information cost."),fill("The cost of writing a loan contract is a ___ cost.",["transactions","transaction"],"Transactions costs are the costs of making the deal happen.")],line:"intermediaries cut transactions costs and information costs"}]},
{id:'five-jobs',title:'THE FIVE JOBS',secs:[
 {h:'The list',beats:[["I do five jobs.","  1. *Pooling* savings","  2. *Safekeeping*, payments and accounting","  3. Providing *liquidity*","  4. *Diversifying* risk","  5. Collecting and processing *information*"],{fig:'five'},["Jobs 1 to 4 cut transactions costs. Job 5 stands alone: it cuts information costs.","Memory hook: *P*lease *S*ave *L*ots, *D*iversify *I*ntelligently."]],
  q:[mc("Which job is NOT mainly about cutting transactions costs?",["Collecting and processing information","Providing liquidity","Pooling savings","Diversifying risk"],"Information is in a category of its own."),fill("Please Save Lots, Diversify Intelligently. The L stands for providing ___.",["liquidity"],"Pooling, Safekeeping, Liquidity, Diversification, Information.")],line:"pooling safekeeping liquidity diversification information"},
 {h:'Job 1: pooling',beats:[["Pooling: I take many small deposits and turn them into one big loan.","*Savers needed = loan size / deposit size*"],{fig:'pool'},["To pull that off I need lots of savers, so I must look safe. Once that meant thick vault doors. Today it means reputation and deposit insurance."]],
  q:[nm("A borrower needs $250,000. Each saver deposits $500. How many savers must be pooled?",500,"250,000 / 500 = 500 savers"),nm("A $100,000 loan is funded by $2,000 deposits. How many savers?",50,"100,000 / 2,000 = 50 savers")],line:"many small deposits become one large loan"},
 {h:'Job 2 and the scale trick',beats:[["Goldsmiths were the first bankers. People stored gold with them for a receipt. Then people traded the receipts. Then the goldsmith lent out the idle gold. A bank was born.","Today I keep your money safe, plug you into the *payments system*, and keep your accounts."],{fig:'goldsmith'},["My trick is *economies of scale*: average cost falls as quantity rises.","*Average cost = total cost / quantity*","Say a lawyer charges $5,000 once for a great loan contract, then $2 each time I use it. (Illustrative numbers.)"],{fig:'scale'}],
  q:[mc("One contract, reused for thousands of customers, so the cost per customer keeps falling. This is:",["economies of scale","comparative advantage","diversification","adverse selection"],"Average cost falls as quantity rises."),tf("True or false: with economies of scale, average cost RISES as the quantity produced rises.",false,"It falls.")],line:"average cost falls as quantity rises"}]},
{id:'liquidity-diversification',title:'LIQUIDITY AND DIVERSIFICATION',secs:[
 {h:'Job 3: liquidity',beats:[["*Liquidity* is how quickly and cheaply an asset turns into a means of payment. An ATM turns your balance into cash on demand."],["How do I promise instant cash when my money is tied up in long loans? Same way an insurer survives: not every driver crashes on the same day, and *not every depositor withdraws on the same day*.","So I keep a slice in short-term liquid assets and lend the rest long-term at higher rates. You get liquidity and a better return."],{fig:'liquidity'},["I also sell liquidity as a *line of credit*: a pre-approved loan you draw on when needed. Unlike a deposit, you can take out more than you put in."]],
  q:[mc("A bank can offer instant withdrawals while making long-term loans because:",["not all depositors withdraw at the same time","loans can be called in overnight","deposit insurance pays the withdrawals","it never lends out deposits"],"So a modest liquid cushion is enough."),tf("True or false: with a line of credit, withdrawals can exceed your deposit balance.",true,"It is a pre-approved loan.")],line:"not every depositor withdraws on the same day"},
 {h:'Job 4: diversification',beats:[["Don't put all your eggs in one basket. Watch six simulated years. Same money, lent two ways. (o = repaid, # = default)"],{fig:'diversify'},["The average loss is about the same either way. What changes is the *disaster*. One loan can wipe you out. Fifty rarely move much.","Textbook version: 1,000,000 depositors x $1,000 = $1 billion, lent as 10,000 loans. Each deposit has just *10 cents* in each loan."],["Mutual funds do it for stocks. One share of each S&P 500 firm at $40 to $60 would cost over *$20,000*. A fund sells you a sliver of all 500."]],
  q:[nm("A bank spreads each $1,000 deposit evenly across 10,000 loans. How many dollars sit in each loan?",.1,"1,000 / 10,000 = $0.10. Ten cents."),mc("Spreading money across many borrowers mainly:",["cuts the chance of a disastrous loss","raises the average interest rate earned","guarantees no borrower defaults","removes the need to screen borrowers"],"The average loss stays about the same. The disasters go away.")],line:"spread the money and the disasters disappear"}]},
{id:'asymmetric-information',title:'ASYMMETRIC INFORMATION',secs:[
 {h:'The information gap',beats:[["Here is my real problem. The borrower always knows more than I do: about their business, their plans, their honesty.","That gap is *asymmetric information*. It makes financial markets some of the hardest markets to run."],{fig:'gap'},["eBay had the same problem with strangers selling to strangers. Its two fixes: a *feedback forum*, so sellers build a reputation, and *buyers' insurance*, in case the seller takes the money and runs.","Hold that thought. Banks do the same two things under other names."]],
  q:[fill("When one side of a deal knows more than the other, there is ___ information.",["asymmetric"],"Asymmetric means unequal."),mc("Asymmetric information in lending means:",["borrowers know more about themselves than lenders do","lenders know more than borrowers","both sides know everything","nobody knows the interest rate"],"The borrower holds the hidden knowledge.")],line:"the borrower knows more than the lender"},
 {h:'Before and after',beats:[["That gap causes two different problems. The trick is *when* each one strikes."],{fig:'timeline'},["*Adverse selection*: BEFORE the deal. Hidden *attributes*. I can't tell good borrowers from bad, and the worst ones are the most eager to borrow.","*Moral hazard*: AFTER the deal. Hidden *actions*. I can't see what you do with my money."],["Hook: *A*dverse selection comes first, like A in the alphabet, and is about *A*ttributes. *M*oral hazard comes later and is about *M*isbehaviour.","On eBay: 'Is this item as described?' is adverse selection. 'Will the seller ship it?' is moral hazard."]],
  q:[mc("Adverse selection arises ___ the deal and concerns hidden ___.",["before / attributes","before / actions","after / attributes","after / actions"],"Before, attributes. Moral hazard is after, actions."),mc("A firm takes a loan for equipment, then quietly bets it on the stock market. This is:",["moral hazard","adverse selection","the free-rider problem","diversification"],"A hidden action after the deal.")],line:"adverse selection before moral hazard after"}]},
{id:'adverse-selection',title:'ADVERSE SELECTION',secs:[
 {h:'The market for lemons',beats:[["George Akerlof, 1970 (Nobel Prize, 2001). Two used cars. A *peach* worth $20,000 and a *lemon* worth $10,000. Owners know which is which. Buyers don't."],{fig:'lemons'},["*Offer = share of peaches x peach value + share of lemons x lemon value*","0.5 x $20,000 + 0.5 x $10,000 = *$15,000*. Too low for the peach owner. The good car leaves. Only the lemon is left.","That is adverse selection: when buyers can't see quality they pay the average, and the average drives out the good."],["The cure is information: history reports, mechanics, dealer reputations, warranties. Once buyers can see quality, both cars sell at their true value."]],
  q:[nm("Half the cars are peaches worth $20,000 and half are lemons worth $10,000. Buyers can't tell. What do they offer, in dollars?",15000,"0.5 x 20,000 + 0.5 x 10,000 = 15,000",'$'),nm("80% of cars are peaches worth $20,000; 20% are lemons worth $10,000. Buyers can't tell. What do they offer?",18000,"0.8 x 20,000 + 0.2 x 10,000 = 18,000. If peach owners accept that, the market survives.",'$')],line:"buyers pay the average so the good cars leave"},
 {h:'Lemons in stocks and bonds',beats:[["Same story in finance. Two firms, one good, one bad. Investors can't tell, so they pay an average price for shares. The good firm's stock is undervalued, so it doesn't issue any. Only the bad firm is left."],["Bonds too. Risk needs compensation, so risky borrowers should pay more. If I can't tell who is who, I charge everyone the average.","*Pooled rate = risk-free rate + average risk premium*"],{fig:'bonds'},["Safe firms are overcharged, so they walk. I am left holding the risky ones. Nobody wants that, so the market can vanish."]],
  q:[nm("The risk-free rate is 5%. Safe firms deserve a 2% premium, risky firms 6%. Equal numbers, and you can't tell them apart. What rate (%) do you charge?",9,"5 + (2 + 6) / 2 = 9%",'%'),mc("When everyone is charged that pooled rate, who leaves the market?",["the safe firms","the risky firms","both types","neither type"],"Safe firms are overcharged. Risky firms get a bargain and stay.")],line:"good borrowers leave when everyone pays the average rate"},
 {h:'Your first credit card',beats:[["Adverse selection, real life edition: your first credit card. No credit history, so the issuer assumes the worst and lumps you in with people who can't get credit anywhere else. Sky-high rate."],{fig:'card'},["Why society cares: when good firms can't get fair financing, good investments never happen, and the economy grows more slowly."]],
  q:[mc("A first credit card carries a very high rate mainly because of:",["adverse selection: no history, so you're pooled with bad risks","moral hazard: students always overspend","the free-rider problem","economies of scale"],"The issuer can't tell you from a bad risk, and the loan is unsecured."),tf("True or false: adverse selection can cause a market to shrink or even disappear.",true,"Good sellers and borrowers leave, and nobody wants what remains.")],line:"no credit history means pooled with the bad risks"}]},
{id:'fixing-adverse-selection',title:'FIXING ADVERSE SELECTION',secs:[
 {h:'Fix 1 and 2: more information',beats:[["Two ways to fix adverse selection: create more information, or make sure the lender gets paid anyway.","First, information. *Government-required disclosure*: public companies must publish standard financial statements. Helpful, but Enron and WorldCom showed that statements can be faked."],["*Private information*: firms like Moody's and Value Line research companies and sell reports.","The catch is the *free rider*: someone who gets the benefit without paying. Read the report at a library, see it in the news, copy a subscriber. So researchers can't earn enough, and too little gets produced."],{fig:'freerider'}],
  q:[mc("Private research services can't fully solve adverse selection because of:",["the free-rider problem","restrictive covenants","deflation","limited liability"],"People use the information without paying for it."),fill("Someone who gets the benefit of a good without paying for it is a ___ rider.",["free"],"Free riders undermine private information.")],line:"free riders use information without paying for it"},
 {h:'Fix 3 and 4: collateral and net worth',beats:[["Second approach: guarantee the lender gets paid.","*Collateral* is something of value pledged in case of default. A house backs a mortgage. A car backs a car loan. If the loan is covered, I care less who you are.","No collateral? That is an *unsecured loan*, like a credit card. Expect a very high rate."],{fig:'collateral'},["*Net worth = assets - liabilities*. It is the owner's own stake. If the project fails, I can be repaid out of it. A down payment on a house does the same job.","This is why new businesses struggle to borrow: no net worth yet. Owners end up pledging their homes."],{fig:'downpay'}],
  q:[fill("Something of value pledged to the lender in case of default is ___.",["collateral"],"Houses for mortgages, cars for car loans."),nm("A firm has assets of $500 million and liabilities of $350 million. Net worth, in $ millions?",150,"500 - 350 = 150")],line:"net worth equals assets minus liabilities"},
 {h:'Deflation',beats:[["*Deflation* means prices fall on average. It is poison for borrowers. Watch what it does to a firm with $100 of assets and $60 of debt."],{fig:'networth',a:[-30]},["The debt is fixed in dollars. The assets shrink with prices. So net worth takes the whole hit.","Less net worth means the firm looks less trustworthy. Lenders pull back and investment falls. The same thing happens at the start of a recession."]],
  q:[nm("Assets $100, debt $60. Deflation cuts asset values by 20%; the debt is unchanged. New net worth, in dollars?",20,"Assets fall to $80. 80 - 60 = 20. Net worth halved from $40.",'$'),mc("Deflation hurts borrowers because:",["debts stay fixed in dollars while asset values fall","interest rates always rise","collateral becomes more valuable","banks stop taking deposits"],"So net worth shrinks.")],line:"deflation shrinks assets but not debts"},
 {h:'The hot potato',beats:[["Crisis of 2007-2009. Screening failed at every step of mortgage securitization. Watch the potato."],{fig:'potato'},["Everyone assumed the collateral, houses, would keep rising in value. When prices fell, the houses no longer covered the loans.","Lesson: screening and monitoring matter, free riding destroys them, and collateral only protects you if it holds its value."]],
  q:[mc("Investors who trusted the ratings instead of checking the loans themselves were:",["free riding","monitoring","diversifying","screening"],"They relied on someone else's (weak) screening."),mc("Collateral failed to protect investors in the crisis because:",["house prices fell below the loan amounts","houses can't legally be collateral","borrowers had too much net worth","rating agencies owned the houses"],"Collateral is only as good as its value.")],line:"collateral only helps if it holds its value"}]},
{id:'moral-hazard',title:'MORAL HAZARD',secs:[
 {h:'Moral hazard in equity',beats:[["*Moral hazard* began as an insurance term: a policy changes how the insured behaves. Insure a car generously, get reckless driving. Fraud is the extreme case.","In stocks it is the *principal-agent problem*. Owners are principals. Managers are agents. Managers run the firm for themselves: jets, art, big pay."],{fig:'ponzi'},["Meet cousin Ina. Her software idea costs $10,000. She has $1,000 (10%). You put in $9,000 (90%). Work hard: worth $100,000. Go surfing: worth $10,000. And you can't watch her."],{fig:'ina',a:['equity',1000]},["Surfing costs her $9,000. It costs you *$81,000*. She gets all the beach and a tenth of the bill."]],
  q:[nm("Ina owns 10%, you own 90%. Slacking drops the value from $100,000 to $10,000. How many dollars does it cost YOU?",81000,"The loss is $90,000. Your 90% share of it is $81,000.",'$'),fill("In the principal-agent problem, owners are the principals and managers are the ___.",["agents","agent"],"Agents act on the principals' behalf, in theory.")],line:"managers enjoy the perks and owners pay the bill"},
 {h:'Moral hazard in debt',beats:[["Try a loan instead. Lend Ina $9,000 at 11%.","*Repayment = loan x (1 + interest rate)* = $9,000 x 1.11 = *$9,990*, whatever happens."],{fig:'ina',a:['debt',1000]},["Now slacking costs HER. Debt fixes the surfing problem.","But look at the gamble rows (an illustrative $500,000 jackpot). If a wild bet pays off, she keeps everything above $9,990. If it fails, *limited liability* means I eat the loss. Heads she wins, tails I lose. Debt invites risk-taking."]],
  q:[nm("You lend $9,000 for one year at 11%. How many dollars must be repaid?",9990,"9,000 x 1.11 = 9,990",'$'),mc("Debt does not eliminate moral hazard because the borrower:",["keeps the upside but has limited liability for losses","stops caring whether the project succeeds","becomes a part-owner of the bank","can skip interest payments"],"That tempts borrowers to take big risks with the lender's money.")],line:"borrowers keep the upside and lenders eat the downside"},
 {h:'The fixes',beats:[["Fixes for equity: make managers *own a stake*, and make them *report to owners* who can fire them.","Stock options were tried in the 1990s. Some managers faked profits to pump the share price and cash in. Backfired."],["Fix for debt: *restrictive covenants*. Contract clauses that limit what you may do with my money: what you can buy, a minimum net worth, a minimum bank balance. Mortgages require fire insurance."],{fig:'covenant'}],
  q:[mc("'Use this loan only for equipment and keep $50,000 in your account.' That clause is a:",["restrictive covenant","collateral pledge","disclosure rule","line of credit"],"Covenants restrict the borrower's behaviour after the loan."),tf("True or false: stock options turned out to be a foolproof cure for the principal-agent problem.",false,"Some managers misrepresented profits to cash in.")],line:"restrictive covenants limit what borrowers can do"}]},
{id:'intermediaries-fix-it',title:'HOW INTERMEDIARIES FIX IT',secs:[
 {h:'Screening',beats:[["Now my part. Against adverse selection I *screen and certify* before the deal."],{fig:'screen'},["*Credit scores*: a company gathers your history and charges a fee every time someone looks. Pay-per-view kills the free rider.","*Your account*: I see your deposits and withdrawals. That private knowledge is why small firms depend on banks.","*Underwriters*: big names like Goldman Sachs put their brand behind a new stock or bond, the way a famous label vouches for what's in the can."],{fig:'stamp'}],
  q:[mc("Checking an applicant's credit score BEFORE lending is ___ and fights ___.",["screening / adverse selection","monitoring / moral hazard","screening / moral hazard","monitoring / adverse selection"],"Screen before. Monitor after."),mc("Credit-score companies beat the free-rider problem by:",["charging a fee each time a score is viewed","publishing scores for everyone","being paid by the borrower","relying on government grants"],"No pay, no look.")],line:"screen before the deal to fight adverse selection"},
 {h:'Monitoring',beats:[["Against moral hazard I *monitor* after the deal. Example: I lend a car dealer money to stock the lot. Then I send someone to count the cars."],{fig:'monitor'},["Others monitor too. Pension funds research firms and may put a director on the board. *Venture capital* firms fund risky start-ups for a stake and watch the managers closely.","And the *threat of takeover*: run the firm badly and someone buys it and replaces you."]],
  q:[mc("A bank counts the cars on a dealer's lot after making the loan. This is:",["monitoring, against moral hazard","screening, against adverse selection","certifying, against free riders","pooling, against transactions costs"],"The loan already exists, so it is monitoring."),mc("Venture capital firms deal with moral hazard by:",["taking a stake and watching managers closely","lending only against houses","relying on SEC disclosure","diversifying so widely they needn't watch"],"Ownership plus close monitoring.")],line:"monitor after the deal to fight moral hazard"},
 {h:'The humbling ending',beats:[["A modern wrinkle: *intangible capital*. Software, data, research, training. You can't resell it easily, so it is poor collateral. Software firms' debt is about 10% of book equity. Restaurants: nearly 95%."],{fig:'intangible'},{fig:'debtbars'},["And even with all my screening and monitoring, the vast majority of business investment is paid for from *internal sources*: the firm's own funds.","Information problems are too big for even me to solve completely. End of chapter."],{fig:'internal'}],
  q:[mc("Software firms borrow far less than restaurants because their assets:",["are intangible and make poor collateral","are too profitable to need loans","can't legally back a loan","are monitored by the SEC"],"Lenders can't seize and resell code the way they can a building."),fill("The vast majority of business investment is financed from ___ sources.",["internal"],"The firm's own funds.")],line:"most investment is financed from internal sources"}]}
];

/* ================= question engine ================= */
async function quiz(q,o={}){
  await type(q.q,{cls:'q'});let chips=[],key,correct,opts,gone=[];
  if(q.t==='mc'){opts=shuffle(q.o);for(let i=0;i<opts.length;i++)await type(`${'abcd'[i]}) ${opts[i]}`,{cls:'opt',turbo:true});key='abcd'[opts.indexOf(q.o[0])];correct=key+') '+q.o[0];chips=[...'abcd'].slice(0,opts.length)}
  else if(q.t==='tf'){key=q.a?'true':'false';correct=q.a?'TRUE':'FALSE';chips=['true','false']}
  else if(q.t==='fill'){key=q.a[0];correct=q.a[0]}
  else{key=String(q.a);correct=q.u==='$'?fmt(q.a):q.a+(q.u==='%'?'%':'')}
  for(;;){const v=await askQ({chips:chips.concat(o.noHint?[]:['hint']),ps:'<i class="a">answer</i>&gt;',timeout:o.timeout,ans:key});
    if(v===null)return{ok:false,correct,timeout:true};const a=v.toLowerCase();
    if(a==='hint'&&!o.noHint){if(q.t==='mc'){const w=[...'abcd'].slice(0,opts.length).filter(k=>k!==key&&!gone.includes(k));if(w.length>1){const g=pick(w);gone.push(g);await type(`hint: it is not ${g}.`,{cls:'dim'})}else await type('No more hints. Commit.',{cls:'dim'})}
      else if(q.t==='fill')await type(`hint: ${key.length} letters, starts with "${key[0]}".`,{cls:'dim'});else if(q.t==='tf')await type('hint: it is one of the two.',{cls:'dim'});else await type('hint: write out the formula, then plug in.',{cls:'dim'});continue}
    if(a==='help'||a==='?'){await type("Answer the question. Also: hint · quit · theme · sound · speed · difficulty · status",{cls:'dim'});continue}
    if(!a)continue;
    if(q.t==='mc'){const k='abcd'.includes(a[0])&&(a.length===1||a[1]===')')?a[0]:null;if(!k||'abcd'.indexOf(k)>=opts.length){await type('Type a letter: '+chips.join(', ')+'.',{cls:'dim'});continue}return{ok:k===key,correct}}
    if(q.t==='tf'){if(!/^(t|f|true|false|y|n|yes|no)$/.test(a)){await type('Type true or false.',{cls:'dim'});continue}return{ok:(/^(t|y)/.test(a))===q.a,correct}}
    if(q.t==='fill')return{ok:q.a.map(norm).includes(norm(a)),correct};
    const n=num(a);if(isNaN(n)){await type('I need a number.',{cls:'dim'});continue}return{ok:Math.abs(n-q.a)<=Math.max(Math.abs(q.a)*.006,.006),correct}}
}
const PRAISE=['Correct.','Yes.','Right.','Exactly.','Good.','That is it.'];
async function good(q){streak++;S.xp+=10;save();play('correct');await type(`[ OK ] ${pick(PRAISE)} ${q.why||''}`,{cls:'ok'});
  if(streak%3===0&&integrity<100){integrity=Math.min(100,integrity+10);play('streak');await type(`       three in a row: patch applied, integrity +10 → ${integrity}%`,{cls:'ok',turbo:true})}updateStatus()}
async function crashFx(){play('wrong');win.classList.add('shake');setTimeout(()=>win.classList.remove('shake'),480);skip=false;for(const l of TH[S.theme].crash)await type(l,{cls:'err',turbo:true})}
function meltdown(title,body){return new Promise(res=>{play('meltdown');crashEl.textContent=`\n  *** ${title} ***\n\n${body}\n\n  Press any key to continue _`;crashEl.hidden=false;setMode('idle');setTimeout(()=>{setMode('crash');resolver=()=>{crashEl.hidden=true;setMode('idle');res()}},700)})}
async function detention(line,times){await say([`Detention. Type this line${times>1?' '+times+' times':''}. Exactly.`]);
  for(let k=0;k<times;k++)for(;;){await type('  '+line,{cls:'acc',turbo:true});const v=await askQ({ps:`<i class="a">line ${k+1}/${times}</i>&gt;`,ans:line});if(norm(v)===norm(line)){play('advance');break}play('deny');await type('Not the same. Again. Slowly.',{cls:'err'})}}

async function playSection(sec,si,replay){turbo=replay;auto=replay;try{
  await type(`§${si+1} ${sec.h}${replay?'  (replay ▶▶)':''}`,{cls:'hd'});
  for(const b of sec.beats){if(Array.isArray(b)){await say(b);await wait()}else await fig(FIG[b.fig](...(b.a||[])),replay)}
 }finally{turbo=false;auto=false}}
async function runModule(mi){const M=MODULES[mi];
  for(;;){integrity=100;streak=0;let dead=false;loc=`${mi+1}/8`;updateStatus();
    await type(`MODULE ${mi+1} OF 8 · ${M.title}`,{cls:'hd'});
    for(let si=0;si<M.secs.length&&!dead;si++){const sec=M.secs[si];let fails=0,replay=false,show=true;
      for(;;){loc=`${mi+1}/8 §${si+1}/${M.secs.length}`;updateStatus();
        if(show)await playSection(sec,si,replay);
        await type('CHECKPOINT',{cls:'hd2'});
        const q=sec.q[fails%sec.q.length],r=await quiz(q);
        if(r.ok){await good(q);break}
        fails++;streak=0;await crashFx();await say([`Wrong. The answer was *${r.correct}*.`,q.why]);
        if(S.diff==='chill'){await say(["Chill mode: no penalty. Different question, same idea."]);show=false;continue}
        if(S.diff==='hardcore'){dead=true;break}
        integrity=Math.max(0,integrity-25);updateStatus();await type(`integrity -25% → ${integrity}%  [${bar(integrity,100,20)}]`,{cls:'err',turbo:true});
        if(integrity<=0){dead=true;break}
        await detention(sec.line,Math.min(fails,3));
        await say(["Now we do the section again. Then a different question."]);play('rewind');await fig(FIG.rewind(),false);replay=true;show=true}}
    if(!dead)break;
    await meltdown('CORE MELTDOWN',`  A fatal exception 0x11 has occurred in MODULE ${mi+1}.\n\n  ${S.diff==='hardcore'?'Hardcore mode: one wrong answer is fatal.':'Integrity reached 0%.'}\n  Everything from this module has been dumped on the vault floor.\n\n  * The module will restart from section 1.\n  * Tip: type "hint" at a question, or "difficulty chill".`);
    out.innerHTML='';await say([`Rebooted. Module ${mi+1}, from the top, ${S.name||'operator'}.`])}
  const first=!S.done[mi];S.done[mi]=1;S.xp+=50;save();updateStatus();
  const all=Object.keys(S.done).length===MODULES.length;play(all&&first?'chapter':'module');
  await type(`MODULE ${mi+1} COMPLETE · +50 xp · integrity ${integrity}%`,{cls:'hd'});await fig(FIG.fireworks(),true);
}

const ALIAS={'1':'learn','2':'bank','3':'boss','4':'crack','5':'lab','6':'man','7':'gallery','?':'help',dir:'ls',type:'cat',quit:'exit',q:'exit',start:'learn',study:'learn',exam:'boss',test:'boss',sim:'lab',cheatsheet:'cheat',bonds:'rate',deflation:'deflate',networth:'deflate',glossary:'man',hi:'hello',pictures:'gallery',animations:'gallery',inventory:'terms',play:'show'};
async function runCmd(v){const[c0,...a]=v.trim().split(/\s+/),c1=c0.toLowerCase(),c=SALIAS[c1]||ALIAS[c1]||c1,f=SYS[c]||CMD[c];
  if(!f){play('deny');await type(TH[S.theme].nf(c0),{cls:'err',turbo:true});await type('Type *help* for the list.',{cls:'dim',turbo:true});return}
  try{await f(a)}catch(e){turbo=false;auto=false;if(e===ABORT){await type('^C',{cls:'dim'});await type('Back at the shell. Finished modules are saved.',{cls:'dim',turbo:true})}else{console.error(e);await type('internal error: '+e.message,{cls:'err'})}}
  ctx='shell';loc='';updateStatus()}
async function menu(){skip=false;for(const l of ["*WHAT DO YOU WANT TO DO?*","  1  *learn*    guided course. I teach, I ask, you answer.","  2  *bank*     you run the bank. Eight decisions. Don't go bust.","  3  *boss*     final exam. Fight THE LEMON.","  4  *crack*    decrypt the key terms.","  5  *lab*      simulators you run with commands.","  6  *man*      look up any term.","  7  *gallery*  the whole chapter as looping animations.","Type a number or a command. *help* lists everything."])await type(l,{turbo:true})}
async function shell(){for(;;){ctx='shell';updateStatus();const v=await rawAsk({chips:['learn','bank','boss','crack','gallery','lab','help']});if(v)await runCmd(v)}}

const rain=$('#rain');let rainT=null;
function rainFx(on){clearInterval(rainT);rainT=null;if(!on||REDUCED)return;const c=rain.getContext('2d');let cols=[];const size=()=>{rain.width=innerWidth;rain.height=innerHeight;cols=Array.from({length:Math.ceil(innerWidth/16)},()=>Math.random()*-40)};size();onresize=size;
  rainT=setInterval(()=>{if(document.hidden)return;c.fillStyle='rgba(0,0,0,.09)';c.fillRect(0,0,rain.width,rain.height);c.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--fg');c.font='15px monospace';cols.forEach((y,i)=>{c.fillText(pick([...'$¢€£¥0123456789%']),i*16,y*16);cols[i]=y*16>rain.height&&Math.random()>.975?0:y+1})},70)}
function setTheme(n){if(!TH[n])n='linux';const t=TH[n],r=document.documentElement,c=t.c.split(' ');S.theme=n;
  ['bg','fg','dim','acc','ok','err','info','bar','barfg','cbg','cfg'].forEach((k,i)=>r.style.setProperty('--'+k,c[i]));
  r.style.setProperty('--glow',t.glow||'none');r.style.setProperty('--font',t.font||FONT);r.style.setProperty('--frame',t.frame||'transparent');r.style.setProperty('--fw',t.frame?'clamp(8px,3.2vw,36px)':'0px');r.style.setProperty('--bgimg',t.bgimg||'none');
  r.dataset.cur=t.cur||'block';r.dataset.fx=t.fx||'';r.dataset.chrome=t.chrome||'none';r.toggleAttribute('data-upper',!!t.upper);
  $('#ttl').textContent=t.title;rainFx(t.fx==='matrix');save();syncUI();if(mode==='ask'&&ctx==='shell')ps1El.innerHTML=t.ps1}
function syncUI(){$('#bTheme').textContent='▦ '+(TH[S.theme]?TH[S.theme].label:'terminal');$('#sSpeed').value=S.speed;$('#sDiff').value=S.diff;$('#bSound').textContent='♪ '+(S.sound&&S.vol?S.vol+'%':'off');if(MG)MG.gain.value=Math.pow(S.vol/100,1.5)*.7;updateStatus()}
$('#bTheme').onclick=e=>{e.target.blur();themePanel()};$('#bSound').onclick=e=>{e.target.blur();soundPanel()};
$('#sSpeed').onchange=e=>{S.speed=e.target.value;save();e.target.blur()};$('#sDiff').onchange=e=>{S.diff=e.target.value;save();updateStatus();e.target.blur()};
async function boot(){ctx='boot';skip=false;play('boot');for(const l of TH[S.theme].boot)await type(l,{cls:'dim',turbo:true});
  await fig(FIG.logo());
  if(!S.name){await say(["Vault terminal online. I am TELLER, the oldest machine in this bank.","I know Chapter 11 by heart: why banks exist, and the two information problems that haunt every loan.","I teach one piece at a time. After each piece I ask a question. Get it wrong and there are consequences."]);
    await say(["Name for the logbook?"]);const v=await rawAsk({ps:'<i class="a">login</i>:',ans:'operator'});S.name=(v||'operator').slice(0,24);save();
    await say([`Logged in as *${S.name}*. While I type, press Enter or Space to skip ahead. The top bar changes the terminal, the speed, the difficulty and the sound.`])}
  else await say([`Welcome back, *${S.name}*. ${Object.keys(S.done).length}/8 modules done, ${S.xp} xp, ${Object.keys(S.terms).length}/${GLOSS.length} terms collected.`]);
  await menu()}
